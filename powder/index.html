<title>Treeline Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root { --bg: #0b3b8c; --ink: #ffffff; --panel: rgba(4, 21, 48, .78); --accent: #5ea0f2; --ice: #bfe0ff; color-scheme: dark;
  --f-display: "Bungee", "Arial Black", Impact, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-mono); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
.hud div { background: var(--panel); border-radius: 12px; padding: 8px 14px; font-variant-numeric: tabular-nums; }
.hud small { display: block; font-size: 10px; letter-spacing: .14em; color: var(--ice); }
.hud b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(4, 21, 48, .45); }
.screen[hidden] { display: none; }
.card { background: var(--panel); border: 1px solid rgba(191,224,255,.3); border-radius: 18px; padding: 28px; max-width: 420px; text-align: center; backdrop-filter: blur(6px); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 9vw, 56px); margin: 0 0 6px; line-height: 1; text-shadow: 0 3px 0 #041530; }
p { color: var(--ice); line-height: 1.55; margin: 10px 0; }
.big { font-family: var(--f-display); font-size: 40px; color: #fff; margin: 6px 0; }
button { font: 700 16px var(--f-mono); background: #fff; color: #0b3b8c; border: 0; border-radius: 12px; padding: 13px 26px; cursor: pointer; margin-top: 10px; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
kbd { background: rgba(255,255,255,.15); border-radius: 5px; padding: 1px 6px; }
</style>

<canvas id="c"></canvas>
<div class="hud"><div><small>DISTANCE</small><b id="score">0 m</b></div><div style="text-align:right"><small>BEST</small><b id="best">0 m</b></div></div>
<div class="screen" id="start"><div class="card">
  <h1>Treeline Run</h1>
  <p>Carve down the mountain. Dodge trees and rocks. The longer you ride, the faster it gets and the higher your score.</p>
  <p><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to steer · on a phone, hold the left or right side of the screen</p>
  <button id="go">Drop in</button>
</div></div>
<div class="screen" id="over" hidden><div class="card">
  <h1 id="crashTitle">Yard sale!</h1>
  <p id="crashWhy">You hit a tree.</p>
  <div class="big" id="final">0 m</div>
  <p id="bestLine"></p>
  <button id="again">Ride again</button>
</div></div>

<script>
(() => {
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W, H, dpr;
function size() { dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener("resize", size); size();

let best = 0; try { best = +localStorage.getItem("treeline-best") || 0; } catch (e) {}
const $ = id => document.getElementById(id);
$("best").textContent = best + " m";

const keys = { l: false, r: false };
addEventListener("keydown", e => { if (["ArrowLeft", "a", "A"].includes(e.key)) keys.l = true; if (["ArrowRight", "d", "D"].includes(e.key)) keys.r = true;
  if ((e.key === " " || e.key === "Enter") && !running) { e.preventDefault(); start(); } });
addEventListener("keyup", e => { if (["ArrowLeft", "a", "A"].includes(e.key)) keys.l = false; if (["ArrowRight", "d", "D"].includes(e.key)) keys.r = false; });
const touches = new Map();
const syncTouch = () => { keys.l = [...touches.values()].some(x => x < W / 2); keys.r = [...touches.values()].some(x => x >= W / 2); };
cv.addEventListener("pointerdown", e => { touches.set(e.pointerId, e.clientX); syncTouch(); });
cv.addEventListener("pointermove", e => { if (touches.has(e.pointerId)) { touches.set(e.pointerId, e.clientX); syncTouch(); } });
["pointerup", "pointercancel", "pointerleave"].forEach(t => cv.addEventListener(t, e => { touches.delete(e.pointerId); syncTouch(); }));

let running = false, obs, trail, flakes, px, vx, speed, dist, last, spawnY, shake;
function reset() {
  obs = []; trail = []; px = W / 2; vx = 0; speed = 220; dist = 0; spawnY = 0; shake = 0;
  flakes = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + .5 }));
  for (let y = H * .55; y < H + 200; y += 60) spawnRow(y, true);
}
function spawnRow(y, easy) {
  const n = easy ? 1 : 1 + Math.floor(Math.random() * (2 + dist / 600));
  for (let i = 0; i < n; i++) {
    const roll = Math.random();
    const type = roll < .62 ? "tree" : roll < .9 ? "rock" : "bump";
    const s = type === "tree" ? 18 + Math.random() * 14 : type === "rock" ? 12 + Math.random() * 12 : 16;
    obs.push({ x: Math.random() * W, y: y + Math.random() * 40, type, s, seed: Math.random() });
  }
}
function start() { reset(); running = true; $("start").hidden = true; $("over").hidden = true; last = performance.now(); requestAnimationFrame(loop); }
$("go").onclick = start; $("again").onclick = start;

const riderY = () => H * .3;
function loop(t) {
  const dt = Math.min(.035, (t - last) / 1000); last = t;
  if (running) update(dt);
  draw();
  if (running || shake > 0) requestAnimationFrame(loop);
}
function update(dt) {
  speed = Math.min(900, 220 + dist * .55);
  const steer = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  vx += steer * 1700 * dt; vx *= Math.pow(.02, dt); vx = Math.max(-420, Math.min(420, vx));
  px = Math.max(14, Math.min(W - 14, px + vx * dt));
  const dy = speed * dt;
  dist += dy / 10;
  obs.forEach(o => o.y -= dy); trail.forEach(p => p.y -= dy);
  obs = obs.filter(o => o.y > -60); trail = trail.filter(p => p.y > -20);
  trail.push({ x: px, y: riderY() + 10 });
  spawnY -= dy;
  const gap = Math.max(34, 90 - dist / 40);
  while (spawnY < 0) { spawnRow(H + 60, false); spawnY += gap; }
  flakes.forEach(f => { f.y -= dy * .25; f.x += Math.sin(f.y / 40) * .3; if (f.y < 0) { f.y = H; f.x = Math.random() * W; } });
  for (const o of obs) {
    if (o.type === "bump") continue;
    const hitR = o.type === "tree" ? o.s * .45 : o.s * .8;
    const oy = o.type === "tree" ? o.y + o.s * .6 : o.y;
    if (Math.hypot(o.x - px, oy - riderY()) < hitR + 8) return crash(o.type);
  }
  for (const o of obs) if (o.type === "bump" && Math.abs(o.x - px) < 18 && Math.abs(o.y - riderY()) < 8) dist += 5;
  $("score").textContent = Math.floor(dist) + " m";
}
function crash(type) {
  running = false; shake = 1;
  const d = Math.floor(dist), nb = d > best;
  if (nb) { best = d; try { localStorage.setItem("treeline-best", best); } catch (e) {} }
  $("best").textContent = best + " m";
  $("crashTitle").textContent = type === "tree" ? "Tree hugger!" : "Rocked!";
  $("crashWhy").textContent = type === "tree" ? "You clipped a pine." : "You found a rock under the powder.";
  $("final").textContent = d + " m";
  $("bestLine").textContent = nb ? "New personal best!" : `Best: ${best} m`;
  setTimeout(() => { $("over").hidden = false; $("again").focus(); }, 450);
}
function draw() {
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - .5) * 14 * shake; sy = (Math.random() - .5) * 14 * shake; shake = Math.max(0, shake - .04); }
  g.save(); g.translate(sx, sy);
  const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, "#eef6ff"); grd.addColorStop(1, "#d6e8ff");
  g.fillStyle = grd; g.fillRect(-20, -20, W + 40, H + 40);
  g.strokeStyle = "rgba(94,160,242,.45)"; g.lineWidth = 3; g.beginPath();
  trail.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.stroke();
  [...obs].sort((a, b) => a.y - b.y).forEach(drawObs);
  drawRider();
  g.fillStyle = "rgba(255,255,255,.9)"; flakes.forEach(f => { g.beginPath(); g.arc(f.x, f.y, f.r, 0, 7); g.fill(); });
  g.restore();
}
function drawObs(o) {
  const { x, y, s } = o;
  if (o.type === "tree") {
    g.fillStyle = "rgba(11,59,140,.15)"; g.beginPath(); g.ellipse(x + 6, y + s * .7, s * .55, s * .18, 0, 0, 7); g.fill();
    g.fillStyle = "#6b4a2b"; g.fillRect(x - 3, y + s * .35, 6, s * .35);
    for (let k = 0; k < 3; k++) { const w = s * (.75 - k * .18), top = y - s * .9 + k * s * .32;
      g.fillStyle = k % 2 ? "#14603e" : "#0f4f33"; g.beginPath(); g.moveTo(x, top - s * .15); g.lineTo(x + w, top + s * .55); g.lineTo(x - w, top + s * .55); g.fill();
      g.fillStyle = "#fff"; g.beginPath(); g.moveTo(x, top - s * .15); g.lineTo(x + w * .35, top + s * .1); g.lineTo(x - w * .35, top + s * .1); g.fill(); }
  } else if (o.type === "rock") {
    g.fillStyle = "#5e6b7d"; g.beginPath(); g.moveTo(x - s, y + s * .4); g.lineTo(x - s * .6, y - s * .5); g.lineTo(x + s * .2, y - s * .7); g.lineTo(x + s, y - s * .1); g.lineTo(x + s * .8, y + s * .45); g.closePath(); g.fill();
    g.fillStyle = "#8a96a8"; g.beginPath(); g.moveTo(x - s * .6, y - s * .5); g.lineTo(x + s * .2, y - s * .7); g.lineTo(x, y - s * .1); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.ellipse(x - s * .1, y - s * .55, s * .35, s * .12, -.2, 0, 7); g.fill();
  } else {
    g.fillStyle = "rgba(255,255,255,.95)"; g.beginPath(); g.ellipse(x, y, s * 1.2, s * .45, 0, 0, 7); g.fill();
    g.strokeStyle = "rgba(94,160,242,.4)"; g.lineWidth = 2; g.stroke();
  }
}
function drawRider() {
  const x = px, y = riderY(), tilt = vx / 900;
  g.save(); g.translate(x, y); g.rotate(tilt);
  g.fillStyle = "#0b3b8c"; g.beginPath(); g.roundRect ? g.roundRect(-16, 4, 32, 9, 5) : g.rect(-16, 4, 32, 9); g.fill();
  g.fillStyle = "#1463f3"; g.beginPath(); g.ellipse(0, -4, 8, 10, 0, 0, 7); g.fill();
  g.fillStyle = "#ffd38a"; g.beginPath(); g.arc(0, -16, 6, 0, 7); g.fill();
  g.fillStyle = "#ff6b5e"; g.fillRect(-6, -21, 12, 4);
  g.restore();
}
draw();
})();
</script>
