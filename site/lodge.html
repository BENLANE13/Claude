<title>Chalet 351</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a mountain lodge. Hanging wooden sign over a trail map; every quiz is a run down the slope. */
:root{
  --bg:#10151c; --bg2:#171e28; --panel:#1f2833; --panel2:#27323f; --line:#34414f;
  --fg:#f3eee3; --muted:#a7b0bc; --ember:#ff9b3d; --ember-ink:#1b1206; --ice:#8fd3f0; --pine:#4fae80; --berry:#ee6a5d; --gold:#f3c551;
  --wood:#5b3a24; --wood2:#7a4e30; --wood-ink:#f6e7cf;
  --run1:#43b373; --run2:#4f93e6; --run3:#e9e4d9;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --disp:'Rozha One','Georgia',serif; --body:'Figtree','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --snow:rgba(255,255,255,.85);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9f0f4; --bg2:#f6f9fb; --panel:#ffffff; --panel2:#eef3f7; --line:#cdd8e0;
    --fg:#1b2530; --muted:#55626f; --ember:#c4531a; --ember-ink:#fff7ef; --ice:#1f78a6; --pine:#23805a; --berry:#c3362b; --gold:#a8760a;
    --wood:#6b4529; --wood2:#8a5a38; --wood-ink:#fbf0dc; --run1:#23915a; --run2:#2c72cf; --run3:#232b33;
    --shadow:0 10px 26px rgba(40,60,80,.15); --snow:rgba(120,150,175,.55); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9f0f4; --bg2:#f6f9fb; --panel:#ffffff; --panel2:#eef3f7; --line:#cdd8e0;
  --fg:#1b2530; --muted:#55626f; --ember:#c4531a; --ember-ink:#fff7ef; --ice:#1f78a6; --pine:#23805a; --berry:#c3362b; --gold:#a8760a;
  --wood:#6b4529; --wood2:#8a5a38; --wood-ink:#fbf0dc; --run1:#23915a; --run2:#2c72cf; --run3:#232b33;
  --shadow:0 10px 26px rgba(40,60,80,.15); --snow:rgba(120,150,175,.55); color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px;line-height:1.15}
.mono{font-family:var(--mono)}
/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .sign{background:linear-gradient(180deg,var(--wood2),var(--wood));color:var(--wood-ink);font-family:var(--disp);font-size:20px;padding:6px 14px 7px;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.3);position:relative}
.brand .sign::before,.brand .sign::after{content:"";position:absolute;top:-8px;width:2px;height:8px;background:var(--muted)}
.brand .sign::before{left:14px}.brand .sign::after{right:14px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.nbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.nbtn:hover{border-color:var(--ember)}
/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#1a2a3d 0%,#2c3f57 55%,#3b5069 100%);color:#f6f1e6;padding:28px 22px 120px;box-shadow:var(--shadow)}
:root[data-theme="light"] .hero{background:linear-gradient(180deg,#b7d3e6 0%,#d6e7f1 60%,#eaf3f8 100%);color:#1b2530}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .hero{background:linear-gradient(180deg,#b7d3e6 0%,#d6e7f1 60%,#eaf3f8 100%);color:#1b2530}}
.hero h1{font-size:clamp(34px,6.2vw,60px);line-height:1.02;max-width:12ch}
.hero p{max-width:46ch;margin:12px 0 0;opacity:.92}
.hero .kick{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:10px}
.hero svg.mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:120px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--ember);color:var(--ember-ink);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:rgba(255,255,255,.14);color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sec{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.sec-h small{color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.trail{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;position:relative;transition:transform .15s,border-color .15s}
.trail:hover{transform:translateY(-3px);border-color:var(--ember)}
.trail .marker{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-family:var(--disp);font-size:20px;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.trail h3{font-size:22px}
.trail .wk{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.trail p{margin:0;color:var(--muted);font-size:14px}
.cable{height:8px;border-radius:99px;background:var(--panel2);position:relative;overflow:visible}
.cable i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pine),var(--ice))}
.cable em{position:absolute;top:-9px;width:18px;height:18px;border-radius:5px;background:var(--ember);transform:translateX(-50%);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.special{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--ember)}
.tile h3{font-size:20px}
.tile p{margin:0;font-size:14px;color:var(--muted)}
.tile.fire{background:linear-gradient(160deg,#4a2412,#2a1710);color:#ffe9cf;border-color:#7a3d1c}
:root[data-theme="light"] .tile.fire{background:linear-gradient(160deg,#ffe2c4,#ffd0a3);color:#3a1a08;border-color:#e3a36b}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tile.fire{background:linear-gradient(160deg,#ffe2c4,#ffd0a3);color:#3a1a08;border-color:#e3a36b}}
.tile.fire p{color:inherit;opacity:.85}
.tile.ice{background:linear-gradient(160deg,#16384a,#11242f);color:#d7f2ff;border-color:#2b6a86}
:root[data-theme="light"] .tile.ice{background:linear-gradient(160deg,#d7f0fb,#bfe6f7);color:#0e2a39;border-color:#74b6d4}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tile.ice{background:linear-gradient(160deg,#d7f0fb,#bfe6f7);color:#0e2a39;border-color:#74b6d4}}
.tile.ice p{color:inherit;opacity:.85}
.cold18{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:8px}
.cold18 span{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.cold18 span.on{background:var(--ice);color:#06222f;box-shadow:none;font-weight:600}
/* chapter page */
.crumb{display:flex;gap:8px;align-items:center;margin:6px 0 14px;color:var(--muted);font-size:14px}
.crumb button{background:none;border:0;color:var(--ice);padding:0}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead h1{font-size:clamp(28px,5vw,44px)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fchip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ember);color:var(--ember-ink);border-color:var(--ember);font-weight:600}
.qlist{display:grid;gap:8px;margin-top:10px}
.qrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;min-width:0}
.qrow:hover{border-color:var(--ember)}
.qrow .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.dot.l1{background:var(--run1);border-radius:50%}.dot.l2{background:var(--run2);border-radius:3px}.dot.l3{background:var(--run3);transform:rotate(45deg) scale(.85);box-shadow:0 0 0 1.5px var(--muted)}
.st{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.st.cold{color:var(--ice)}.st.ok{color:var(--pine)}.st.bad{color:var(--berry)}
/* quiz */
.qwrap{display:grid;gap:14px;margin-top:6px}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{flex:1;min-width:140px;height:10px;background:var(--panel2);border-radius:99px;position:relative}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--run1),var(--ice))}
.prog em{position:absolute;top:-8px;width:24px;height:24px;margin-left:-12px;font-style:normal;text-align:center;line-height:24px;font-size:16px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.run{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.tag.ramos{color:var(--gold);border-color:var(--gold)}
.qtext{font-size:17px;max-width:68ch}
.qtext p{margin:0 0 10px}
.given{border-left:3px solid var(--ice);background:var(--panel2);padding:8px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:15px;color:var(--muted)}
.eq{font-family:var(--mono);font-size:15px;background:var(--panel2);border-radius:10px;padding:8px 12px;margin:8px 0;display:block;overflow-x:auto}
.fig{margin:14px 0;overflow-x:auto}
svg.plot{width:100%;max-width:520px;height:auto;display:block}
svg .ax{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;fill:none}
svg .ln{fill:none;stroke-width:2.4;stroke-linecap:round}
svg .dem{stroke:var(--ice)}svg .mr{stroke:var(--pine)}svg .mc{stroke:var(--ember)}svg .ac{stroke:var(--gold)}svg .sup{stroke:var(--ember)}
svg text{fill:var(--fg);font-family:var(--mono);font-size:12px}
svg text.lb{font-size:13px;font-weight:600}
svg .rg{fill:var(--ice);opacity:.08;transition:opacity .3s}
svg .rg.on{opacity:.55;fill:var(--ember)}
svg .rg.off{fill:var(--ice);opacity:.15}
svg text.rt{font-size:15px;font-weight:600}
svg.big text{font-size:24px}svg.big text.lb{font-size:27px}svg.big .ln{stroke-width:5}svg.big .ax{stroke-width:3}svg.big .gd{stroke-width:2}
svg .ndl{fill:var(--ember);stroke:none}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.opts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--ember);transform:translateX(3px)}
.opt .L{font-family:var(--mono);font-weight:600;width:26px;height:26px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;border:1px solid var(--line)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 14%,var(--panel2))}
.opt.good{border-color:var(--pine);background:color-mix(in srgb,var(--pine) 22%,var(--panel2))}
.opt.good .L{background:var(--pine);color:#fff;border-color:var(--pine)}
.opt.bad{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 20%,var(--panel2))}
.opt.bad .L{background:var(--berry);color:#fff;border-color:var(--berry)}
.opt.gone{opacity:.35;text-decoration:line-through}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.fb h4{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:20px}
.fb.good h4{color:var(--pine)}.fb.bad h4{color:var(--berry)}
.fb .pts{font-family:var(--mono);font-size:13px;color:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.spc{flex:1}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:6px}
.navgrid button{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:13px;position:relative}
.navgrid button.ans{background:color-mix(in srgb,var(--ice) 28%,var(--panel));border-color:var(--ice)}
.navgrid button.cur{outline:2px solid var(--ember)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--ember)}
.navgrid button.g{background:color-mix(in srgb,var(--pine) 40%,var(--panel));border-color:var(--pine)}
.navgrid button.b{background:color-mix(in srgb,var(--berry) 38%,var(--panel));border-color:var(--berry)}
/* matrices */
.pmw{overflow-x:auto}
table.pm{border-collapse:separate;border-spacing:0;margin:6px 0;font-family:var(--mono)}
table.pm th{font-weight:500;color:var(--muted);padding:4px 10px;font-size:13px}
table.pm td{border:1.5px solid var(--line);padding:10px 14px;text-align:center;min-width:76px;font-size:15px;background:var(--panel2)}
table.pm td i{font-style:normal;padding:2px 6px;border-radius:50%;display:inline-block;min-width:26px}
table.pm td i.b{margin-left:2px}
table.pm td.ne{background:color-mix(in srgb,var(--pine) 25%,var(--panel2))}
table.pm td i.br1{box-shadow:0 0 0 2px var(--berry)}
table.pm td i.br2{box-shadow:0 0 0 2px var(--ice);border-radius:6px}
.pm-cap{font-size:12px;color:var(--muted)}
.pm-p1{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--muted);font-size:13px;padding:0 6px!important}
/* results */
.score{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--disp);font-size:clamp(48px,10vw,84px);line-height:1}
.bars{display:grid;gap:10px;margin:14px 0}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ice)}
details.rv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-top:8px}
details.rv summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .in{padding:4px 14px 14px;border-top:1px solid var(--line)}
/* library */
.lib{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.card ol,.card ul{margin:0;padding-left:20px;font-size:15px}
.card li{margin:4px 0}
.fx{font-family:var(--mono);font-size:14px;background:var(--panel2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--wood);color:var(--wood-ink);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:50;font-weight:600}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
.float{position:absolute;right:20px;top:14px;font-family:var(--mono);font-weight:600;color:var(--gold);animation:fl 1.1s ease forwards;pointer-events:none}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@media (max-width:560px){
  .qcard{padding:16px}.bar{grid-template-columns:84px 1fr 50px}
  .hero{padding:22px 16px 110px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <button class="brand" id="home" aria-label="Back to the lobby"><span class="sign">Chalet 351</span></button>
    <span class="spacer"></span>
    <span class="chip" title="Points earned. One point is one meter climbed."><span aria-hidden="true">▲</span><b id="pts">0</b> m · <span id="rank">Snow Bunny</span></span>
    <span class="chip" title="Current streak of correct answers"><span aria-hidden="true">🔥</span><b id="stk">0</b></span>
    <button class="nbtn" id="libbtn">Method cards</button>
    <button class="nbtn" id="theme" aria-label="Switch between night and day">Day / Night</button>
  </div>
  <main id="app"></main>
</div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const fmt=n=>n.toLocaleString('en-US');
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function shuf(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET='ABCDE';
/* ---------- persistence ---------- */
const KEY='chalet351_v1';
let S={pts:0,best:0,stats:{},mock:[],theme:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let streak=0;
const RANKS=[[0,'Snow Bunny'],[250,'Piste Regular'],[700,'Off-Piste'],[1400,'Alpine Guide'],[2400,'Summit Master']];
function rankOf(p){let r=RANKS[0][1];for(const[t,n]of RANKS)if(p>=t)r=n;return r}
function stat(id){return S.stats[id]||(S.stats[id]={n:0,c:0,s:0})}
function hud(){$('#pts').textContent=fmt(S.pts);$('#rank').textContent=rankOf(S.pts);$('#stk').textContent=streak}

/* ---------- figures ---------- */
function plot(o){
  const W=o.w||440,H=o.h||300,L=46,R=16,T=14,B=34,pw=W-L-R,ph=H-T-B;
  const X=x=>L+x/o.xmax*pw,Y=y=>T+ph-y/o.ymax*ph;
  let s=`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||'Graph'}">`;
  s+=`<path class="ax" d="M${L} ${T-4}V${T+ph}H${W-R+4}"/>`;
  (o.guides||[]).forEach(g=>{s+=`<path class="gd" d="M${X(g[0])} ${Y(g[1])}L${X(g[2])} ${Y(g[3])}"/>`});
  (o.lines||[]).forEach(l=>{
    s+=`<path class="ln ${l.c}" d="${l.p.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}"/>`;
    if(l.lab){const q=l.at;s+=`<text class="lb" x="${X(q[0])+(l.dx||6)}" y="${Y(q[1])+(l.dy||-4)}">${l.lab}</text>`}
  });
  (o.xt||[]).forEach(v=>{s+=`<text x="${X(v)}" y="${T+ph+17}" text-anchor="middle">${v}</text>`});
  (o.yt||[]).forEach(v=>{s+=`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
  s+=`<text class="lb" x="${L-6}" y="${T-2}" text-anchor="end">P</text><text class="lb" x="${W-R}" y="${T+ph+30}" text-anchor="end">${o.xl||'Q'}</text>`;
  return s+'</svg>';
}

function mxFig(m){return {t:'mx',...m}}
function mx(rows,cols,cells,o={}){return {t:'mx',rows,cols,cells:cells.map(r=>r.map(c=>c.split(',').map(Number))),p1:o.p1||'Player 1',p2:o.p2||'Player 2'}}
function renderMx(f){
  let h=`<div class="pmw"><table class="pm"><tr><th></th><th></th><th colspan="${f.cols.length}">${f.p2}</th></tr><tr><th></th><th></th>${f.cols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  f.rows.forEach((r,i)=>{
    h+=`<tr>${i===0?`<td class="pm-p1" rowspan="${f.rows.length}" style="border:0;background:none">${f.p1}</td>`:''}<th>${r}</th>`+f.cells[i].map((c,j)=>`<td data-r="${i}" data-c="${j}"><i class="a">${c[0]}</i> , <i class="b">${c[1]}</i></td>`).join('')+'</tr>';
  });
  return h+`</table><div class="pm-cap">After you answer, red rings mark Player 1's best responses and blue boxes mark Player 2's. A cell with both is a pure-strategy Nash equilibrium.</div></div>`;
}
function revealMx(root,f){
  const t=root.querySelector('table.pm');if(!t)return;
  const R=f.rows.length,C=f.cols.length;
  for(let j=0;j<C;j++){let m=-1e9;for(let i=0;i<R;i++)m=Math.max(m,f.cells[i][j][0]);for(let i=0;i<R;i++)if(f.cells[i][j][0]===m)t.querySelector(`td[data-r="${i}"][data-c="${j}"] i.a`).classList.add('br1')}
  for(let i=0;i<R;i++){let m=-1e9;for(let j=0;j<C;j++)m=Math.max(m,f.cells[i][j][1]);for(let j=0;j<C;j++)if(f.cells[i][j][1]===m)t.querySelector(`td[data-r="${i}"][data-c="${j}"] i.b`).classList.add('br2')}
  t.querySelectorAll('td[data-r]').forEach(td=>{if(td.querySelector('.br1')&&td.querySelector('.br2'))td.classList.add('ne')});
}

E('R1',7,2,`Firm Beta is a monopolist. The graph below shows Beta's marginal cost, average cost, demand, and marginal revenue. The monopolist uses its market power to maximize its own profit. Find the profit of this monopolist.`,
 ['Profit=15,300','Profit=16,200','Profit=11,400','Profit=10,200','Profit=10,800'],'A',
 `Find where <b>MR = MC</b>: that is at <b>Q = 90</b>. Go up to demand: <b>P = 240</b>. Read AC at Q = 90: <b>AC = 70</b>. Profit = (P − AC)Q = (240 − 70)(90) = <b>15,300</b>.<br>The trap: Q = 60 is where AC is lowest, not where MR = MC. (320 − 50)(60) = 16,200 uses the wrong quantity.`,{fig:'beta',ramos:1});
E('R2',7,2,`A monopolist has a cost function <span class="eq">C = 2Q²,</span> and faces a market demand <span class="eq">Q<sup>D</sup> = 100 − 0.5P.</span> Find how many units this monopolist will produce.`,
 ['Q<sub>M</sub> = 45','Q<sub>M</sub> = 50','Q<sub>M</sub> = 40','Q<sub>M</sub> = 25','Q<sub>M</sub> = 20'],'D',
 `Invert demand: P = 200 − 2Q. Revenue = 200Q − 2Q², so MR = 200 − 4Q. Cost 2Q² gives MC = 4Q. MR = MC: 200 − 4Q = 4Q, so <b>Q = 25</b>.`,{ramos:2});

E('R5',7,2,`A monopolist has a cost function <span class="eq">C = 7 + 5Q,</span> and faces a market demand <span class="eq">Q<sup>D</sup> = 12.5 − 0.5P.</span> Find how many units this monopolist will produce.`,

E('R7',8,3,`A.J. is a Brazilian company that sells Açaí Juice to California and Illinois. The demand function in each one of these markets is <span class="eq">California: Q<sub>C</sub> = 66 − 2P<sub>C</sub><br>Illinois: Q<sub>I</sub> = 120 − 2P<sub>I</sub></span> where output Q is measured in gallons of juice. The marginal cost of A.J. is <span class="eq">MC = Q<sub>C</sub> + Q<sub>I</sub></span> Suppose A.J. can price discriminate the two markets in order to maximize profits (that is, P<sub>C</sub> might be different than P<sub>I</sub>). How many gallons of juice will be sold in California?`,

E('R8',8,3,`Firm Alpha is a monopolist. Alpha has a single consumer, who has a demand function given by <span class="eq">Q<sup>D</sup> = 100 − 0.5p</span> The cost function of Alpha is <span class="eq">C = 3Q²</span> Suppose Alpha optimally uses a two-part tariff, and chooses the entry fee T and usage fee p that maximizes its own profit. Alpha's optimal usage fee is`,

E('R12',8,2,`Firm Gamma is a monopolist. At the moment, it is not able to engage in price discrimination. The graph below describes its marginal cost and demand. Currently, Gamma optimally produces quantity Q<sub>M</sub> which maximizes its profits.<br><br>The consulting company Big Brother offers to sell to Gamma detailed information about the consumers. With this information, Gamma would be able to engage in first-degree price discrimination. Using the graph, we can compute the maximum amount of money that Gamma would be willing to pay for this information. This amount equals the area:`,

E('R13',10,3,`Firm 1 and Firm 2 are Cournot competitors. They are the only producers of output Q. The demand for Q is <span class="eq">Q<sup>D</sup> = 120 − P.</span> Firm 1 and firm 2 have different cost functions <span class="eq">C<sub>1</sub> = 5Q<sub>1</sub><br>C<sub>2</sub> = 10Q<sub>2</sub>.</span> Compute the equilibrium of this market. Define the market share of Firm 1 as <span class="eq">MS<sub>1</sub> = Q<sub>1</sub> / (Q<sub>1</sub> + Q<sub>2</sub>)</span> The market share of Firm 1 is approximately ______.`,

E('R14',10,2,`Professor Ramos is trying to write a Game Theory question for the ECON 351 final exam. He would like to construct an example of a Prisoner's Dilemma game. He came up with the following table containing the possible actions and payoffs of players 1 and 2. However, he is having a hard time trying to choose a payoff x for each player when both players play "confess". For this game to be a good example of a Prisoner's Dilemma game, the missing payoff x of each player should be ______.`,
 ['x = −10','x = −5','x = 5','x = 30','x = 20'],'E',

E('R16',10,2,`Consider the following simultaneous move game. Consider the following statements about this game<br>I - This game can be considered as an example of a Matching Pennies Game.<br>II - This game does not have a Nash Equilibrium.<br>III - In this game, a 50/50 mixed strategy is a dominant strategy.<br><br>What can we say about these statements?`,

 `Differentiate U<sub>A</sub> with respect to e<sub>A</sub>: 21 + 0.5e<sub>B</sub> − 2e<sub>A</sub> = 0, so e<sub>A</sub> = 10.5 + 0.25e<sub>B</sub> (best response). By symmetry e<sub>B</sub> = 10.5 + 0.25e<sub>A</sub>. Symmetric equilibrium: e = 10.5 + 0.25e, so 0.75e = 10.5 and <b>e = 14</b>.`,{ramos:18});

E('w7-1',7,1,`When a demand curve is downward sloping, we know that the marginal revenue is`,['MR < P','MR < MC','MR > P','MR > MC','MR is constant'],'A',`To sell one more unit the monopolist must cut the price on <i>all</i> units, so MR lies below the demand curve: <b>MR &lt; P</b>.`);
E('w7-2',7,1,`A monopolist hires a consulting company to verify if the current quantity produced is maximizing the monopolist's profit. The consulting company finds that at the current quantity the marginal revenue is greater than the marginal cost. What should the consulting company tell the monopolist?`,
 ['The current quantity is maximizing profit.','There is not enough evidence to conclude if the current quantity maximizes profit or not.','The current quantity does not maximize profit. A marginal decrease in the quantity produced would increase profits.','The current quantity does not maximize profit. A marginal increase in the quantity produced would increase profits.','The current quantity does not maximize profit. The company should shut-down its production and go out of business in the long-run.'],'D',
 `MR &gt; MC: one more unit adds more revenue than cost, so <b>produce more</b> until MR = MC.`);
E('w7-3',7,1,`A monopolist hires a consulting company to verify if the current quantity produced is maximizing the monopolist's profit. The consulting company finds that at the current quantity the marginal cost is greater than the marginal revenue. What should the consulting company tell the monopolist?`,
 ['The current quantity is maximizing profit.','There is not enough evidence to conclude if the current quantity maximizes profit or not.','The current quantity does not maximize profit. A marginal decrease in the quantity produced would increase profits.','The current quantity does not maximize profit. A marginal increase in the quantity produced would increase profits.','The current quantity does not maximize profit. The company should shut-down its production and go out of business in the long-run.'],'C',
 `MC &gt; MR: the last unit costs more than it brings in, so <b>produce less</b>. We cannot conclude a shutdown (that needs P &lt; AVC).`);
E('w7-4',7,1,`A monopolist will sell ______ units of output when compared to a perfectly competitive market, and will charge ______ price per unit.`,['fewer ; a lower','more ; a lower','fewer ; a higher','more ; a higher','the same number of ; the same'],'C',`The monopolist restricts quantity to raise the price: <b>fewer units, higher price</b>.`);
E('w7-5',7,1,`In a perfectly competitive market, the Lerner index of market power is`,['L = 1','L = 0','L = ∞','L = MC','L = E<sub>Q<sup>D</sup>,P</sub>'],'B',`L = (P − MC)/P and P = MC under perfect competition, so <b>L = 0</b>. L is always between 0 and 1.`);
E('w7-6',7,2,`Last year, a monopolist had a Lerner index L = 0.4. This year, the index changed to L = 0.6. The monopolist had a constant marginal cost of $3 in both years. What can we conclude about this monopolist?`,
 ['The monopolist\'s market power increased and it is charging a higher price.','The monopolist\'s market power increased and it is charging a lower price.','The monopolist\'s market power decreased and it is charging a lower price.','The monopolist\'s market power decreased and it is charging a higher price.','The monopolist\'s market power did not change and the monopolist is charging the same price.'],'A',
 `MC is fixed at 3, so L = (P − 3)/P can only rise if P rises. Last year P = 5; this year P = 7.5. More market power, <b>higher price</b>.`);
E('w7-7',7,2,`A monopolist currently sells its product at a price P = 10. The firm has a constant marginal cost MC = 2. The Lerner index of market power of this firm is ______. If new competitors start entering the market and selling products that are similar to the product sold by the monopolist, then we should expect this index to ______.`,
 ['L = 0.4 ; decrease','L = 0.4 ; increase','L = 0.8 ; stay the same','L = 0.8 ; increase','L = 0.8 ; decrease'],'E',
 `L = (10 − 2)/10 = 0.8. Close substitutes make demand more elastic, forcing a lower price, so L <b>decreases</b>.`);
Z('w7-8',7,2,`A monopolist has a cost function <span class="eq">C = 10 + 4Q,</span> and faces a market demand <span class="eq">Q<sup>D</sup> = 160 − 4P.</span> Find the profit of this monopolist.`,'1,286',['1,296','1,152','1,584','1,276'],`P = 40 − 0.25Q, MR = 40 − 0.5Q = 4, so Q = 72, P = 22. Profit = 22(72) − 10 − 4(72) = 1,584 − 298 = <b>1,286</b>. (1,584 is just revenue.)`);
Z('w7-9',7,2,`A monopolist faces the following demand curve and cost curve for its product: <span class="eq">Q<sup>D</sup> = 200 − 2P<br>C = 5Q.</span> A tax of $5 for each unit produced is imposed by state government. How much profit does the monopolist earn?`,'4,050',['4,512.50','4,500','4,000','3,050'],`The tax raises MC to 10. P = 100 − 0.5Q, MR = 100 − Q = 10, so Q = 90, P = 55. Profit = 55(90) − (5 + 5)(90) = 4,950 − 900 = <b>4,050</b>. (Before the tax: Q = 95, P = 52.50, profit 4,512.50.)`);
Z('w7-10',7,3,`A monopolist faces the following demand curve and cost curve for its product: <span class="eq">Q<sup>D</sup> = 200 − 2P<br>C = 5Q.</span> The state imposes a $5 tax for each unit produced. In addition, a business license is required to stay in business, and the license costs $1,000. How much profit does the monopolist earn?`,'3,050',['4,050','3,550','2,050','4,512.50'],`The license is a <b>fixed cost</b>: it does not change MC or MR, so output and price stay at Q = 90, P = 55. Only profit falls: 4,050 − 1,000 = <b>3,050</b>.`);
Z('w7-11',7,2,`A monopolist faces the following inverse demand curve and marginal cost curve: <span class="eq">P = 360 − 4Q<br>MC = 4Q.</span> What is the profit-maximizing level of output?`,'Q = 30',['Q = 45','Q = 36','Q = 60','Q = 40'],`MR = 360 − 8Q. MR = MC: 360 − 8Q = 4Q, so <b>Q = 30</b>. (Q = 45 is where P = MC, the efficient output.)`);
Z('w7-12',7,3,`A monopolist faces the following inverse demand curve and marginal cost curve: <span class="eq">P = 360 − 4Q<br>MC = 4Q.</span> What is the deadweight loss from monopoly?`,'DWL = 900',['DWL = 450','DWL = 1,800','DWL = 1,350','DWL = 600'],`Q<sub>M</sub> = 30, P<sub>M</sub> = 240, MC at 30 is 120. Efficient Q = 45. DWL = ½(240 − 120)(45 − 30) = <b>900</b>.`);
E('w7-13',7,3,`Firm Delta is the monopolist of a particular product in Greece. Delta has cost function <span class="eq">C = 8Q.</span> The demand for Delta's output is <span class="eq">Q<sup>D</sup> = 300 − 0.5P</span> In addition to the production cost above, the government imposes a $4 tax on each unit produced. Compute how much firm Delta pays in taxes:`,['$596','$588','$580','$584','$592'],'B',
 `New MC = 8 + 4 = 12. P = 600 − 2Q, MR = 600 − 4Q = 12, so Q = 147. Taxes = 4 × 147 = <b>$588</b>.`);
Z('w7-14',7,2,`Firm Alpha is a monopolist. The graph below shows Alpha's marginal cost, average cost, demand, and marginal revenue. The monopolist uses its market power to maximize its own profit. Find the producer surplus.`,'PS = 10,800',['PS = 10,200','PS = 3,600','PS = 16,200','PS = 8,100'],`MR = MC at Q = 60, P = 240, MC(60) = 120. PS is the trapezoid between price and MC: (240 − 0 + 240 − 120)(60)/2 = <b>10,800</b>. Profit = (P − AC)Q = (240 − 70)(60) = 10,200 is a different number.`,{fig:'alpha'});
Z('w7-15',7,2,`Firm Alpha is a monopolist. The graph below shows Alpha's marginal cost, average cost, demand, and marginal revenue. The monopolist uses its market power to maximize its own profit. Find the Lerner Index of Market Power.`,'L = 0.5',['L = 0.33','L = 0.75','L = 0.25','L = 0.67'],`At Q = 60, P = 240 and MC = 120. L = (240 − 120)/240 = <b>0.5</b>.`,{fig:'alpha'});
E('w7-16',7,2,`A monopolist has determined that at the current level of output the price elasticity of demand is −0.95. Which of the following statements is true?`,['The firm should cut output.','This is typical for a monopolist; output should not be altered.','The firm should increase output.','The firm is maximizing profit if the price is P = 0.15.','We need more information to answer this question'],'A',
 `|E| &lt; 1 means demand is inelastic and MR is negative. A monopolist never operates on the inelastic part: cutting output raises revenue <i>and</i> lowers cost.`);
E('w7-17',7,3,`A monopolist hired a consulting company to research the market demand for its product. The research results indicate that demand is linear in prices, and that at the current level of output the price elasticity of demand is −1.4. Therefore, in order to increase its profits, the monopolist should:`,['decrease output because demand is inelastic','decrease prices because demand is inelastic','increase output because demand is elastic','increase prices because demand is elastic','we need more information to answer this question'],'E',
 `E = −1.4 is elastic, so MR &gt; 0. But whether MR = MC depends on MC, which we do not know. <b>Not enough information.</b>`);
E('w7-18',7,2,`The NFL determines that at current prices, the demand for football tickets has a price elasticity of −0.5. If the NFL decides to raise the price of the tickets by 1%, what will happen to sales revenues?`,['Sales revenues will go up since demand is inelastic.','Sales revenues will go down since demand is inelastic.','Sales revenues will go up since demand is elastic.','Sales revenues will go down since demand is elastic.','Sales revenues will not change.'],'A',
 `Price +1%, quantity −0.5%: revenue rises. Inelastic: price up, revenue up. Elastic: price up, revenue down. Unit elastic: no change.`);
E('w7-19',7,2,`The demand for new books is given by Q = a − bP, where Q is quantity; P is price; a is a strictly positive number; b is a strictly positive number. Along this demand curve, as we increase the price P:`,['both the price elasticity and slope vary.','the slope varies, but the price elasticity is constant.','the price elasticity varies, but the slope is constant.','both the price elasticity and slope are constant.','We need to know the actual values of a and b to answer this question.'],'C',
 `A straight line has a constant slope, but E = (ΔQ/ΔP)(P/Q) changes as P/Q changes along the line.`);
E('w7-20',7,1,`A monopsonist will buy ______ units of output when compared to a perfectly competitive market, and will pay ______ price per unit.`,['fewer ; a lower','more ; a lower','fewer ; a higher','more ; a higher','the same number of ; the same'],'A',`A monopsonist (single buyer) restricts purchases to push the price it pays down: <b>fewer units, lower price</b>.`);
Z('w7-21',7,2,`Consider a monopsonist choosing how many boxes Q of oranges to purchase to produce orange juice. For this firm, the marginal value of oranges is MV = 180 − 4Q. The supply function is Q = 2p. The monopsonist chooses the quantity Q that maximizes its own profit. How many boxes of oranges will be purchased?`,'36 boxes',['40 boxes','18 boxes','45 boxes','30 boxes'],`Inverse supply p = 0.5Q. Expenditure E = 0.5Q², so ME = Q. MV = ME: 180 − 4Q = Q, so <b>Q = 36</b>, price paid p = 0.5(36) = $18. (Perfect competition: 180 − 4Q = 0.5Q gives 40 boxes at $20.)`);
Z('w7-22',7,2,`Firm Alpha is a monopsonist in the labor market. The firm's marginal value of labor is MV<sub>L</sub> = 18 − 0.5L. The labor supply is L<sup>S</sup> = 2w. Compute the wage w and quantity L when the monopsonist uses its market power to maximize its own profit.`,'w = 6 and L = 12',['w = 9 and L = 18','w = 6 and L = 18','w = 9 and L = 12','w = 12 and L = 12'],`Inverse supply w = 0.5L, so labor expense = 0.5L² and ME<sub>L</sub> = L. MV<sub>L</sub> = ME<sub>L</sub>: 18 − 0.5L = L, so <b>L = 12</b>. The firm pays the supply-curve wage w = 0.5(12) = 6. (Competitive: L = 18, w = 9.)`);
Z('w7-23',7,3,`Firm Alpha is a monopsonist in the labor market. The firm's marginal value of labor, labor supply curve, and marginal expense on labor are represented by the graph below. When the monopsonist uses its market power to maximize its own profit, find the deadweight loss.`,'DWL = 121.5',['DWL = 243','DWL = 729','DWL = 546.75','DWL = 60.75'],`Monopsony hires L<sub>M</sub> = 18 (where MV = ME = 54) and pays w<sub>M</sub> = 27 (read from supply). Competitive L = 27. DWL is the triangle between MV and supply from 18 to 27: ½(54 − 27)(27 − 18) = <b>121.5</b>.`,{fig:'mons'});
Z('w7-24',7,2,`Firm Sigma is a natural monopolist. The graph below shows its demand, marginal revenue, average cost and marginal cost. If the monopolist is not regulated by the government, what will be the price it charges?`,'P = 7',['P = 12','P = 4','P = 2','P = 5'],`MR = MC at Q = 5. The monopolist then charges the highest price consumers will pay at Q = 5: demand gives <b>P = 7</b>.`,{fig:'nat'});
Z('w7-25',7,3,`Firm Sigma is a natural monopolist. The graph below shows its demand, marginal revenue, average cost and marginal cost. The government wants to limit the monopoly power with a price ceiling. What is the lowest price ceiling the government can impose without the firm going out of business (the minimum feasible price)?`,'P = 4',['P = 2','P = 3.6','P = 7','P = 5'],`The minimum feasible price is where <b>demand meets AC</b> (P = AC, zero profit): Q = 8, P = 4. A ceiling at P = 2 (= MC, efficient Q = 10) leaves AC = 3.6 &gt; 2, so the firm loses money.`,{fig:'nat'});
Z('w7-26',7,2,`Firm Sigma is a natural monopolist (see the graph below). The government imposes a price ceiling equal to the price at which consumers are willing to buy the efficient quantity (P = MC = 2, Q = 10). What would be the problem?`,'The firm has negative profit because AC is higher than the price at the efficient quantity',['The firm earns more profit than the unregulated monopolist','Deadweight loss is larger than under unregulated monopoly','Consumers want fewer units than the firm will supply','There is no problem; P = MC is always feasible for a natural monopoly'],`Profit = (P − AC)Q. At Q = 10, AC = 3.6 &gt; P = 2, so profit is negative and the firm exits. That is why regulators use P = AC instead.`,{fig:'nat'});
Z('o7-1',7,1,`Firm Alpha sells Q = 100 units at a price P = 50. At this quantity its average cost is AC = 30. What is the profit of Firm Alpha?`,'2,000',['1,500','3,000','5,000','20'],`Profit = (P − AC)Q = (50 − 30)(100) = <b>2,000</b>.`);
Z('o7-2',7,1,`A monopolist faces a price P = 40 and a price elasticity of demand E = −2 at its current output. Using MR = P(1/E + 1), the marginal revenue is`,'MR = 20',['MR = 40','MR = 80','MR = 10','MR = −20'],`MR = 40(1/(−2) + 1) = 40(0.5) = <b>20</b>.`);
Z('o7-3',7,2,`At its profit-maximizing output, a monopolist faces a price elasticity of demand E = −4. The Lerner Index of Market Power is`,'L = 0.25',['L = 4','L = 0.75','L = 0.4','L = 1'],`L = −1/E = 1/4 = <b>0.25</b>.`);
Z('o7-4',7,3,`A monopolist has a constant marginal cost MC = $6. At its profit-maximizing output the price elasticity of demand is E = −2.5. What price does it charge?`,'P = 10',['P = 8','P = 12','P = 15','P = 7.5'],`L = −1/E = 0.4 = (P − 6)/P, so 0.6P = 6 and <b>P = 10</b>. (Equivalent: P = MC/(1 − L).)`);
Z('o7-5',7,2,`A monopolist must now pay a yearly license fee of $2,000 (a fixed cost), regardless of how much it produces. How does this affect its profit-maximizing quantity and price?`,'Quantity and price stay the same; profit falls by $2,000',['Quantity falls and price rises','Quantity rises and price falls','Quantity and price stay the same; profit does not change','Quantity and price both rise by the amount of the fee'],`A fixed cost does not change MC or MR, so the MR = MC choice is unchanged. Only profit changes. A <i>per-unit</i> tax would raise MC.`);
Z('o7-6',7,2,`A monopolist must now pay a $4 tax on each unit it produces. How does this affect its profit-maximizing quantity and price?`,'Quantity falls and price rises',['Quantity rises and price falls','Quantity and price stay the same','Quantity falls and price falls','Quantity and price both rise'],`A per-unit tax raises MC by 4. MR = MC now occurs at a lower Q, and demand slopes down, so P rises.`);
Z('o7-7',7,3,`Demand is Q<sup>D</sup> = 100 − 2P. At a price P = 20, the price elasticity of demand is`,'E = −2/3',['E = −2','E = −1/3','E = −3/2','E = −1'],`Q = 100 − 40 = 60. E = (dQ/dP)(P/Q) = (−2)(20/60) = <b>−2/3</b>. It is inelastic, so a monopolist should raise price here.`);
Z('o7-8',7,1,`A monopolist faces the inverse demand P = 100 − 2Q. Its marginal revenue is`,'MR = 100 − 4Q',['MR = 100 − 2Q','MR = 50 − Q','MR = 100Q − 2Q²','MR = 100 − Q'],`REV = PQ = 100Q − 2Q². Differentiate: MR = <b>100 − 4Q</b>. MR has the same intercept as inverse demand and <i>twice</i> the slope.`);

/* ===== CHAPTER 8 ===== */
const DEF={
 res:['Reservation price','The maximum price that a consumer is willing to pay for a product or service'],
 f1:['First-degree price discrimination','Each unit is sold at that unit\'s reservation price, so consumers with different willingness to pay pay different prices'],
 f2:['Second-degree price discrimination','Each consumer effectively pays different prices for different quantities (for example, block pricing)'],
 f3:['Third-degree price discrimination','The firm separates consumers into groups (markets) and charges a different price in each market'],
 int:['Intertemporal price discrimination','The firm releases a new product at a higher price and only later lowers the price'],
 pk:['Peak-load pricing','The firm charges a higher price during periods of peak demand and a lower price when demand is lower'],
 tp:['Two-part tariff','Consumers pay an entry fee for the right to buy; then they pay a constant usage fee for each unit']
};
Object.keys(DEF).forEach((k,i)=>{
  const others=Object.keys(DEF).filter(x=>x!==k);
  Z('d8-'+k,8,1,`Which of the following best describes <b>${DEF[k][0].toLowerCase()==='reservation price'?'a reservation price':DEF[k][0]}</b>?`,DEF[k][1],shuf(others,rng(hash(k))).slice(0,4).map(o=>DEF[o][1]),`<b>${DEF[k][0]}</b>: ${DEF[k][1].charAt(0).toLowerCase()+DEF[k][1].slice(1)}.`);
});
E('w8-2',8,2,`Consider the following cases: (I) Firm Alpha charges different prices to different groups based upon differences in elasticity of demand. (II) Firm Beta charges each customer the maximum price that the customer is willing to pay; (III) Firm Gamma charges different prices for different quantity blocks of the same good or service. Alpha, Beta and Gamma use, respectively, the following degrees of price discrimination:`,
 ['1st degree, 2nd degree, 3rd degree','1st degree, 3rd degree, 2nd degree','2nd degree, 3rd degree, 1st degree','3rd degree, 2nd degree, 1st degree','3rd degree, 1st degree, 2nd degree'],'E',
 `(I) groups with different elasticities = <b>3rd</b>. (II) each customer pays their reservation price = <b>1st</b>. (III) quantity blocks = <b>2nd</b>.`);
Z('w8-3a',8,2,`Firm ABC is a monopolist facing many competitive buyers. ABC sells its product Q to consumers through the internet. The graph below shows the demand for the product, the marginal cost and the marginal revenue. The firm's fixed cost is zero. Firm ABC does not have information about the reservation price of each consumer, so it has to charge a single price P to all consumers. The monopolist uses its market power to maximize its own profit. Compute the profit of this monopolist.`,'Profit = 2,025',['Profit = 3,645','Profit = 1,620','Profit = 2,550','Profit = 850'],`MR = MC at Q = 30, P = 85, MC(30) = 25 (and MC at 0 is 10). With no fixed cost, profit = PS = trapezoid: (85 − 10 + 85 − 25)(30)/2 = <b>2,025</b>.`,{fig:'abc'});
Z('w8-3c',8,2,`Same Firm ABC as in the graph below (single price, maximizing profit). The Lerner Index of market power is approximately`,'L ≈ 0.7',['L ≈ 0.3','L ≈ 0.5','L ≈ 0.9','L ≈ 0.4'],`P = 85, MC = 25. L = (85 − 25)/85 ≈ <b>0.7</b>.`,{fig:'abc'});
Z('w8-3b',8,3,`Same Firm ABC (graph below). Big Brother offers to sell ABC a database with the identity and reservation price of every consumer, so ABC could engage in first-degree price discrimination. What is the most ABC would be willing to pay for the database?`,'$1,620',['$3,645','$2,025','$5,670','$4,050'],`First-degree: sell Q = 54 (where D = MC) and capture the whole triangle: ½(145 − 10)(54) = 3,645. Today's profit is 2,025. Willingness to pay = increase in profit = <b>1,620</b>.`,{fig:'abc'});
E('w8-4',8,1,`GameStop sells videogames. If you are a member of their reward program, then whenever you buy a videogame you receive 10 points for each $1 in purchases that you make. Once you reach 1,000 points, you receive a $10 discount on your next purchase. This is an example of`,['first-degree price discrimination','second-degree price discrimination','third-degree price discrimination','intertemporal price discrimination','two-part tariff'],'B',`The consumer pays full price for early purchases, then a discount on a later one: different prices for different quantities = <b>second-degree</b>.`);
E('w8-5',8,2,`A third-degree price discriminating monopolist can sell its product to market A and market B. The marginal cost to sell to either market is the same. The firm's CEO would like to know if the firm can further increase its profit. The CEO discovers that the marginal revenue earned in market A is $10 while the marginal revenue earned in market B is $15. To increase profits the firm can`,
 ['sell more units to market A and fewer units to market B.','sell more units to market B and fewer units to market A.','do nothing until it acquires more information about prices.','sell less in both markets until price equals marginal cost.','sell more in both markets until price equals marginal cost.'],'B',
 `MR<sub>B</sub> &gt; MR<sub>A</sub>: moving a unit from A to B keeps cost the same and raises revenue. Keep shifting until <b>MR<sub>A</sub> = MR<sub>B</sub> = MC</b>. (Not P = MC; a monopolist uses MR = MC.)`);
E('w8-6',8,3,`A third-degree price discriminating monopolist can sell its product to market A and market B. The marginal cost to sell to either market is the same. The CEO discovers that the price in market A is $10 while the price in market B is $15. To increase profits the firm can`,
 ['sell more units to market A and fewer units to market B.','sell more units to market B and fewer units to market A.','do nothing until it acquires more information about marginal revenue.','sell less in both markets until price equals marginal cost.','sell more in both markets until price equals marginal cost.'],'C',
 `Prices alone tell us nothing: the rule compares <b>marginal revenues</b>, and a higher price does not imply a higher MR. We need more information about MR.`);
E('w8-7',8,2,`A third-degree price discriminating monopolist can sell its product to market A and market B. The marginal cost to sell to either market is the same. The price elasticity of demand in market A is greater (more elastic) than the price elasticity of demand in market B. To maximize profits, we know that the firm chooses prices and quantities such that`,
 ['the quantity sold to market A will be greater than the quantity sold to market B.','the quantity sold to market B will be greater than the quantity sold to market A.','the price in market A will be greater than the price in market B.','the price in market B will be greater than the price in market A.','if market A has a lower price than market B, then the quantity sold in market A will be greater than the quantity sold in market B.'],'D',
 `Charge the <b>higher price in the less elastic market</b> (B). We cannot rank quantities: market sizes may differ.`);
Z('w8-8',8,3,`A.J. sells Açaí Juice to California and Illinois. The demand function in each market is <span class="eq">Illinois: Q<sub>I</sub> = 32 − 0.5P<sub>I</sub><br>California: Q<sub>C</sub> = 30 − P<sub>C</sub></span> The marginal cost of A.J. is MC = 2Q<sub>I</sub> + 2Q<sub>C</sub>. A.J. can price discriminate to maximize profits. What price will it charge in Illinois?`,'P<sub>I</sub> = 44.4',['P<sub>I</sub> = 27.4','P<sub>I</sub> = 40','P<sub>I</sub> = 36.6','P<sub>I</sub> = 32'],`P<sub>I</sub> = 64 − 2Q<sub>I</sub>, MR<sub>I</sub> = 64 − 4Q<sub>I</sub>. P<sub>C</sub> = 30 − Q<sub>C</sub>, MR<sub>C</sub> = 30 − 2Q<sub>C</sub>. Set both = 2Q<sub>I</sub> + 2Q<sub>C</sub>. Solve: Q<sub>C</sub> = 2.6, Q<sub>I</sub> = 9.8. P<sub>I</sub> = 64 − 2(9.8) = <b>44.4</b> (P<sub>C</sub> = 27.4).`);
Z('w8-9',8,3,`Expensive Microeconomics Books (EMB) sells textbooks in the U.S. and in Asia. The demand function in each of these markets is <span class="eq">U.S.: Q<sub>US</sub> = 76 − P<sub>US</sub><br>Asia: Q<sub>A</sub> = 84 − P<sub>A</sub></span> The cost function is C = 0.5Q² and the marginal cost is MC = Q, where Q = Q<sub>US</sub> + Q<sub>A</sub>. EMB can price discriminate the two markets in order to maximize profits. What is the firm's profit?`,'1,608',['1,600','1,550','1,680','1,520'],`MR<sub>US</sub> = 76 − 2Q<sub>US</sub> and MR<sub>A</sub> = 84 − 2Q<sub>A</sub>, each = Q<sub>US</sub> + Q<sub>A</sub>. Solve: Q<sub>US</sub> = 18, Q<sub>A</sub> = 22, so P<sub>US</sub> = 58, P<sub>A</sub> = 62. Profit = 58(18) + 62(22) − 0.5(40)² = 1,044 + 1,364 − 800 = <b>1,608</b>. A single price (P = 60) gives only 1,600.`);
Z('w8-9b',8,2,`Using the EMB example (U.S.: Q<sub>US</sub> = 76 − P<sub>US</sub>; Asia: Q<sub>A</sub> = 84 − P<sub>A</sub>), EMB's profit-maximizing prices when it can price discriminate are P<sub>US</sub> = 58 and P<sub>A</sub> = 62. Why is the price lower in the U.S.?`,'U.S. demand is more elastic, so the firm charges a lower price there',['U.S. demand is less elastic, so the firm charges a lower price there','Marginal cost is lower in the U.S.','The U.S. market is larger, so the firm charges less per unit','The firm must charge the lower price where consumers have higher reservation prices'],`At the single price P = 60, E<sub>US</sub> = −60/16 = −3.75 and E<sub>A</sub> = −60/24 = −2.5. The firm lowers price in the <b>more elastic</b> market and raises it in the less elastic one.`);
E('w8-10',8,1,`A movie theater charges $12 for a ticket when the movie is a new release, and charges $3 for a ticket when the movie was released at least 3 months ago. This is an example of`,['two-part tariff','second-degree price discrimination','third-degree price discrimination','peak-load price','intertemporal price discrimination'],'E',`New product priced high first and lowered later: <b>intertemporal</b>.`);
E('w8-11',8,1,`A movie theater charges $12 for a ticket if the movie is shown after 6pm, and charges $8 for a ticket when the movie is shown before 6pm. This is an example of`,['two-part tariff','second-degree price discrimination','third-degree price discrimination','peak-load price','intertemporal price discrimination'],'D',`Higher price at the peak time of day: <b>peak-load</b>.`);
E('w8-12',8,1,`In order to purchase products at the supermarket Costco, consumers need to pay a membership price of $60. This is an example of`,['first-degree price discrimination','second-degree price discrimination','third-degree price discrimination','intertemporal price discrimination','two-part tariff'],'E',`An entry fee ($60) plus a usage fee (the prices of the products): <b>two-part tariff</b>.`);
Z('w8-13',8,2,`Firm Alpha is a monopolist. The graph below shows Alpha's marginal cost, average cost, demand, and marginal revenue. Without price discrimination, the monopolist maximizes profit. Compute the deadweight loss.`,'DWL = 1,800',['DWL = 3,600','DWL = 10,800','DWL = 900','DWL = 5,400'],`Q<sub>M</sub> = 60 (price 240, MC 120), efficient Q = 90 (MC = 180). DWL = ½(240 − 120)(90 − 60) = <b>1,800</b>.`,{fig:'alpha'});
Z('w8-14',8,2,`Firm Alpha (graph below) could engage in first-degree price discrimination. How many units would it produce, and what would be its producer surplus?`,'Q = 90 and PS = 16,200',['Q = 60 and PS = 10,800','Q = 90 and PS = 10,800','Q = 60 and PS = 16,200','Q = 90 and PS = 8,100'],`First-degree sells the efficient quantity (D = MC): Q = 90. It captures the whole triangle: ½(360)(90) = <b>16,200</b>. CS = 0 and DWL = 0.`,{fig:'alpha'});
Z('w8-15',8,2,`Firm Alpha (graph below) has a single consumer and can charge a two-part tariff. The optimal usage fee is`,'P = 180',['P = 240','P = 120','P = 360','P = 90'],`Set the usage fee at the efficient (P = MC) point: Q = 90 and P = <b>180</b>.`,{fig:'alpha'});
Z('w8-15b',8,3,`Firm Alpha (graph below) has a single consumer and can charge a two-part tariff. The optimal entry fee is`,'T = 8,100',['T = 16,200','T = 3,600','T = 10,800','T = 1,800'],`Entry fee = consumer surplus at the usage fee P = 180: ½(360 − 180)(90) = <b>8,100</b>. Then PS = 16,200, CS = 0, DWL = 0.`,{fig:'alpha'});
Z('w8-16',8,3,`Merriwell has a virtual monopoly in the ultra high speed computer market. Installations have identical demands P = 45 − 0.025Q, where Q is hours of computer time leased per month. Marginal cost is $30 per hour. With a single price Merriwell sells 300 hours at $37.50 (revenue $11,250). What is Merriwell's revenue under the optimal two-part tariff?`,'$22,500',['$11,250','$4,500','$27,000','$18,000'],`Usage fee P = MC = 30, so Q = 600 hours. Entry fee = CS = ½(45 − 30)(600) = 4,500. Revenue = 4,500 + 30(600) = <b>22,500</b>, double the single-price revenue.`);
Z('w8-17',8,3,`Firm Kappa is a monopolist with a single consumer, who has demand Q<sup>D</sup> = 240 − 0.5P. The cost function of Kappa is C = 2Q². Suppose Kappa optimally uses a two-part tariff. Compute the profit of this firm.`,'19,200',['6,400','25,600','12,800','32,000'],`P = 480 − 2Q, MC = 4Q. P = MC gives Q = 80, usage fee P = 320. Entry fee = ½(480 − 320)(80) = 6,400. Revenue = 320(80) + 6,400 = 32,000. Cost = 2(80)² = 12,800. Profit = <b>19,200</b>.`);
Z('o8-1',8,2,`Firm Delta sells to two markets with constant marginal cost MC = 10. Market A: Q<sub>A</sub> = 100 − P<sub>A</sub>. Market B: Q<sub>B</sub> = 100 − 2P<sub>B</sub>. Delta can price discriminate. What price does it charge in market B?`,'P<sub>B</sub> = 30',['P<sub>B</sub> = 55','P<sub>B</sub> = 40','P<sub>B</sub> = 10','P<sub>B</sub> = 25'],`Market B: P = 50 − 0.5Q, MR = 50 − Q = 10, so Q = 40 and <b>P = 30</b>. (Market A: MR = 100 − 2Q = 10, Q = 45, P = 55: the less elastic market pays more.)`);
Z('o8-2',8,3,`Firm Delta sells to two markets with constant marginal cost MC = 10. Market A: Q<sub>A</sub> = 100 − P<sub>A</sub>. Market B: Q<sub>B</sub> = 100 − 2P<sub>B</sub>. Delta can price discriminate. What is its total profit?`,'2,825',['3,500','2,025','4,050','1,800'],`A: Q = 45, P = 55, profit (55 − 10)(45) = 2,025. B: Q = 40, P = 30, profit (30 − 10)(40) = 800. Total = <b>2,825</b>.`);
Z('o8-3',8,3,`Firm Epsilon is a monopolist with a single consumer whose inverse demand is P = 60 − Q. Marginal cost is constant at MC = 12. Epsilon optimally uses a two-part tariff. What entry fee does it charge?`,'T = 1,152',['T = 576','T = 2,304','T = 1,728','T = 864'],`Usage fee = MC = 12, so Q = 48. Entry fee = CS = ½(60 − 12)(48) = <b>1,152</b>.`);
Z('o8-4',8,2,`Firm Zeta is a monopolist whose single consumer has inverse demand P = 100 − Q. Marginal cost is constant at MC = 20. Zeta can engage in first-degree price discrimination. What is Zeta's profit (producer surplus), assuming no fixed cost?`,'3,200',['1,600','2,400','6,400','4,000'],`Q: 100 − Q = 20 gives Q = 80. PS = ½(100 − 20)(80) = <b>3,200</b>.`);
Z('o8-5',8,1,`A ski resort charges $120 for a weekend lift ticket in February and $70 for the same ticket on a weekday in April. This is an example of`,'peak-load pricing',['first-degree price discrimination','two-part tariff','intertemporal price discrimination','second-degree price discrimination'],`Higher price when demand peaks, lower when it is low: <b>peak-load</b>.`);
Z('o8-6',8,1,`A ski resort sells a 1-day pass for $90, a 3-day pass for $240 ($80 per day), and a 7-day pass for $490 ($70 per day). This is an example of`,'second-degree price discrimination',['first-degree price discrimination','third-degree price discrimination','peak-load pricing','intertemporal price discrimination'],`Per-unit price depends on the quantity bought (block pricing): <b>second-degree</b>.`);
Z('o8-7',8,1,`A ski resort offers a discounted lift ticket to students and charges full price to everyone else. This is an example of`,'third-degree price discrimination',['first-degree price discrimination','second-degree price discrimination','peak-load pricing','two-part tariff'],`Consumers are separated into groups with different elasticities and each group gets its own price: <b>third-degree</b>.`);
Z('o8-8',8,1,`A third-degree price discriminating monopolist sells to market A and market B at the same marginal cost. The profit-maximizing condition is`,'MR<sub>A</sub> = MR<sub>B</sub> = MC',['P<sub>A</sub> = P<sub>B</sub> = MC','P<sub>A</sub> = P<sub>B</sub>','Q<sub>A</sub> = Q<sub>B</sub>','MR<sub>A</sub> = P<sub>A</sub> and MR<sub>B</sub> = P<sub>B</sub>'],`Choose the quantity in each market so that marginal revenue is equal across markets and equal to marginal cost.`);

/* ===== CHAPTER 10 ===== */
E('w10-1',10,1,`The following table contains the possible actions and payoffs of players 1 and 2. This is a simultaneous move game. Find the pure strategy Nash equilibrium of this game.`,['(U,L)','(U,R)','(D,L)','(D,R)','This game does not have a pure strategy Nash equilibrium.'],'D',`Player 1 prefers D whatever Player 2 does (6 &gt; 5, 7 &gt; 2). Given D, Player 2 picks R (4 &gt; 3). <b>(D,R)</b>.`,{fig:mx(['U','D'],['L','R'],[['5,3','2,2'],['6,3','7,4']])});
E('w10-2',10,2,`The following table contains the possible actions and payoffs of players 1 and 2. This is a simultaneous move game. Find the pure strategy Nash equilibrium of this game.`,['(U,L)','(U,R)','(M,C)','(D,L)','(D,R)'],'E',`Circle Player 1's best response in each column, box Player 2's best response in each row. Only <b>(D,R)</b> has both: against R Player 1's best is D (8), against D Player 2's best is R (7).`,{fig:mx(['U','M','D'],['L','C','R'],[['20,3','8,2','7,4'],['9,11','10,10','4,9'],['4,4','8,2','8,7']])});
Z('w10-3',10,2,`The following table contains the possible actions and payoffs of players 1 and 2. This is a simultaneous move game. In the pure strategy Nash equilibrium of this game, Player 1 receives a payoff`,'10',['4','7','8','20'],`Best responses: P1: L→U(20), C→M(10), R→D(8). P2: U→R(4), M→C(10), D→L(7). The only mutual best response is <b>(M,C)</b>, where Player 1 gets 10. (20 is tempting but U,L is not an equilibrium.)`,{fig:mx(['U','M','D'],['L','C','R'],[['20,3','8,2','7,4'],['4,9','10,10','4,9'],['4,7','8,2','8,4']])});
E('w10-4',10,3,`The following table contains the possible actions and payoffs of players 1 and 2. This is a simultaneous move game. In the pure strategy Nash equilibrium of this game, Player 1 receives a payoff`,['4','7','8','9','5'],'B',`Player 1's best response by column: L→MD(5), CL→U(9), CR→D(8), R→U(7). Player 2's best response by row: U→R(4), MU→R(9), MD→CL(9), D→R(9). The only match is <b>(U,R)</b> and Player 1 gets <b>7</b>.`,{fig:mx(['U','MU','MD','D'],['L','CL','CR','R'],[['2,3','9,2','7,1','7,4'],['4,8','1,1','4,8','4,9'],['5,7','8,9','5,4','4,5'],['4,7','8,2','8,4','4,9']])});
E('w10-5',10,2,`Consider a simultaneous move game between Player 1 and Player 2. What do we know about dominant strategies?<br>I - A dominant strategy is a strategy that is optimal for a player no matter what an opponent does.<br>II - If neither player has a dominant strategy, then the Nash equilibrium must be in mixed strategies.<br>III - If the Nash equilibrium has pure strategies, then at least one player must have a dominant strategy.`,['I, II and III are true','I, II and III are false','I is true, II and III are false','I and II are true, III is false','I and III are true, II is false'],'C',`I is the definition. II and III fail in Battle of the Sexes: neither player has a dominant strategy, yet there are pure-strategy equilibria.`);
E('w10-6',10,1,`Player 1 and Player 2 will play one round of the following simultaneous move game. Suppose Player 2 is using a non-optimal strategy: she plays L with probability 30%; C with probability 30%; and R with probability 40%. Given that Player 1 knows that Player 2 is using this strategy, compute the expected utility of player 1 if he plays U.`,['2.9','3','2.7','2.5','2.3'],'A',`E[u] = 0.3(1) + 0.3(2) + 0.4(5) = 0.3 + 0.6 + 2.0 = <b>2.9</b>.`,{fig:mx(['U','M','D'],['L','C','R'],[['1,3','2,4','5,2'],['4,2','2,3','3,1'],['1,4','4,5','3,1']])});
E('w10-7',10,2,`Consider the information from the previous question. If Player 2 is using the previous strategy (L 30%, C 30%, R 40%), then the best response of player 1 is to play U with probability ______, M with probability ______, and D with probability ______.`,['one ; zero ; one','zero ; one ; zero','zero ; zero ; zero','1/3 ; 1/3 ; 1/3','Any strategy is a best response for Player 1'],'B',`U: 2.9. M: 0.3(4) + 0.3(2) + 0.4(3) = <b>3.0</b>. D: 0.3(1) + 0.3(4) + 0.4(3) = 2.7. M is strictly highest: play M with probability one.`,{fig:mx(['U','M','D'],['L','C','R'],[['1,3','2,4','5,2'],['4,2','2,3','3,1'],['1,4','4,5','3,1']])});
E('w10-8',10,3,`Player 1 and Player 2 will play one round of the following simultaneous move game. Suppose Player 2 plays L with probability 30%; C with probability 30%; and R with probability 40%. In this case, the best response of player 1 is to play U with probability ______, M with probability ______, and D with probability ______.`,['one ; zero ; one','zero ; one ; zero','zero ; zero ; zero','1/3 ; 1/3 ; 1/3','Any strategy is a best response for Player 1'],'E',`U: 0.3(2) + 0.3(7) + 0.4(0) = 2.7. M: 0.3(3) + 0.3(2) + 0.4(3) = 2.7. D: 0.3(1) + 0.3(4) + 0.4(3) = 2.7. All equal, so Player 1 is <b>indifferent</b>: any strategy is a best response.`,{fig:mx(['U','M','D'],['L','C','R'],[['2,3','7,4','0,2'],['3,2','2,3','3,1'],['1,4','4,5','3,1']])});
E('w10-9',10,3,`Player A and Player B will play one round of the following simultaneous move game. Suppose Player B plays L with probability 50%; C with probability 30%; and R with probability 20%. Given that Player A knows this, which of the following statements are true?<br>I - Playing U with probability 100% is a BR of Player A.<br>II - Playing M with probability 100% is a BR of Player A.<br>III - Playing D with probability 100% is a BR of Player A.`,['I, II and III are true','I, II and III are false','I and II are true, III is false','I and III are true, II is false','II and III are true, I is false'],'C',`U: 0.5(5) + 0.3(−4) + 0.2(−5) = 0.3. M: 0.5(2) + 0.3(−3) + 0.2(1) = 0.3. D: 0.5(−1) + 0.3(2) + 0.2(0) = 0.1. U and M tie for best, D is worse. So <b>I and II true, III false</b> (any mix of U and M also works).`,{fig:mx(['U','M','D'],['L','C','R'],[['5,1','-4,2','-5,3'],['2,3','-3,1','1,2'],['-1,2','2,3','0,1']],{p1:'Player A',p2:'Player B'})});
E('w10-10',10,2,`Consider the following simultaneous move game. In this game:<br>I - Player 1 has no dominant strategy<br>II - Player 2 has no dominant strategies<br>III - There is no Nash Equilibrium in this game`,['I and II are true, III is false','III is true, I and II are false','I, II and III are true','I is true, II and III are false','I, II and III are false'],'A',`Neither player has a dominant strategy (I and II true). There is no pure NE, but there is a mixed NE (each plays 50/50), so III is false.`,{fig:mx(['U','D'],['L','R'],[['10,0','0,10'],['0,10','10,0']])});
E('w10-11',10,1,`The game in the previous question (U: 10,0 / 0,10; D: 0,10 / 10,0) is an example of`,['Battle of the Sexes','Pure Coordination Game','Prisoner\'s Dilemma','Stag Hunt','Matching Pennies'],'E',`One player wants to match, the other wants to mismatch, no pure NE: <b>Matching Pennies</b>.`,{fig:mx(['U','D'],['L','R'],[['10,0','0,10'],['0,10','10,0']])});
E('w10-12',10,2,`Consider the following simultaneous move game. In this game:<br>I - Player 1's dominant strategy is U<br>II - Player 2's dominant strategy is L<br>III - The Nash Equilibrium of this game is Player 1 plays U and Player 2 plays L`,['I, II and III are true','I and II are true, III is false','I and III are true, II is false','II and III are true, I is false','I, II and III are false'],'E',`Player 1: D beats U against both L (6 &gt; 5) and R (4 &gt; 1), so D is dominant. Player 2: R beats L against both U (6 &gt; 5) and D (4 &gt; 1), so R is dominant. NE = (D,R). All three statements are false.`,{fig:mx(['U','D'],['L','R'],[['5,5','1,6'],['6,1','4,4']])});
E('w10-13',10,1,`The game in the previous question (U: 5,5 / 1,6; D: 6,1 / 4,4) is an example of`,['Battle of the Sexes','Pure Coordination Game','Prisoner\'s Dilemma','Stag Hunt','Matching Pennies'],'C',`Both players have a dominant strategy, the equilibrium (D,R) pays (4,4), yet (U,L) pays (5,5) to both: <b>Prisoner's Dilemma</b>.`,{fig:mx(['U','D'],['L','R'],[['5,5','1,6'],['6,1','4,4']])});
E('w10-14',10,2,`Consider the following simultaneous move game. This game is best described as a ______ game. In the equilibrium of this game, players use a ______ strategy.`,['Prisoner\'s Dilemma; pure','Prisoner\'s Dilemma; mixed','Matching Pennies; mixed','Battle of the Sexes; pure','Battle of the Sexes; mixed'],'A',`Player 1: U is dominant (3 &gt; 0 and −2 &gt; −3). Given U, Player 2 plays R. Equilibrium (U,R) pays (−2,−2) while (D,L) pays (0,0): <b>Prisoner's Dilemma, pure strategies</b>.`,{fig:mx(['U','D'],['L','R'],[['3,-3','-2,-2'],['0,0','-3,3']])});
E('w10-15',10,2,`Professor Camara wants to construct a Prisoner's Dilemma. In the table below, the payoffs are (Confess, Confess) = (x, x); (Confess, Not) = (20, 0); (Not, Confess) = (0, 20); (Not, Not) = (10, 10). For this game to be a good example of a Prisoner's Dilemma, the missing payoff x of each player should be ______.`,['x = −10','x = −5','x = 5','x = 15','x = 20'],'C',`Confess must be dominant: x &gt; 0 (against Confess, x beats 0). And (Confess, Confess) must be worse than (Not, Not): x &lt; 10. So 0 &lt; x &lt; 10: <b>x = 5</b>.`,{fig:mx(['Confess','Not Confess'],['Confess','Not Confess'],[['x,x','20,0'],['0,20','10,10']])});
E('w10-16',10,1,`Consider the following simultaneous move game (U: 3,3 / 2,2; D: 2,2 / 3,3). This game is an example of`,['Battle of the Sexes','Pure Coordination Game','Prisoner\'s Dilemma','Stag Hunt','Matching Pennies'],'B',`Two pure equilibria, (U,L) and (D,R), and both players are indifferent between them: <b>Pure Coordination</b>.`,{fig:mx(['U','D'],['L','R'],[['3,3','2,2'],['2,2','3,3']])});
E('w10-17',10,2,`Consider the following simultaneous move game. This game is best described as a ______ game. This game has ______ Nash equilibrium.`,['Prisoner\'s Dilemma; one','Matching Pennies; one','Matching Pennies; no','Battle of the Sexes; no','Battle of the Sexes; more than one'],'E',`Pure equilibria: (D,L) and (U,R). One player prefers one, the other prefers the other: <b>Battle of the Sexes</b>, more than one equilibrium.`,{fig:mx(['U','D'],['L','R'],[['1,1','2,3'],['3,2','1,1']])});
E('w10-18',10,2,`Consider the following simultaneous move game. What is true about this game?<br>I - This game has more than one equilibrium<br>II - Players do not have a dominant strategy<br>III - Because in this game players do not have dominant strategies, in equilibrium players must play a mixed strategy`,['I, II and III are true','I and III are true, II is false','I and II are true, III is false','II and III are true, I is false','I, II and III are false'],'C',`Two pure equilibria, (D,L) and (U,R) (I true). No dominant strategies (II true). But pure equilibria exist, so players do <i>not</i> have to mix (III false). Battle of the Sexes.`,{fig:mx(['U','D'],['L','R'],[['5,5','4,6'],['6,4','1,1']])});
E('w10-19',10,2,`Firm 1 and Firm 2 are Cournot competitors. They have the same cost function <span class="eq">C<sub>1</sub> = 16Q<sub>1</sub><br>C<sub>2</sub> = 16Q<sub>2</sub>.</span> The market demand is <span class="eq">Q<sup>D</sup> = 110 − 0.5P.</span> Compute the equilibrium of this Cournot game. What is the price in this market?`,['P = 84','P = 82','P = 78','P = 88','P = 76'],'A',`P = 220 − 2Q<sub>1</sub> − 2Q<sub>2</sub>. MR<sub>1</sub> = 220 − 4Q<sub>1</sub> − 2Q<sub>2</sub> = 16 gives Q<sub>1</sub> = 51 − 0.5Q<sub>2</sub>. Symmetric: Q<sub>1</sub> = Q<sub>2</sub> = 34. P = 220 − 4(34) = <b>84</b>.`);
Z('w10-20',10,3,`Firm 1 and Firm 2 are Cournot competitors. They have the same cost function C<sub>1</sub> = 2Q<sub>1</sub>, C<sub>2</sub> = 2Q<sub>2</sub>. The market demand is Q<sup>D</sup> = 40 − 0.5P. Compute the equilibrium and find the profit of Firm 1.`,'$338',['$392','$288','$169','$676'],`P = 80 − 2Q<sub>1</sub> − 2Q<sub>2</sub>. MR<sub>1</sub> = 80 − 4Q<sub>1</sub> − 2Q<sub>2</sub> = 2, so Q<sub>1</sub> = 19.5 − 0.5Q<sub>2</sub>. Symmetric: Q<sub>1</sub> = Q<sub>2</sub> = 13, P = 28. Profit = 28(13) − 2(13) = <b>338</b>.`);
Z('w10-21',10,3,`Modify the previous market (P = 80 − 2Q<sub>1</sub> − 2Q<sub>2</sub>, C<sub>1</sub> = 2Q<sub>1</sub>, C<sub>2</sub> = 2Q<sub>2</sub>). The government now makes Firm 2 pay a $6 tax per unit of output Q<sub>2</sub>. Firm 1 does not pay taxes. Compute the new Cournot equilibrium and the profit of Firm 1.`,'$392',['$338','$450','$242','$196'],`Firm 2's MC rises to 8: Q<sub>2</sub> = 18 − 0.5Q<sub>1</sub>. Firm 1: Q<sub>1</sub> = 19.5 − 0.5Q<sub>2</sub>. Solve: Q<sub>1</sub> = 14, Q<sub>2</sub> = 11, P = 30. Profit<sub>1</sub> = 30(14) − 2(14) = <b>392</b> (up from 338). Firm 2 falls to 242.`);

let filt={lv:0,ramos:false};
function chapter(ch){
  const k=CHS[ch];const all=QS.filter(q=>q.ch===ch);
  const draw=()=>{
    const list=all.filter(q=>(!filt.lv||q.lvl===filt.lv)&&(!filt.ramos||q.ramos));
    $('#ql').innerHTML=list.map(q=>{const s=S.stats[q.id];const st=!s||!s.n?['new','']:(s.s>=2?['❄ cold','cold']:(s.s===1?['✓','ok']:['✗ missed','bad']));
      const tt=q.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      return `<button class="qrow" data-id="${q.id}"><span class="dot l${q.lvl}"></span><span class="t">${q.ramos?'<b style="color:var(--gold)">Ramos #'+q.ramos+'</b> · ':''}${tt}</span><span class="st ${st[1]}">${st[0]}</span></button>`}).join('')||'<p>No questions match this filter.</p>';
    $('#startall').textContent=`Ski ${list.length} question${list.length===1?'':'s'}, warm-up to black`;
    $('#startall').dataset.n=list.length;
    document.querySelectorAll('.fchip').forEach(b=>{const v=b.dataset.v;b.setAttribute('aria-pressed',String(v==='r'?filt.ramos:(+v)===filt.lv&&true))});
  };
  app.innerHTML=`<div class="crumb"><button id="b">Lobby</button><span>/</span><span>${k.n}</span></div>
  <div class="phead"><h1>${k.n}: ${k.t}</h1></div>
  <p style="color:var(--muted);max-width:60ch">${k.d} ${all.length} questions, ${all.filter(q=>q.ramos).length} of them straight from the review deck.</p>
  <div class="filters"><button class="fchip" data-v="0">All runs</button><button class="fchip" data-v="1">● Green (easy)</button><button class="fchip" data-v="2">■ Blue (medium)</button><button class="fchip" data-v="3">◆ Black (hard)</button><button class="fchip" data-v="r">Ramos' exact only</button></div>
  <div class="actions" style="margin-top:0"><button class="btn" id="startall">Ski</button></div>
  <div class="qlist" id="ql"></div>`;
  app.onclick=e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.id==='b')return go(home);
    if(t.classList.contains('fchip')){const v=t.dataset.v;if(v==='r')filt.ramos=!filt.ramos;else{filt.lv=+v}return draw()}
    if(t.id==='startall'){
      const list=all.filter(q=>(!filt.lv||q.lvl===filt.lv)&&(!filt.ramos||q.ramos));if(!list.length)return;
      const ord=[1,2,3].flatMap(l=>shuf(list.filter(q=>q.lvl===l)));
      return go(()=>startRun({title:`${k.n}: ${k.t}`,list:ord.map(q=>q.id),ch}));
    }
    const r=t.closest('.qrow');if(r){const ids=[...document.querySelectorAll('.qrow')].map(x=>x.dataset.id);go(()=>startRun({title:`${k.n}: ${k.t}`,list:ids,start:ids.indexOf(r.dataset.id),ch}))}
  };
  draw();
}

function figHtml(q){
