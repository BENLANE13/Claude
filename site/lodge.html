  if(q.given)h+=`<div class="given">${q.given}</div>`;
  if(q.fig){
    if(typeof q.fig==='string'){h+=`<div class="fig">${F[q.fig]()}${q.fig==='beta'?'<div class="note">Not drawn to scale, as in the original.</div>':''}${q.fig==='gamma'?'<div class="note">Regions A–E are labeled; they light up after you answer.</div>':''}</div>`}
    else if(q.fig.t==='mx')h+=`<div class="fig">${renderMx(q.fig)}</div>`;
  }
  return h;
}
function showQ(){
  const id=run.list[run.i],q=BYID[id];
  const pct=Math.round(run.done/run.list.length*100);
  app.innerHTML=`<div class="crumb"><button id="b">Leave run</button><span>/</span><span>${run.title}</span></div>
  <div class="qwrap"><div class="qbar"><span class="mono" style="font-size:13px">${run.i+1} / ${run.list.length}</span><div class="prog"><i style="width:${pct}%"></i><em style="left:${pct}%">⛷</em></div><span class="chip">Hot cocoa hints: <b id="hn">${run.hints}</b></span></div>
  <article class="qcard" id="card"><div class="tags"><span class="run"><span class="dot l${q.lvl}"></span>${LV[q.lvl][0]} · ${LV[q.lvl][1]}</span><span class="tag">Ch ${q.ch}</span>${q.ramos?`<span class="tag ramos">Prof. Ramos' review #${q.ramos}</span>`:''}</div>
  <div class="qtext"><p>${q.q}</p></div>${figHtml(q)}
  <ol class="opts">${q.opts.map((o,i)=>`<li><button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="tx">${o}</span></button></li>`).join('')}</ol>
  <div id="fb"></div>
  <div class="actions"><button class="btn sec" id="hint">Use a hint</button><span class="spc"></span><button class="btn" id="next" hidden>Next</button></div></article></div>`;
  let locked=false;
  app.onclick=e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.id==='b')return go(home);
    if(t.id==='hint'){
      if(locked||run.hints<=0)return;
      const wrong=[...document.querySelectorAll('.opt')].filter(b=>+b.dataset.i!==q.a&&!b.classList.contains('gone'));
      shuf(wrong).slice(0,2).forEach(b=>{b.classList.add('gone');b.disabled=true});run.hints--;$('#hn').textContent=run.hints;return;
    }
    if(t.id==='next'){run.i++;if(run.i>=run.list.length)return finish();return showQ()}
    if(t.classList.contains('opt')&&!locked){
      locked=true;const pick=+t.dataset.i,ok=pick===q.a;
      document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===q.a)b.classList.add('good');else if(i===pick)b.classList.add('bad')});
      const st=stat(q.id);st.n++;let gain=0;
      if(ok){st.c++;st.s++;streak++;gain=Math.round(PTS[q.lvl]*(1+Math.min(streak-1,5)*0.1));S.pts+=gain;S.best=Math.max(S.best,streak);run.right++}else{st.s=0;streak=0}
      run.done++;run.res[q.id]=ok;save();hud();
      $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'} pop"><h4>${ok?(streak>=3?'On fire! '+streak+' in a row':'Clean turn'):'Wipeout. The answer is '+LET[q.a]}</h4><div>${q.why}</div>${ok?`<div class="pts">+${gain} m${st.s>=2&&q.ramos?' · ❄ this one is now cold':''}</div>`:''}</div>`;
      if(ok){const f=el(`<span class="float">+${gain} m</span>`);$('#card').style.position='relative';$('#card').appendChild(f);setTimeout(()=>f.remove(),1100)}
      revealFig(q);$('#hint').hidden=true;const n=$('#next');n.hidden=false;n.textContent=run.i+1>=run.list.length?'See results':'Next';n.focus();
    }
  };
}
function revealFig(q){
  if(q.fig&&q.fig.t==='mx')revealMx($('#card'),q.fig);
  if(q.reveal){const g=$('#gam');if(g)g.querySelectorAll('.rg').forEach(p=>p.classList.add(q.reveal.includes(p.dataset.r)?'on':'off'))}
}
function finish(){
  const t=run.list.length,r=run.right;
  const miss=run.list.filter(i=>run.res[i]===false);
  const cold=run.cold?coldOf(run.list):null;
  app.innerHTML=`<div class="crumb"><button id="b">Lobby</button><span>/</span><span>${run.title}</span></div>
  <section class="qcard"><div class="score"><div class="big">${r}/${t}</div><div><h2>${r/t>=.85?'Summit reached':r/t>=.6?'Solid descent':'Back to the lift'}</h2><p style="margin:6px 0;color:var(--muted)">Best streak ever: ${S.best} · ${fmt(S.pts)} m climbed · ${rankOf(S.pts)}${cold!==null?` · ${cold} of ${t} cold`:''}</p></div></div>
  ${miss.length?`<h3 style="margin:18px 0 6px">Missed (${miss.length})</h3>${miss.map(i=>rv(BYID[i])).join('')}`:'<p>No misses. Perfect run.</p>'}
  <div class="actions"><button class="btn" id="again">Ski it again</button>${miss.length?'<button class="btn sec" id="redo">Redo the misses</button>':''}<button class="btn sec" id="b2">Lobby</button></div></section>`;
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.id==='b'||t.id==='b2')return go(home);
    if(t.id==='again')return go(()=>startRun({title:run.title,list:shuf(run.list),ch:run.ch,cold:run.cold}));
    if(t.id==='redo')return go(()=>startRun({title:run.title+' · misses',list:miss,ch:run.ch}));
  };
}
function rv(q,mine){
  return `<details class="rv"><summary><span class="dot l${q.lvl}"></span><span style="flex:1;min-width:0;font-size:14px">${q.ramos?'<b style="color:var(--gold)">Ramos #'+q.ramos+'</b> · ':''}Ch ${q.ch} · ${q.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,110)}…</span>${mine!==undefined?`<span class="st ${mine===q.a?'ok':'bad'}">${mine===q.a?'✓':(mine==null?'—':'✗')}</span>`:''}</summary><div class="in"><div class="qtext"><p>${q.q}</p></div>${figHtmlStatic(q)}<ol class="opts">${q.opts.map((o,i)=>`<li><div class="opt ${i===q.a?'good':(i===mine?'bad':'')}"><span class="L">${LET[i]}</span><span class="tx">${o}</span></div></li>`).join('')}</ol><div class="fb"><div>${q.why}</div></div></div></details>`;
}
function figHtmlStatic(q){return figHtml(q)}

/* ---------- mock midterm ---------- */
function pick(pool,n,used){const out=[];for(const q of shuf(pool)){if(out.length>=n)break;if(!used.has(q.id)){out.push(q);used.add(q.id)}}return out}
function startMock(){
  const used=new Set(),sel=[];
  const plan={1:{7:3,8:2,10:3},2:{7:3,8:4,10:3},3:{7:2,8:2,10:2}};
  for(const l of [1,2,3])for(const ch of [7,8,10]){
    let got=pick(QS.filter(q=>q.lvl===l&&q.ch===ch),plan[l][ch],used);
    if(got.length<plan[l][ch])got=got.concat(pick(QS.filter(q=>q.lvl===l),plan[l][ch]-got.length,used));
    sel.push(...got);
  }
  const list=shuf(sel).map(q=>q.id);
  run={mode:'mock',title:'Mock midterm',list,i:0,ans:{},flag:{},t0:Date.now()};streak=0;hud();showMock();
}
function showMock(){
  const q=BYID[run.list[run.i]],n=run.list.length;
  const answered=Object.keys(run.ans).length;
  app.innerHTML=`<div class="crumb"><button id="b">Quit exam</button><span>/</span><span>Mock midterm</span></div>
  <div class="qwrap"><div class="qbar"><span class="mono">Question ${run.i+1} of ${n}</span><div class="prog"><i style="width:${answered/n*100}%"></i></div><span class="chip mono" id="clk">0:00</span><span class="chip">${answered}/${n} answered</span></div>
  <article class="qcard"><div class="tags"><span class="tag">Question ${run.i+1}</span>${run.flag[q.id]?'<span class="tag" style="color:var(--ember);border-color:var(--ember)">Flagged</span>':''}</div>
  <div class="qtext"><p>${q.q}</p></div>${figHtml(q)}
  <ol class="opts">${q.opts.map((o,i)=>`<li><button class="opt ${run.ans[q.id]===i?'sel':''}" data-i="${i}"><span class="L">${LET[i]}</span><span class="tx">${o}</span></button></li>`).join('')}</ol>
  <div class="actions"><button class="btn sec" id="prev" ${run.i?'':'disabled'}>Back</button><button class="btn sec" id="flag">${run.flag[q.id]?'Unflag':'Flag for later'}</button><span class="spc"></span>${run.i<n-1?'<button class="btn" id="nx">Next</button>':'<button class="btn" id="fin">Finish exam</button>'}</div></article>
  <div><div class="meta" style="margin-bottom:6px"><span>Jump to a question</span><span>blue = answered · dot = flagged</span></div><div class="navgrid">${run.list.map((id,i)=>`<button data-j="${i}" class="${run.ans[id]!==undefined?'ans':''} ${i===run.i?'cur':''} ${run.flag[id]?'flag':''}">${i+1}</button>`).join('')}</div></div></div>`;
  const tick=()=>{const c=$('#clk');if(!c){clearInterval(run.tm);return}const s=Math.floor((Date.now()-run.t0)/1000);c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  clearInterval(run.tm);run.tm=setInterval(tick,1000);tick();
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.id==='b'){clearInterval(run.tm);return go(home)}
    if(t.classList.contains('opt')){run.ans[q.id]=+t.dataset.i;return showMock()}
    if(t.id==='prev'){run.i--;return showMock()}
    if(t.id==='nx'){run.i++;return showMock()}
    if(t.id==='flag'){run.flag[q.id]=!run.flag[q.id];return showMock()}
    if(t.dataset.j!==undefined){run.i=+t.dataset.j;return showMock()}
    if(t.id==='fin'){
      const un=n-Object.keys(run.ans).length;
      if(un&&!run.confirm){run.confirm=true;return toast(`${un} unanswered. Press Finish again to submit anyway.`)}
      return mockResult();
    }
  };
}
function toast(m){const t=el(`<div class="toast" role="status">${m}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function mockResult(){
  clearInterval(run.tm);
  const n=run.list.length;let sc=0;const byCh={7:[0,0],8:[0,0],10:[0,0]},byLv={1:[0,0],2:[0,0],3:[0,0]};
  run.list.forEach(id=>{const q=BYID[id],ok=run.ans[id]===q.a;const st=stat(id);st.n++;if(ok){st.c++;st.s++;sc++;S.pts+=PTS[q.lvl]}else st.s=0;byCh[q.ch][1]++;byLv[q.lvl][1]++;if(ok){byCh[q.ch][0]++;byLv[q.lvl][0]++}});
  const secs=Math.floor((Date.now()-run.t0)/1000);
  S.mock=(S.mock||[]).concat([{sc,n,secs,d:Date.now()}]).slice(-10);save();hud();
  const bar=(l,v)=>`<div class="bar"><span>${l}</span><div class="tr"><i style="width:${v[1]?v[0]/v[1]*100:0}%"></i></div><span class="mono">${v[0]}/${v[1]}</span></div>`;
  const best=Math.max(...S.mock.map(m=>m.sc));
  app.innerHTML=`<div class="crumb"><button id="b">Lobby</button><span>/</span><span>Mock midterm results</span></div>
  <section class="qcard"><div class="score"><div class="big">${sc}/${n}</div><div><h2>${sc/n>=.9?'Summit':sc/n>=.75?'Strong run':sc/n>=.6?'Getting there':'More laps on the bunny hill'}</h2><p style="margin:6px 0;color:var(--muted)">${Math.round(sc/n*100)}% · ${Math.floor(secs/60)}m ${secs%60}s · your best mock: ${best}/${n}</p></div></div>
  <div class="bars">${bar('Chapter 7',byCh[7])}${bar('Chapter 8',byCh[8])}${bar('Chapter 10',byCh[10])}${bar('Easy',byLv[1])}${bar('Medium',byLv[2])}${bar('Hard',byLv[3])}</div>
  <h3 style="margin:10px 0 6px">Review every question</h3>${run.list.map(id=>rv(BYID[id],run.ans[id])).join('')}
  <div class="actions"><button class="btn" id="again">New mock exam</button><button class="btn sec" id="b2">Lobby</button></div></section>`;
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='b'||t.id==='b2')return go(home);if(t.id==='again')return go(startMock)};
}

/* ---------- library ---------- */
function library(){
  run=null;
  app.innerHTML=`<div class="crumb"><button id="b">Lobby</button><span>/</span><span>Method cards</span></div>
  <div class="phead"><h1>Method cards</h1></div><p style="color:var(--muted);max-width:62ch">The recipes behind almost every calculation question. The exam gives you the formula sheet below, but not these steps.</p>
  <div class="lib">
   <div class="card"><h3>Monopoly: price and quantity</h3><ol><li>Invert demand to get P as a function of Q.</li><li>REV = P·Q. Differentiate to get MR (same intercept as demand, twice the slope for linear demand).</li><li>Set <span class="fx">MR = MC</span>. Solve for Q.</li><li>Plug Q back into <i>demand</i> (not MR) for the price.</li><li>Profit = (P − AC)Q. Lerner L = (P − MC)/P = −1/E.</li></ol></div>
   <div class="card"><h3>Taxes and fixed costs</h3><ul><li>Per-unit tax: add it to MC. Q falls, P rises. Tax paid = t × Q.</li><li>License fee or fixed cost: Q and P do <b>not</b> change. Profit falls by the fee.</li><li>Shut down only if P &lt; AVC.</li></ul></div>
   <div class="card"><h3>Elasticity shortcuts</h3><ul><li>Inelastic (|E| &lt; 1): MR &lt; 0. A monopolist never sits here; it should raise price / cut output.</li><li>Raise price: inelastic → revenue up; elastic → revenue down.</li><li>Linear demand: slope constant, elasticity changes along the line.</li><li>MR = P(1/E + 1).</li></ul></div>
   <div class="card"><h3>Deadweight loss and surplus</h3><ul><li>Efficient Q: P = MC.</li><li>DWL = ½ (P<sub>M</sub> − MC at Q<sub>M</sub>)(Q<sub>PC</sub> − Q<sub>M</sub>).</li><li>PS (constant MC, no FC) = profit. With a rising MC: trapezoid h(b<sub>1</sub> + b<sub>2</sub>)/2.</li><li>Natural monopoly: P = MC loses money; the minimum feasible price is P = AC.</li></ul></div>
   <div class="card"><h3>Monopsony</h3><ol><li>Inverse supply w = f(L). Expenditure = w·L. Differentiate to get ME (twice the slope).</li><li>Hire where <span class="fx">MV = ME</span>.</li><li>Pay the wage from the <i>supply</i> curve at that quantity.</li></ol><p style="margin:8px 0 0;font-size:14px">Fewer units, lower price than competition.</p></div>
   <div class="card"><h3>Which price discrimination?</h3><ul><li><b>1st:</b> each unit/customer at reservation price.</li><li><b>2nd:</b> price depends on quantity bought (blocks, loyalty points, bulk).</li><li><b>3rd:</b> different groups, different prices (students, location).</li><li><b>Intertemporal:</b> new release high, later low.</li><li><b>Peak-load:</b> high at peak time or event, low off-peak.</li><li><b>Two-part tariff:</b> entry fee + usage fee.</li></ul></div>
   <div class="card"><h3>Third-degree, two markets</h3><ol><li>Invert each demand, find MR<sub>1</sub> and MR<sub>2</sub>.</li><li>Set <span class="fx">MR<sub>1</sub> = MR<sub>2</sub> = MC</span>. If MC depends on total Q, solve the two equations together.</li><li>Price each market from its own demand.</li></ol><p style="margin:8px 0 0;font-size:14px">Higher price goes in the less elastic market. Prices alone do not tell you which way to shift output; MR does.</p></div>
   <div class="card"><h3>Two-part tariff (one consumer)</h3><ol><li>Usage fee: where <span class="fx">P = MC</span> (efficient Q).</li><li>Entry fee T = consumer surplus at that price (triangle between demand and the usage fee).</li><li>Then CS = 0, DWL = 0, profit = PS = total surplus.</li></ol></div>
   <div class="card"><h3>First-degree and value of information</h3><p style="margin:0;font-size:15px">Sell the efficient Q and capture the whole triangle under demand above MC. The most a firm pays for customer data = <b>new profit − old profit</b> (graph: the old CS + old DWL).</p></div>
   <div class="card"><h3>Pure Nash equilibrium</h3><ol><li>For each column, circle Player 1's best payoff.</li><li>For each row, box Player 2's best payoff.</li><li>Cells with both are pure NE.</li></ol><p style="margin:8px 0 0;font-size:14px">Dominant strategy: best against <i>every</i> opponent action.</p></div>
   <div class="card"><h3>Classic games</h3><ul><li><b>Prisoner's Dilemma:</b> dominant strategies; equilibrium worse than the cooperative cell.</li><li><b>Battle of the Sexes:</b> two pure NE, each player prefers a different one.</li><li><b>Pure Coordination:</b> two pure NE, players indifferent.</li><li><b>Matching Pennies:</b> no pure NE; mixed 50/50.</li><li><b>Stag Hunt:</b> two NE; one is payoff-dominant.</li></ul></div>
   <div class="card"><h3>Expected payoff and best response</h3><ul><li>E[u] = p<sub>1</sub>u<sub>1</sub> + p<sub>2</sub>u<sub>2</sub> + …</li><li>Compute E[u] for each of your actions against the opponent's mix.</li><li>Strict maximum: play it with probability 1. Tie at the top: any mix of the tied actions. Never play a worse one.</li></ul></div>
   <div class="card"><h3>Cournot (quantities)</h3><ol><li>Inverse demand P = a − b(Q<sub>1</sub> + Q<sub>2</sub>).</li><li>MR<sub>1</sub> = a − 2bQ<sub>1</sub> − bQ<sub>2</sub>. Set = MC<sub>1</sub> for Firm 1's best response.</li><li>Do the same for Firm 2 and solve the two equations.</li><li>Tax on one firm: add it to that firm's MC.</li></ol><p style="margin:8px 0 0;font-size:14px">Best responses slope down. Lower-cost firm: bigger share, bigger profit.</p></div>
   <div class="card"><h3>Bertrand</h3><p style="margin:0;font-size:15px">Identical products, same cost: <b>P = MC</b>, profit 0, L = 0, same as perfect competition. Total Q from demand at P = MC, split evenly.</p><p style="margin:8px 0 0;font-size:14px">Ranking: P<sub>PC</sub> = P<sub>B</sub> &lt; P<sub>C</sub> &lt; P<sub>M</sub>; Q reversed; DWL and L rise from PC to M.</p></div>
   <div class="card"><h3>Differentiated prices</h3><ol><li>Write Q<sub>1</sub>(p<sub>1</sub>, p<sub>2</sub>). Profit<sub>1</sub> = (p<sub>1</sub> − c)Q<sub>1</sub>.</li><li>Differentiate with respect to p<sub>1</sub>, set = 0: best response.</li><li>Do the same for Firm 2 and solve.</li></ol><p style="margin:8px 0 0;font-size:14px">Best responses slope up.</p></div>
   <div class="card"><h3>Formula sheet (given on the exam)</h3><ul style="list-style:none;padding:0;font-size:14px"><li class="fx">E = (dQ/dp)(p/Q)</li><li class="fx">L = (p − MC)/p = −1/E</li><li class="fx">MC = dC/dQ, AC = C/Q, AVC = VC/Q</li><li class="fx">MR = dREV/dQ = p(1/E + 1)</li><li class="fx">Profit = REV − C = (p − AC)Q = VarProfit − FC</li><li class="fx">Profit = REV<sub>1</sub>(Q<sub>1</sub>) + REV<sub>2</sub>(Q<sub>2</sub>) − C(Q<sub>1</sub> + Q<sub>2</sub>)</li><li class="fx">E[u] = p<sub>1</sub>u<sub>1</sub> + … + p<sub>n</sub>u<sub>n</sub></li><li class="fx">Cournot: Profit<sub>i</sub> = P(Q<sub>1</sub> + Q<sub>2</sub>)Q<sub>i</sub> − C<sub>i</sub>(Q<sub>i</sub>)</li><li class="fx">Differentiated: Profit<sub>i</sub> = p<sub>i</sub>Q<sub>i</sub>(p<sub>i</sub>, p<sub>j</sub>) − C<sub>i</sub>(Q<sub>i</sub>)</li><li class="fx">Trapezoid area A = h(b<sub>1</sub> + b<sub>2</sub>)/2</li></ul></div>
  </div>`;
  app.onclick=e=>{if(e.target.closest('#b'))go(home)};
}

/* ---------- chrome ---------- */
$('#home').onclick=()=>go(home);
$('#libbtn').onclick=()=>go(library);
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
applyTheme(S.theme);
$('#theme').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');S.theme=cur==='dark'?'light':'dark';applyTheme(S.theme);save()};
document.addEventListener('keydown',e=>{
  if(!run||run.mode!=='practice')return;
  const k=e.key.toUpperCase();
  if(LET.includes(k)){const b=document.querySelector(`.opt[data-i="${LET.indexOf(k)}"]`);if(b&&!b.disabled)b.click()}
  if((e.key==='Enter'||e.key===' ')&&$('#next')&&!$('#next').hidden&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();$('#next').click()}
});

/* ---------- snowfall ---------- */
(function(){
  const c=$('#snow');if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const x=c.getContext('2d');let W,H,fl=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;fl=Array.from({length:Math.min(90,Math.floor(W/14))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,v:Math.random()*.7+.25,d:Math.random()*Math.PI*2}))}
  size();addEventListener('resize',size);
  function draw(){x.clearRect(0,0,W,H);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--snow')||'rgba(255,255,255,.8)';
    fl.forEach(f=>{f.y+=f.v;f.d+=.01;f.x+=Math.sin(f.d)*.4;if(f.y>H+4){f.y=-4;f.x=Math.random()*W}x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fill()});
    if(!document.hidden)requestAnimationFrame(draw);}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestAnimationFrame(draw)});
  requestAnimationFrame(draw);
})();

hud();home();
})();
