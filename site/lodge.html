let filt={lv:0,ramos:false};
function chapter(ch){
  const k=CHS[ch];const all=QS.filter(q=>q.ch===ch);
  const draw=()=>{
    const list=all.filter(q=>(!filt.lv||q.lvl===filt.lv)&&(!filt.ramos||q.ramos));
    $('#ql').innerHTML=list.map(q=>{const s=S.stats[q.id];const st=!s||!s.n?['new','']:(s.s>=2?['❄ cold','cold']:(s.s===1?['✓','ok']:['✗ missed','bad']));
      const tt=q.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      return `<button class="qrow" data-id="${q.id}"><span class="dot l${q.lvl}"></span><span class="t">${q.ramos?'<b style="color:var(--gold)">Deck #'+q.ramos+'</b> · ':''}${tt}</span><span class="st ${st[1]}">${st[0]}</span></button>`}).join('')||'<p>No questions match this filter.</p>';
    $('#startall').textContent=`Ski ${list.length} question${list.length===1?'':'s'}, warm-up to black`;
    $('#startall').dataset.n=list.length;
    document.querySelectorAll('.fchip').forEach(b=>{const v=b.dataset.v;b.setAttribute('aria-pressed',String(v==='r'?filt.ramos:(+v)===filt.lv&&true))});
  };
  app.innerHTML=`<div class="crumb"><button id="b">Lobby</button><span>/</span><span>${k.n}</span></div>
  <div class="phead"><h1>${k.n}: ${k.t}</h1></div>
  <p style="color:var(--muted);max-width:60ch">${k.d} ${all.length} questions.${all.some(q=>q.ramos)?` ${all.filter(q=>q.ramos).length} come straight from the review deck.`:''}</p>
  <div class="filters"><button class="fchip" data-v="0">All runs</button><button class="fchip" data-v="1">● Green (easy)</button><button class="fchip" data-v="2">■ Blue (medium)</button><button class="fchip" data-v="3">◆ Black (hard)</button>${all.some(q=>q.ramos)?'<button class="fchip" data-v="r">Review deck only</button>':''}</div>
  <div class="actions" style="margin-top:0"><button class="btn" id="startall">Ski</button></div>
  <div class="qlist" id="ql"></div>`;
  app.onclick=e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.id==='b')return go(home);
    if(t.classList.contains('fchip')){const v=t.dataset.v;if(v==='r')filt.ramos=!filt.ramos;else{filt.lv=+v}return draw()}
    if(t.id==='startall'){
      const list=all.filter(q=>(!filt.lv||q.lvl===filt.lv)&&(!filt.ramos||q.ramos));if(!list.length)return;
      const ord=[1,2,3].flatMap(l=>shuf(list.filter(q=>q.lvl===l)));
      return go(()=>startRun({title:`${k.n}: ${k.t}`,list:ord.map(q=>q.id),ch}));
    }
    const r=t.closest('.qrow');if(r){const ids=[...document.querySelectorAll('.qrow')].map(x=>x.dataset.id);go(()=>startRun({title:`${k.n}: ${k.t}`,list:ids,start:ids.indexOf(r.dataset.id),ch}))}
  };
  draw();
}

/* ---------- run (practice with instant feedback) ---------- */
function startRun(o){run={mode:'practice',title:o.title,list:o.list,i:o.start||0,hints:3,done:0,right:0,res:{},ch:o.ch,cold:!!o.cold};streak=0;hud();showQ()}
function figHtml(q){
  let h='';
  if(q.given)h+=`<div class="given">${q.given}</div>`;
  if(q.fig){
    if(typeof q.fig==='string'){h+=`<div class="fig">${F[q.fig]()}</div>`}
    else if(q.fig.t==='mx')h+=`<div class="fig">${renderMx(q.fig)}</div>`;
    else if(q.fig.t==='tree')h+=renderTree(q.fig);
  }
  return h;
}
function showQ(){
  const id=run.list[run.i],q=BYID[id];
  const pct=Math.round(run.done/run.list.length*100);
  app.innerHTML=`<div class="crumb"><button id="b">Leave run</button><span>/</span><span>${run.title}</span></div>
  <div class="qwrap"><div class="qbar"><span class="mono" style="font-size:13px">${run.i+1} / ${run.list.length}</span><div class="prog"><i style="width:${pct}%"></i><em style="left:${pct}%">⛷</em></div><span class="chip">Hot cocoa hints: <b id="hn">${run.hints}</b></span></div>
  <article class="qcard" id="card"><div class="tags"><span class="run"><span class="dot l${q.lvl}"></span>${LV[q.lvl][0]} · ${LV[q.lvl][1]}</span><span class="tag">Ch ${q.ch}</span>${q.ramos?`<span class="tag ramos">Review deck #${q.ramos}</span>`:''}</div>
  <div class="qtext"><p>${q.q}</p></div>${figHtml(q)}
  <ol class="opts">${q.opts.map((o,i)=>`<li><button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="tx">${o}</span></button></li>`).join('')}</ol>
  <div id="fb"></div>
  <div class="actions"><button class="btn sec" id="hint">Use a hint</button><span class="spc"></span><button class="btn" id="next" hidden>Next</button></div></article></div>`;
  let locked=false;
  app.onclick=e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.id==='b')return go(home);
    if(t.id==='hint'){
      if(locked||run.hints<=0)return;
      const wrong=[...document.querySelectorAll('.opt')].filter(b=>+b.dataset.i!==q.a&&!b.classList.contains('gone'));
      shuf(wrong).slice(0,2).forEach(b=>{b.classList.add('gone');b.disabled=true});run.hints--;$('#hn').textContent=run.hints;return;
    }
    if(t.id==='next'){run.i++;if(run.i>=run.list.length)return finish();return showQ()}
    if(t.classList.contains('opt')&&!locked){
      locked=true;const pick=+t.dataset.i,ok=pick===q.a;
      document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===q.a)b.classList.add('good');else if(i===pick)b.classList.add('bad')});
      const st=stat(q.id);st.n++;let gain=0;
      if(ok){st.c++;st.s++;streak++;gain=Math.round(PTS[q.lvl]*(1+Math.min(streak-1,5)*0.1));S.pts+=gain;S.best=Math.max(S.best,streak);run.right++}else{st.s=0;streak=0}
      run.done++;run.res[q.id]=ok;save();hud();
      $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'} pop"><h4>${ok?(streak>=3?'On fire! '+streak+' in a row':'Clean turn'):'Wipeout. The answer is '+LET[q.a]}</h4><div>${q.why}</div>${ok?`<div class="pts">+${gain} m${st.s>=2&&q.ramos?' · ❄ this one is now cold':''}</div>`:''}</div>`;
      if(ok){const f=el(`<span class="float">+${gain} m</span>`);$('#card').style.position='relative';$('#card').appendChild(f);setTimeout(()=>f.remove(),1100)}
      revealFig(q);$('#hint').hidden=true;const n=$('#next');n.hidden=false;n.textContent=run.i+1>=run.list.length?'See results':'Next';n.focus();
    }
  };
}
function revealFig(q){
  if(q.fig&&q.fig.t==='mx')revealMx($('#card'),q.fig);
  if(q.fig&&q.fig.t==='tree')revealTree($('#card'),q.fig);
  if(q.reveal){const g=$('#gam');if(g)g.querySelectorAll('.rg').forEach(p=>p.classList.add(q.reveal.includes(p.dataset.r)?'on':'off'))}
}
function finish(){
  const t=run.list.length,r=run.right;
  const miss=run.list.filter(i=>run.res[i]===false);
  const cold=run.cold?coldOf(run.list):null;
  app.innerHTML=`<div class="crumb"><button id="b">Lobby</button><span>/</span><span>${run.title}</span></div>
  <section class="qcard"><div class="score"><div class="big">${r}/${t}</div><div><h2>${r/t>=.85?'Summit reached':r/t>=.6?'Solid descent':'Back to the lift'}</h2><p style="margin:6px 0;color:var(--muted)">Best streak ever: ${S.best} · ${fmt(S.pts)} m climbed · ${rankOf(S.pts)}${cold!==null?` · ${cold} of ${t} cold`:''}</p></div></div>
  ${miss.length?`<h3 style="margin:18px 0 6px">Missed (${miss.length})</h3>${miss.map(i=>rv(BYID[i])).join('')}`:'<p>No misses. Perfect run.</p>'}
  <div class="actions"><button class="btn" id="again">Ski it again</button>${miss.length?'<button class="btn sec" id="redo">Redo the misses</button>':''}<button class="btn sec" id="b2">Lobby</button></div></section>`;
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.id==='b'||t.id==='b2')return go(home);
    if(t.id==='again')return go(()=>startRun({title:run.title,list:shuf(run.list),ch:run.ch,cold:run.cold}));
    if(t.id==='redo')return go(()=>startRun({title:run.title+' · misses',list:miss,ch:run.ch}));
  };
}
function rv(q,mine){
  return `<details class="rv"><summary><span class="dot l${q.lvl}"></span><span style="flex:1;min-width:0;font-size:14px">${q.ramos?'<b style="color:var(--gold)">Deck #'+q.ramos+'</b> · ':''}Ch ${q.ch} · ${q.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,110)}…</span>${mine!==undefined?`<span class="st ${mine===q.a?'ok':'bad'}">${mine===q.a?'✓':(mine==null?'—':'✗')}</span>`:''}</summary><div class="in"><div class="qtext"><p>${q.q}</p></div>${figHtmlStatic(q)}<ol class="opts">${q.opts.map((o,i)=>`<li><div class="opt ${i===q.a?'good':(i===mine?'bad':'')}"><span class="L">${LET[i]}</span><span class="tx">${o}</span></div></li>`).join('')}</ol><div class="fb"><div>${q.why}</div></div></div></details>`;
}
function figHtmlStatic(q){return figHtml(q)}

/* ---------- mock midterm ---------- */
function pick(pool,n,used){const out=[];for(const q of shuf(pool)){if(out.length>=n)break;if(!used.has(q.id)){out.push(q);used.add(q.id)}}return out}
function startMock(){
  const used=new Set(),sel=[];
  const plan={1:[3,2,3],2:[3,4,3],3:[2,2,2]};
  for(const l of [1,2,3])CHKEYS.forEach((ch,i)=>{
    const n=plan[l][i];
    let got=pick(QS.filter(q=>q.lvl===l&&q.ch===ch),n,used);
    if(got.length<n)got=got.concat(pick(QS.filter(q=>q.lvl===l),n-got.length,used));
    sel.push(...got);
  });
  const list=shuf(sel).map(q=>q.id);
  run={mode:'mock',title:'Mock midterm',list,i:0,ans:{},flag:{},t0:Date.now()};streak=0;hud();showMock();
}
function showMock(){
  const q=BYID[run.list[run.i]],n=run.list.length;
  const answered=Object.keys(run.ans).length;
  app.innerHTML=`<div class="crumb"><button id="b">Quit exam</button><span>/</span><span>Mock midterm</span></div>
  <div class="qwrap"><div class="qbar"><span class="mono">Question ${run.i+1} of ${n}</span><div class="prog"><i style="width:${answered/n*100}%"></i></div><span class="chip mono" id="clk">0:00</span><span class="chip">${answered}/${n} answered</span></div>
  <article class="qcard"><div class="tags"><span class="tag">Question ${run.i+1}</span>${run.flag[q.id]?'<span class="tag" style="color:var(--ember);border-color:var(--ember)">Flagged</span>':''}</div>
  <div class="qtext"><p>${q.q}</p></div>${figHtml(q)}
  <ol class="opts">${q.opts.map((o,i)=>`<li><button class="opt ${run.ans[q.id]===i?'sel':''}" data-i="${i}"><span class="L">${LET[i]}</span><span class="tx">${o}</span></button></li>`).join('')}</ol>
  <div class="actions"><button class="btn sec" id="prev" ${run.i?'':'disabled'}>Back</button><button class="btn sec" id="flag">${run.flag[q.id]?'Unflag':'Flag for later'}</button><span class="spc"></span>${run.i<n-1?'<button class="btn" id="nx">Next</button>':'<button class="btn" id="fin">Finish exam</button>'}</div></article>
  <div><div class="meta" style="margin-bottom:6px"><span>Jump to a question</span><span>blue = answered · dot = flagged</span></div><div class="navgrid">${run.list.map((id,i)=>`<button data-j="${i}" class="${run.ans[id]!==undefined?'ans':''} ${i===run.i?'cur':''} ${run.flag[id]?'flag':''}">${i+1}</button>`).join('')}</div></div></div>`;
  const tick=()=>{const c=$('#clk');if(!c){clearInterval(run.tm);return}const s=Math.floor((Date.now()-run.t0)/1000);c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  clearInterval(run.tm);run.tm=setInterval(tick,1000);tick();
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.id==='b'){clearInterval(run.tm);return go(home)}
    if(t.classList.contains('opt')){run.ans[q.id]=+t.dataset.i;return showMock()}
    if(t.id==='prev'){run.i--;return showMock()}
    if(t.id==='nx'){run.i++;return showMock()}
    if(t.id==='flag'){run.flag[q.id]=!run.flag[q.id];return showMock()}
    if(t.dataset.j!==undefined){run.i=+t.dataset.j;return showMock()}
    if(t.id==='fin'){
      const un=n-Object.keys(run.ans).length;
      if(un&&!run.confirm){run.confirm=true;return toast(`${un} unanswered. Press Finish again to submit anyway.`)}
      return mockResult();
    }
  };
}
function toast(m){const t=el(`<div class="toast" role="status">${m}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function mockResult(){
  clearInterval(run.tm);
  const n=run.list.length;let sc=0;const byCh={11:[0,0],12:[0,0],13:[0,0]},byLv={1:[0,0],2:[0,0],3:[0,0]};
  run.list.forEach(id=>{const q=BYID[id],ok=run.ans[id]===q.a;const st=stat(id);st.n++;if(ok){st.c++;st.s++;sc++;S.pts+=PTS[q.lvl]}else st.s=0;byCh[q.ch][1]++;byLv[q.lvl][1]++;if(ok){byCh[q.ch][0]++;byLv[q.lvl][0]++}});
  const secs=Math.floor((Date.now()-run.t0)/1000);
  S.mock=(S.mock||[]).concat([{sc,n,secs,d:Date.now()}]).slice(-10);save();hud();
  const bar=(l,v)=>`<div class="bar"><span>${l}</span><div class="tr"><i style="width:${v[1]?v[0]/v[1]*100:0}%"></i></div><span class="mono">${v[0]}/${v[1]}</span></div>`;
  const best=Math.max(...S.mock.map(m=>m.sc));
  app.innerHTML=`<div class="crumb"><button id="b">Lobby</button><span>/</span><span>Mock midterm results</span></div>
  <section class="qcard"><div class="score"><div class="big">${sc}/${n}</div><div><h2>${sc/n>=.9?'Summit':sc/n>=.75?'Strong run':sc/n>=.6?'Getting there':'More laps on the bunny hill'}</h2><p style="margin:6px 0;color:var(--muted)">${Math.round(sc/n*100)}% · ${Math.floor(secs/60)}m ${secs%60}s · your best mock: ${best}/${n}</p></div></div>
  <div class="bars">${bar('Chapter 11',byCh[11])}${bar('Chapter 12',byCh[12])}${bar('Chapter 13',byCh[13])}${bar('Easy',byLv[1])}${bar('Medium',byLv[2])}${bar('Hard',byLv[3])}</div>
  <h3 style="margin:10px 0 6px">Review every question</h3>${run.list.map(id=>rv(BYID[id],run.ans[id])).join('')}
  <div class="actions"><button class="btn" id="again">New mock exam</button><button class="btn sec" id="b2">Lobby</button></div></section>`;
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='b'||t.id==='b2')return go(home);if(t.id==='again')return go(startMock)};
}

/* ---------- library ---------- */
function library(){
  run=null;
  app.innerHTML=`<div class="crumb"><button id="b">Lobby</button><span>/</span><span>Method cards</span></div>
  <div class="phead"><h1>Method cards</h1></div><p style="color:var(--muted);max-width:62ch">The recipes behind almost every calculation question in Chapters 11, 12 and 13.</p>
  <div class="lib">
   <div class="card"><h3>Backward induction (SPE)</h3><ol><li>Start at the last decision nodes.</li><li>At each one, the mover picks the branch with the best payoff <i>for her</i>. Mark it.</li><li>Replace each node with that payoff and move up one level.</li><li>Repeat to the root. The marked path is the subgame perfect equilibrium.</li></ol></div>
   <div class="card"><h3>Credible vs non-credible threats</h3><ul><li>A threat is credible only if carrying it out is the threatener's best response <i>at that node</i>.</li><li>Ask: if the first mover ignores the threat, would the second mover really do it?</li><li>Entry game: an incumbent who earns more by accommodating after entry cannot credibly threaten to fight.</li></ul></div>
   <div class="card"><h3>Sequential vs simultaneous</h3><ul><li>Moving first can help (Battle of the Sexes, Stackelberg leader) or hurt (the 9 vs 11 example): compare the two SPE payoffs.</li><li>Nash equilibria that rest on non-credible threats are not subgame perfect.</li></ul></div>
   <div class="card"><h3>Stackelberg (quantities)</h3><ol><li>Invert demand. P = a − b(Q<sub>1</sub> + Q<sub>2</sub>).</li><li>Follower: MR<sub>2</sub> = MC<sub>2</sub> gives a best response Q<sub>2</sub>(Q<sub>1</sub>).</li><li>Leader: substitute Q<sub>2</sub>(Q<sub>1</sub>) into her revenue, get MR<sub>1</sub>, set MR<sub>1</sub> = MC<sub>1</sub>.</li><li>Then Q<sub>2</sub> and P from the demand curve.</li></ol><p style="margin:8px 0 0;font-size:14px">Leader produces more and the follower less than in Cournot.</p></div>
   <div class="card"><h3>Bargaining trees</h3><ul><li>The responder accepts any offer that beats her payoff from rejecting.</li><li>With a counteroffer round, compare "accept now" to "reject, then counteroffer".</li><li>The proposer extracts almost everything if the responder's alternative is 0.</li></ul></div>
   <div class="card"><h3>Repeated games: grim trigger</h3><ol><li>Cooperate forever: R + R/r, or R/(1 − δ).</li><li>Deviate: T now, then P forever: T + P/r.</li><li>Cooperate if the first is at least the second, with δ = 1/(1 + r).</li></ol><p style="margin:8px 0 0;font-size:14px">Known last period (finite repetition): no cooperation at all, it unravels from the end. Infinite horizon: cooperate if r is low enough.</p></div>
   <div class="card"><h3>Adverse selection vs moral hazard</h3><ul><li><b>Adverse selection:</b> hidden <i>type</i> before the deal (lemons, sick people buying insurance).</li><li><b>Moral hazard:</b> hidden <i>action</i> after the deal (insured people take less care, workers shirk).</li><li>Group insurance and information sharing reduce adverse selection. Co-pays, deductibles and bonuses reduce moral hazard.</li></ul></div>
   <div class="card"><h3>Signaling threshold y*</h3><ol><li>High type must want the signal: wage gain ≥ high-type cost × y*.</li><li>Low type must not want it: wage gain ≤ low-type cost × y*.</li><li>Answer: gain/cost<sub>low</sub> ≤ y* ≤ gain/cost<sub>high</sub>.</li></ol><p style="margin:8px 0 0;font-size:14px">Extra per-year payments or fixed fees: put them into the net payoff before comparing.</p></div>
   <div class="card"><h3>Warranty signaling</h3><ol><li>High-quality firm offers y* if profit with warranty ≥ profit without.</li><li>Low-quality firm does not if profit with warranty ≤ profit without.</li><li>Two inequalities give the range for y*.</li></ol></div>
   <div class="card"><h3>Expected utility and insurance</h3><ul><li>E[U] = Σ probability × u(income in that state).</li><li>Pay the premium in every state; pay the co-pay and costs only in the sick/fire state.</li><li>Moral hazard is fixed if E[U] with the careful action ≥ E[U] with the careless action.</li></ul></div>
   <div class="card"><h3>Principal-agent: wage or bonus</h3><ol><li>Agent: utility = bonus × output − effort cost. FOC gives his best response e*(b).</li><li>Output Q(e*(b)) as a function of b.</li><li>Principal: profit = revenue − bQ − other costs. FOC in b.</li><li>Plug back to get Q, price and profit.</li></ol></div>
   <div class="card"><h3>Incentive compatibility</h3><ul><li>Certain outcomes: w<sub>H</sub> − w<sub>L</sub> ≥ effort cost.</li><li>Probabilistic: w<sub>H</sub> − w<sub>L</sub> ≥ cost / (increase in probability of high revenue).</li><li>Share of revenue x: x × E[rev | high] − cost ≥ x × E[rev | low].</li></ul></div>
   <div class="card"><h3>Risk of bankruptcy and fines</h3><ul><li>If the bonus is paid with probability π, multiply it by π in the agent's utility.</li><li>Fine F after an accident: firm compares −cost − p<sub>high</sub>F with −p<sub>low</sub>F. Minimum F makes them equal.</li><li>Continuous safety s: maximize −(1 − s)F − s², so s = F/2.</li></ul></div>
   <div class="card"><h3>Efficiency wage</h3><p style="margin:0;font-size:15px">A wage above the market-clearing level makes losing the job costly, so workers do not shirk. The price is some unemployment.</p></div>
   <div class="card"><h3>Calculus reminders</h3><ul style="list-style:none;padding:0;font-size:14px"><li class="fx">d(ax²)/dx = 2ax</li><li class="fx">d(a√x)/dx = a/(2√x)</li><li class="fx">Maximize: set the derivative to zero</li><li class="fx">u(I) = √I: u(100) = 10, u(64) = 8</li></ul></div>
  </div>`;
  app.onclick=e=>{if(e.target.closest('#b'))go(home)};
}

(function(){
  const c=$('#snow');if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const x=c.getContext('2d');let W,H,fl=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;fl=Array.from({length:Math.min(90,Math.floor(W/14))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,v:Math.random()*.7+.25,d:Math.random()*Math.PI*2}))}
  size();addEventListener('resize',size);
  function draw(){x.clearRect(0,0,W,H);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--snow')||'rgba(255,255,255,.8)';
    fl.forEach(f=>{f.y+=f.v;f.d+=.01;f.x+=Math.sin(f.d)*.4;if(f.y>H+4){f.y=-4;f.x=Math.random()*W}x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fill()});
    if(!document.hidden)requestAnimationFrame(draw);}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestAnimationFrame(draw)});
  requestAnimationFrame(draw);
})();
