<title>Chalet 351</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a mountain lodge. Hanging wooden sign over a trail map; every quiz is a run down the slope. */
/* Palette follows Chalet 113: a mountain lodge in the blue hour. Accent blue, sign-blue headers, snowy blue-white hero. */
:root{
  --bg:#e8f1fc; --bg2:#f5f9ff; --panel:#ffffff; --panel2:#edf3fb; --line:#c3d6ee;
  --fg:#0e2240; --muted:#4e6280;
  --ember:#1f6fe0; --ember-ink:#ffffff; --ice:#0f87c9; --pine:#127a55; --berry:#c3304a; --gold:#946400;
  --wood:#1c4180; --wood2:#2f64b8; --wood-ink:#eaf3ff;
  --run1:#1f9d6b; --run2:#1f6fe0; --run3:#0e2240;
  --hero1:#9cc4ef; --hero2:#cfe3f8; --hero3:#eef6fd; --hero-ink:#0e2240;
  --m1:#6fa3dc; --m2:#4a82c6; --m3:#2d62a8; --snowcap:#ffffff;
  --shadow:0 10px 28px rgba(20,50,100,.16); --snow:rgba(255,255,255,.95);
  --disp:'Rozha One','Georgia',serif; --body:'Figtree','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07111e; --bg2:#0b1a2d; --panel:#11253f; --panel2:#193152; --line:#2a4a7c;
    --fg:#e8f2ff; --muted:#9db5d6;
    --ember:#4da3ff; --ember-ink:#04152b; --ice:#8fd8ff; --pine:#41d3a2; --berry:#ff7084; --gold:#ffd166;
    --wood:#1e4382; --wood2:#336cc4; --wood-ink:#eaf3ff;
    --run1:#41d3a2; --run2:#4da3ff; --run3:#e8f2ff;
    --hero1:#0d2a52; --hero2:#16407a; --hero3:#2a5c9f; --hero-ink:#eaf4ff;
    --m1:#2c5f9e; --m2:#1f4a82; --m3:#143562; --snowcap:#dcecff;
    --shadow:0 10px 30px rgba(0,0,0,.45); --snow:rgba(220,236,255,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07111e; --bg2:#0b1a2d; --panel:#11253f; --panel2:#193152; --line:#2a4a7c;
  --fg:#e8f2ff; --muted:#9db5d6;
  --ember:#4da3ff; --ember-ink:#04152b; --ice:#8fd8ff; --pine:#41d3a2; --berry:#ff7084; --gold:#ffd166;
  --wood:#1e4382; --wood2:#336cc4; --wood-ink:#eaf3ff;
  --run1:#41d3a2; --run2:#4da3ff; --run3:#e8f2ff;
  --hero1:#0d2a52; --hero2:#16407a; --hero3:#2a5c9f; --hero-ink:#eaf4ff;
  --m1:#2c5f9e; --m2:#1f4a82; --m3:#143562; --snowcap:#dcecff;
  --shadow:0 10px 30px rgba(0,0,0,.45); --snow:rgba(220,236,255,.9); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px;line-height:1.15}
.mono{font-family:var(--mono)}
/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .sign{background:linear-gradient(180deg,var(--wood2),var(--wood));color:var(--wood-ink);font-family:var(--disp);font-size:20px;padding:6px 14px 7px;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.3);position:relative}
.brand .sign::before,.brand .sign::after{content:"";position:absolute;top:-8px;width:2px;height:8px;background:var(--muted)}
.brand .sign::before{left:14px}.brand .sign::after{right:14px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.nbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.nbtn:hover{border-color:var(--ember)}
/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);color:var(--hero-ink);padding:30px 22px 140px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(34px,6.2vw,60px);line-height:1.02;max-width:12ch}
.hero p{max-width:46ch;margin:12px 0 0;opacity:.92}
.hero .kick{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:10px}
.hero svg.mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:130px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:2}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--ember);color:var(--ember-ink);box-shadow:0 3px 0 rgba(0,20,60,.35)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sec{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.sec-h small{color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.trail{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;position:relative;transition:transform .15s,border-color .15s}
.trail:hover{transform:translateY(-3px);border-color:var(--ember)}
.trail .marker{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-family:var(--disp);font-size:19px;color:#fff;background:linear-gradient(180deg,var(--wood2),var(--wood));box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.trail h3{font-size:22px}
.trail .wk{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.trail p{margin:0;color:var(--muted);font-size:14px}
.cable{height:8px;border-radius:99px;background:var(--panel2);position:relative;overflow:visible}
.cable i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pine),var(--ice))}
.cable em{position:absolute;top:-6px;width:16px;height:16px;border-radius:4px;background:var(--fg);transform:translateX(-50%) rotate(45deg);box-shadow:0 2px 0 rgba(0,20,60,.35)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.special{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--ember)}
.tile h3{font-size:20px}
.tile p{margin:0;font-size:14px;color:var(--muted)}
.tile.fire{background:linear-gradient(160deg,var(--wood2),var(--wood));color:var(--wood-ink);border-color:transparent}
.tile.fire p{color:inherit;opacity:.85}
.tile.ice{background:linear-gradient(160deg,var(--wood2),var(--wood));color:var(--wood-ink);border-color:transparent}
.tile.ice p{color:inherit;opacity:.85}
.cold18{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:8px}
.cold18 span{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.cold18 span.on{background:#eaf3ff;color:#1c4180;box-shadow:none;font-weight:600}
/* chapter page */
.crumb{display:flex;gap:8px;align-items:center;margin:6px 0 14px;color:var(--muted);font-size:14px}
.crumb button{background:none;border:0;color:var(--ice);padding:0}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead h1{font-size:clamp(28px,5vw,44px)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fchip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ember);color:var(--ember-ink);border-color:var(--ember);font-weight:600}
.qlist{display:grid;gap:8px;margin-top:10px}
.qrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;min-width:0}
.qrow:hover{border-color:var(--ember)}
.qrow .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.dot.l1{background:var(--run1);border-radius:50%}.dot.l2{background:var(--run2);border-radius:3px}.dot.l3{background:var(--run3);transform:rotate(45deg) scale(.85);box-shadow:0 0 0 1.5px var(--muted)}
.st{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.st.cold{color:var(--ice)}.st.ok{color:var(--pine)}.st.bad{color:var(--berry)}
/* quiz */
.qwrap{display:grid;gap:14px;margin-top:6px}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{flex:1;min-width:140px;height:10px;background:var(--panel2);border-radius:99px;position:relative}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--run1),var(--ice))}
.prog em{position:absolute;top:-8px;width:24px;height:24px;margin-left:-12px;font-style:normal;text-align:center;line-height:24px;font-size:16px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.run{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.tag.ramos{color:var(--gold);border-color:var(--gold)}
.qtext{font-size:17px;max-width:68ch}
.qtext p{margin:0 0 10px}
.given{border-left:3px solid var(--ice);background:var(--panel2);padding:8px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:15px;color:var(--muted)}
.eq{font-family:var(--mono);font-size:15px;background:var(--panel2);border-radius:10px;padding:8px 12px;margin:8px 0;display:block;overflow-x:auto}
.fig{margin:14px 0;overflow-x:auto}
svg.plot{width:100%;max-width:520px;height:auto;display:block}
svg .ax{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;fill:none}
svg .ln{fill:none;stroke-width:2.4;stroke-linecap:round}
svg .dem{stroke:var(--ice)}svg .mr{stroke:var(--pine)}svg .mc{stroke:var(--ember)}svg .ac{stroke:var(--gold)}svg .sup{stroke:var(--ember)}
svg text{fill:var(--fg);font-family:var(--mono);font-size:12px}
svg text.lb{font-size:13px;font-weight:600}
svg .rg{fill:var(--ice);opacity:.08;transition:opacity .3s}
svg .rg.on{opacity:.55;fill:var(--ember)}
svg .rg.off{fill:var(--ice);opacity:.15}
svg text.rt{font-size:15px;font-weight:600}
svg .ed{stroke:var(--muted);stroke-width:2.2;fill:none}svg .ed.spe{stroke:var(--ember);stroke-width:5}
svg text.el{font-size:13px;font-weight:600;fill:var(--ice)}svg text.pay{font-size:14px;font-weight:600}
svg.tree{margin:0 auto}svg.tree text.lb{font-size:17px}svg.tree text.el{font-size:17px}svg.tree text.pay{font-size:18px}
svg.big text{font-size:24px}svg.big text.lb{font-size:27px}svg.big .ln{stroke-width:5}svg.big .ax{stroke-width:3}svg.big .gd{stroke-width:2}
svg .ndl{fill:var(--ember);stroke:none}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.opts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--ember);transform:translateX(3px)}
.opt .L{font-family:var(--mono);font-weight:600;width:26px;height:26px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;border:1px solid var(--line)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 14%,var(--panel2))}
.opt.good{border-color:var(--pine);background:color-mix(in srgb,var(--pine) 22%,var(--panel2))}
.opt.good .L{background:var(--pine);color:#fff;border-color:var(--pine)}
.opt.bad{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 20%,var(--panel2))}
.opt.bad .L{background:var(--berry);color:#fff;border-color:var(--berry)}
.opt.gone{opacity:.35;text-decoration:line-through}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.fb h4{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:20px}
.fb.good h4{color:var(--pine)}.fb.bad h4{color:var(--berry)}
.fb .pts{font-family:var(--mono);font-size:13px;color:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.spc{flex:1}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:6px}
.navgrid button{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:13px;position:relative}
.navgrid button.ans{background:color-mix(in srgb,var(--ice) 28%,var(--panel));border-color:var(--ice)}
.navgrid button.cur{outline:2px solid var(--ember)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--ember)}
.navgrid button.g{background:color-mix(in srgb,var(--pine) 40%,var(--panel));border-color:var(--pine)}
.navgrid button.b{background:color-mix(in srgb,var(--berry) 38%,var(--panel));border-color:var(--berry)}
/* matrices */
.pmw{overflow-x:auto}
table.pm{border-collapse:separate;border-spacing:0;margin:6px 0;font-family:var(--mono)}
table.pm th{font-weight:500;color:var(--muted);padding:4px 10px;font-size:13px}
table.pm td{border:1.5px solid var(--line);padding:10px 14px;text-align:center;min-width:76px;font-size:15px;background:var(--panel2)}
table.pm td i{font-style:normal;padding:2px 6px;border-radius:50%;display:inline-block;min-width:26px}
table.pm td i.b{margin-left:2px}
table.pm td.ne{background:color-mix(in srgb,var(--pine) 25%,var(--panel2))}
table.pm td i.br1{box-shadow:0 0 0 2px var(--berry)}
table.pm td i.br2{box-shadow:0 0 0 2px var(--ice);border-radius:6px}
.pm-cap{font-size:12px;color:var(--muted)}
.pm-p1{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--muted);font-size:13px;padding:0 6px!important}
/* results */
.score{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--disp);font-size:clamp(48px,10vw,84px);line-height:1}
.bars{display:grid;gap:10px;margin:14px 0}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ice)}
details.rv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-top:8px}
details.rv summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .in{padding:4px 14px 14px;border-top:1px solid var(--line)}
/* library */
.lib{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.card ol,.card ul{margin:0;padding-left:20px;font-size:15px}
.card li{margin:4px 0}
.fx{font-family:var(--mono);font-size:14px;background:var(--panel2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--wood);color:var(--wood-ink);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:50;font-weight:600}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
.float{position:absolute;right:20px;top:14px;font-family:var(--mono);font-weight:600;color:var(--gold);animation:fl 1.1s ease forwards;pointer-events:none}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@media (max-width:560px){
  .qcard{padding:16px}.bar{grid-template-columns:84px 1fr 50px}
  .hero{padding:24px 16px 130px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <button class="brand" id="home" aria-label="Back to the lobby"><span class="sign">Chalet 351</span></button>
    <span class="spacer"></span>
    <span class="chip" title="Points earned. One point is one meter climbed."><span aria-hidden="true">▲</span><b id="pts">0</b> m · <span id="rank">Snow Bunny</span></span>
    <span class="chip" title="Current streak of correct answers"><span aria-hidden="true">🔥</span><b id="stk">0</b></span>
    <button class="nbtn" id="libbtn">Method cards</button>
    <button class="nbtn" id="theme" aria-label="Switch between night and day">Day / Night</button>
  </div>
  <main id="app"></main>
</div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const fmt=n=>n.toLocaleString('en-US');
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function shuf(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET='ABCDE';
/* ---------- persistence ---------- */
const KEY='chalet351_m4_v1';
let S={pts:0,best:0,stats:{},mock:[],theme:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let streak=0;
const RANKS=[[0,'Snow Bunny'],[250,'Piste Regular'],[700,'Off-Piste'],[1400,'Alpine Guide'],[2400,'Summit Master']];
function rankOf(p){let r=RANKS[0][1];for(const[t,n]of RANKS)if(p>=t)r=n;return r}
function stat(id){return S.stats[id]||(S.stats[id]={n:0,c:0,s:0})}
function hud(){$('#pts').textContent=fmt(S.pts);$('#rank').textContent=rankOf(S.pts);$('#stk').textContent=streak}

/* ---------- figures ---------- */
function plot(o){
  const W=o.w||440,H=o.h||300,L=46,R=16,T=14,B=34,pw=W-L-R,ph=H-T-B;
  const X=x=>L+x/o.xmax*pw,Y=y=>T+ph-y/o.ymax*ph;
  let s=`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||'Graph'}">`;
  s+=`<path class="ax" d="M${L} ${T-4}V${T+ph}H${W-R+4}"/>`;
  (o.guides||[]).forEach(g=>{s+=`<path class="gd" d="M${X(g[0])} ${Y(g[1])}L${X(g[2])} ${Y(g[3])}"/>`});
  (o.lines||[]).forEach(l=>{
    s+=`<path class="ln ${l.c}" d="${l.p.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}"/>`;
    if(l.lab){const q=l.at;s+=`<text class="lb" x="${X(q[0])+(l.dx||6)}" y="${Y(q[1])+(l.dy||-4)}">${l.lab}</text>`}
  });
  (o.xt||[]).forEach(v=>{s+=`<text x="${X(v)}" y="${T+ph+17}" text-anchor="middle">${v}</text>`});
  (o.yt||[]).forEach(v=>{s+=`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
  s+=`<text class="lb" x="${L-6}" y="${T-2}" text-anchor="end">${o.yl||'P'}</text><text class="lb" x="${W-R}" y="${T+ph+30}" text-anchor="end">${o.xl||'Q'}</text>`;
  return s+'</svg>';
}

function mx(rows,cols,cells,o={}){return {t:'mx',rows,cols,cells:cells.map(r=>r.map(c=>c.split(',').map(Number))),p1:o.p1||'Player 1',p2:o.p2||'Player 2'}}
function renderMx(f){
  let h=`<div class="pmw"><table class="pm"><tr><th></th><th></th><th colspan="${f.cols.length}">${f.p2}</th></tr><tr><th></th><th></th>${f.cols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  f.rows.forEach((r,i)=>{
    h+=`<tr>${i===0?`<td class="pm-p1" rowspan="${f.rows.length}" style="border:0;background:none">${f.p1}</td>`:''}<th>${r}</th>`+f.cells[i].map((c,j)=>`<td data-r="${i}" data-c="${j}"><i class="a">${c[0]}</i> , <i class="b">${c[1]}</i></td>`).join('')+'</tr>';
  });
  return h+`</table>${f.cap===false?'':'<div class="pm-cap">After you answer, red rings mark Player 1\'s best responses and blue boxes mark Player 2\'s. A cell with both is a pure-strategy Nash equilibrium.</div>'}</div>`;
}
function revealMx(root,f){
  const t=root.querySelector('table.pm');if(!t)return;
  const R=f.rows.length,C=f.cols.length;
  for(let j=0;j<C;j++){let m=-1e9;for(let i=0;i<R;i++)m=Math.max(m,f.cells[i][j][0]);for(let i=0;i<R;i++)if(f.cells[i][j][0]===m)t.querySelector(`td[data-r="${i}"][data-c="${j}"] i.a`).classList.add('br1')}
  for(let i=0;i<R;i++){let m=-1e9;for(let j=0;j<C;j++)m=Math.max(m,f.cells[i][j][1]);for(let j=0;j<C;j++)if(f.cells[i][j][1]===m)t.querySelector(`td[data-r="${i}"][data-c="${j}"] i.b`).classList.add('br2')}
  t.querySelectorAll('td[data-r]').forEach(td=>{if(td.querySelector('.br1')&&td.querySelector('.br2'))td.classList.add('ne')});

/* game trees: N(player, [[edgeLabel, child], ...]); lf(p1payoff, p2payoff) is a leaf */
const lf=(a,b)=>({pay:[a,b]});
const N=(p,kids)=>({p,kids});
const n2=(...ls)=>N(2,['L₂','C₂','R₂'].slice(0,ls.length).map((l,i)=>[l,lf(...ls[i])]));
function tree(root,o={}){return {t:'tree',root,...o}}
function layoutTree(root){
  let leaves=0,maxd=0;
  (function walk(n,d,id){n.d=d;n.id=id;maxd=Math.max(maxd,d);
    if(n.pay){n.xi=leaves++;return}
    n.kids.forEach((k,i)=>walk(k[1],d+1,id+'.'+i));
    n.xi=n.kids.reduce((s,k)=>s+k[1].xi,0)/n.kids.length;})(root,0,'r');
  return {leaves,maxd};
}
function solveTree(n){
  if(n.pay)return n.pay;
  const vals=n.kids.map(k=>solveTree(k[1])),ix=n.p===1?0:1;
  let b=0;vals.forEach((v,i)=>{if(v[ix]>vals[b][ix])b=i});n.pick=b;return vals[b];
}
function renderTree(f){
  const root=f.root,{leaves,maxd}=layoutTree(root),sx=118,sy=104,W=Math.max(340,leaves*sx+40),H=maxd*sy+86;
  const X=n=>30+sx/2+n.xi*sx-(leaves>0?0:0),Y=n=>34+n.d*sy;
  let ed='',nd='';
  (function walk(n){
    if(n.pay){nd+=`<text x="${X(n)}" y="${Y(n)+22}" text-anchor="middle" class="pay">(${n.pay[0]}, ${n.pay[1]})</text>`;return}
    nd+=`<text x="${X(n)}" y="${Y(n)-10}" text-anchor="middle" class="lb">Player ${n.p}</text><circle cx="${X(n)}" cy="${Y(n)}" r="4.5" class="ndl"/>`;
    n.kids.forEach((k,i)=>{const c=k[1],mx_=(X(n)+X(c))/2,my=(Y(n)+Y(c))/2;
      ed+=`<path class="ed" data-e="${n.id}:${i}" d="M${X(n)} ${Y(n)}L${X(c)} ${Y(c)}"/><text x="${mx_+(X(c)<X(n)?-14:X(c)>X(n)?14:12)}" y="${my-2}" text-anchor="middle" class="el">${k[0]}</text>`;
      walk(c);});
  })(root);
  return `<div class="fig"><svg class="plot tree" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W,940)}px" role="img" aria-label="Game tree">${ed}${nd}</svg><div class="note">The first number in each parenthesis is Player 1's payoff, the second is Player 2's. After you answer, the orange branches show each player's best choice, found by backward induction.</div></div>`;
}
function revealTree(root,f){
  solveTree(f.root);
  (function walk(n){if(n.pay)return;const e=root.querySelector(`[data-e="${n.id}:${n.pick}"]`);if(e)e.classList.add('spe');n.kids.forEach(k=>walk(k[1]))})(f.root);
}

Z('hw11-8',11,2,`The following payoff matrix represents a Battle of the Sexes game. Now suppose it is a sequential game: Player 1 plays first, and then Player 2 plays second, after observing the choice of Player 1. This game has how many subgame perfect equilibria?`,'One',['Two','Three','None','Infinitely many'],`If P1 plays U, P2 picks L (2 &gt; 1). If P1 plays D, P2 picks R (3 &gt; 0). P1 compares 3 (via U,L) and 2 (via D,R) and plays U. A <b>single SPE</b> with payoffs (3,2). The first mover gets her favorite outcome.`,
 {fig:mx(['U','D'],['L','R'],[['3,2','1,1'],['0,0','2,3']],{cap:false})});
Z('hw11-10a',11,2,`Consider the following game between Player 1 (choosing row) and Player 2 (choosing the column). If this game is a simultaneous move game, then, in the pure strategy Nash equilibrium, Player 1 receives a payoff`,'4',['3','9','10','8'],`Best responses: P1: L→D (4), C→U (0), R→D (10). P2: U→R (1), M→R (4), D→L (5). The only mutual best response is <b>(D, L)</b> with payoffs (4,5).`,
 {fig:mx(['U','M','D'],['L','C','R'],[['3,-3','0,0','9,1'],['1,1','-3,3','8,4'],['4,5','-5,-7','10,3']])});
Z('hw11-10b',11,2,`Now suppose the previous game (U: 3,−3 / 0,0 / 9,1; M: 1,1 / −3,3 / 8,4; D: 4,5 / −5,−7 / 10,3) is a sequential game, where Player 1 plays first and Player 2 plays after observing the choice of Player 1. In the SPE, the payoff of Player 1 will be`,'9',['4','8','10','3'],`P2 reacts: after U → R, after M → R, after D → L. P1 compares (U,R) = 9, (M,R) = 8, (D,L) = 4 and plays U: <b>9</b>, much better than the simultaneous 4. The first mover gains.`,
 {fig:mx(['U','M','D'],['L','C','R'],[['3,-3','0,0','9,1'],['1,1','-3,3','8,4'],['4,5','-5,-7','10,3']])});
E('b11-1',11,2,`Bargaining. Player 1 makes a take it or leave it offer: she can propose 1C, which gives (6,2) if Player 2 accepts, or E, which gives (4,4) if Player 2 accepts. If Player 2 rejects, both get (0,0). In the subgame perfect equilibrium, the payoffs are`,['(6,2)','(4,4)','(0,0)','(6,2) or (4,4), depending on Player 2','Player 1 plays a mixed strategy'],'A',
 `Player 2 accepts anything that gives her more than 0, so she accepts both offers. Player 1 therefore proposes the one she likes best, 1C, and gets <b>(6,2)</b>. The proposer with the take it or leave it offer takes almost everything.`,
 {fig:tree(N(1,[['1C',N(2,[['A',lf(6,2)],['R',lf(0,0)]])],['E',N(2,[['A',lf(4,4)],['R',lf(0,0)]])]]))});
E('b11-2',11,3,`Bargaining with a counteroffer. Player 1 proposes 1C (6,2) or E (4,4). If Player 2 rejects, she can make a counteroffer (E gives (2,2); 2C gives (1,3)) that Player 1 then accepts or rejects. The payoffs are cut in half in the second round. In the subgame perfect equilibrium, what offer does Player 1 make, and what are the payoffs?`,['She proposes 1C and the payoffs are (6,2)','She proposes E and the payoffs are (4,4)','She proposes 1C and the payoffs are (1,3)','She proposes E and the payoffs are (1,3)','She proposes E and the payoffs are (2,2)'],'B',
 `Backward induction. In the second round Player 1 accepts anything (anything beats 0), so Player 2 counteroffers 2C and gets 3 (not 2). After 1C, Player 2 compares accepting (2) with rejecting (3), so she rejects, and Player 1 ends with (1,3). After E, Player 2 compares accepting (4) with rejecting (3), so she accepts: (4,4). Player 1 prefers E (4 &gt; 1). <b>E, payoffs (4,4)</b>.`,
 {fig:tree(N(1,[['1C',N(2,[['A',lf(6,2)],['R',N(2,[['E',N(1,[['A',lf(2,2)],['R',lf(0,0)]])],['2C',N(1,[['A',lf(1,3)],['R',lf(0,0)]])]])]])],['E',N(2,[['A',lf(4,4)],['R',N(2,[['E',N(1,[['A',lf(2,2)],['R',lf(0,0)]])],['2C',N(1,[['A',lf(1,3)],['R',lf(0,0)]])]])]])]]))});
Z('p11-1',11,3,`Ten ferocious old pirates are dividing their plunder (100 gold coins). No single coin can be subdivided. Pirate 1 proposes a sharing rule. All ten pirates vote. If a majority (even a tie is enough) accepts, the division is carried out. Otherwise the first pirate is thrown overboard (worse than getting no gold) and P2 makes a proposal, and so on. Pirates perform backward induction, and whenever a pirate is indifferent about voting for or against a proposal he votes against. What does Pirate 1 propose in equilibrium?`,'P1 keeps 96, and P3, P5, P7 and P9 get 1 coin each',['P1 keeps 100','P1 keeps 91 and every other pirate gets 1','P1 keeps 96, and P2, P4, P6 and P8 get 1 coin each','P1 keeps 55 and P2 through P10 split the rest evenly'],`Work backward. With 2 pirates left, P9 keeps 100 (a tie passes). With 3 left, P8 needs one more vote: P10 gets 1. And so on, each proposer buys just enough votes from the pirates who would get 0 in the next round. With 10 pirates P1 needs 5 votes and buys P3, P5, P7, P9 with 1 coin each: <b>(96, 0, 1, 0, 1, 0, 1, 0, 1, 0)</b>.`);
Z('o11-1',11,1,`Backward induction is a method to solve a sequential game that consists of`,'starting at the last decision nodes and working back to the first, choosing the best action for the player who moves at each node',['starting at the first decision node and choosing the action with the highest payoff for Player 1','finding the strategy that is optimal against every strategy of the opponent in a payoff matrix','averaging the payoffs of all terminal nodes','randomizing the moves of each player so that nobody can be exploited'],`Start at the end of the tree, replace each last node with the mover's best choice, and repeat back to the root.`);
Z('o11-2',11,2,`In a sequential game, a Nash equilibrium that is <i>not</i> a subgame perfect equilibrium typically relies on`,'a threat that is not credible',['a dominant strategy','a mixed strategy','a payoff that is negative for both players','an action taken by the first mover'],`A subgame perfect equilibrium requires optimal play in every subgame. A Nash equilibrium that rests on a non-credible threat fails that test because the player would not carry out the threat if the node were reached.`);
Z('o11-3',11,2,`Entry game: an Entrant chooses Out (payoffs (0,10)) or In. If In, the Incumbent chooses Fight (−3,2) or Accommodate (4,5). The first number is the Entrant's payoff. In the SPE, the Entrant's payoff is`,'4',['0','−3','5','10'],`After In, the Incumbent compares Fight (2) with Accommodate (5) and accommodates. The Entrant compares Out (0) with In (4) and enters. SPE payoffs (4,5). The threat to fight is not credible.`,
 {fig:tree(N(1,[['Out',lf(0,10)],['In',N(2,[['Fight',lf(-3,2)],['Accommodate',lf(4,5)]])]]))});
Z('o11-4',11,2,`Stackelberg competition: compared with the Cournot equilibrium, the Stackelberg leader produces ______ and the follower produces ______.`,'more ; less',['less ; more','more ; more','less ; less','the same ; the same'],`By moving first and committing to a large quantity, the leader pushes the follower's best response down. Leader: more than Cournot. Follower: less. There is a first-mover advantage.`);
Z('o11-5',11,3,`Firm 1 (leader) and Firm 2 (follower) are Stackelberg competitors with C<sub>1</sub> = 10Q<sub>1</sub> and C<sub>2</sub> = 10Q<sub>2</sub>. The market demand is Q<sup>D</sup> = 100 − P. In the SPE, the price is`,'P = 32.5',['P = 40','P = 55','P = 30','P = 37.5'],`Follower: MR<sub>2</sub> = 100 − Q<sub>1</sub> − 2Q<sub>2</sub> = 10, so Q<sub>2</sub> = 45 − 0.5Q<sub>1</sub>. Leader: P = 55 − 0.5Q<sub>1</sub>, MR<sub>1</sub> = 55 − Q<sub>1</sub> = 10, so Q<sub>1</sub> = 45, Q<sub>2</sub> = 22.5. P = 100 − 67.5 = <b>32.5</b>. (Cournot would give 40.)`);
Z('o11-6',11,3,`A stage game is a Prisoner's Dilemma with payoffs: both Cooperate = 20 each; one deviates = 30 for the deviator and 0 for the other; both Not Cooperate = 10 each. The game is repeated infinitely, and players use the grim-trigger strategy. Cooperation is possible if the interest rate is`,'r ≤ 100%',['r ≤ 50%','r ≤ 25%','r ≥ 100%','r ≤ 200%'],`Cooperate: 20 + 20/r. Deviate: 30 + 10/r. Cooperate if 10/r ≥ 10, so <b>r ≤ 1 = 100%</b>.`);
Z('o11-7',11,1,`A game is played exactly 10 times with a Prisoner's Dilemma stage game. The only subgame perfect equilibrium is`,'both players choose Not Cooperate in every period',['both players Cooperate in the first 9 periods','both players alternate between Cooperate and Not Cooperate','both players Cooperate in every period if r is small','a mixed strategy in each period'],`In the last period Not Cooperate is dominant. Knowing that, there is no future to protect in period 9, so it unravels all the way back to period 1.`);

/* ===== CHAPTER 12: ASYMMETRIC INFORMATION ===== */
E('c12-1',12,2,`How many of the following options are best described as examples of adverse selection?<br>I - Lemons problem in the market for used cars<br>II - Risk Averse individuals in the market for extra health care coverage<br>III - Risk Averse drivers purchasing extra auto insurance<br>IV - The fact that managers cannot directly observe the actions of workers`,['All four options','Zero options','One option only','Two options only','Three options only'],'C',
 `Only I is adverse selection (hidden type before the deal). II and III are just risk-averse consumers' preferences. IV is moral hazard (hidden action after the deal).`);
E('c12-2',12,1,`Consider the following two examples:<br>I - Unhealthy people are more likely to want health insurance;<br>II - A consumer with complete medical insurance may visit the doctor more often than he would if his coverage were limited.`,['Both are examples of Adverse Selection','Both are examples of Moral Hazard','Example I is Moral Hazard; Example II is Adverse Selection','Example I is Adverse Selection; Example II is Moral Hazard.','Both are examples of the Lemons Problem'],'D',
 `I: hidden <i>type</i> drives who buys: <b>adverse selection</b>. II: insurance changes behavior after buying: <b>moral hazard</b>.`);
E('c12-3',12,2,`Suppose California's government decides to outlaw the sharing of individuals' credit histories as an illegal invasion of privacy. As a result of this action we would expect the<br>I - cost of borrowing money to decrease<br>II - number of loans to unworthy credit risks to increase<br>III - problems of asymmetric information to become more severe`,['I, II and III are true.','I, II and III are false.','I is true, II and III are false.','II and III are true, I is false.','III is true, I and II are false.'],'D',
 `Lenders lose information about borrowers, so more bad risks get loans (II) and information problems worsen (III). Lenders protect themselves with higher rates, so the cost of borrowing rises, not falls (I false).`);
E('c12-4',12,1,`When firms participate in group health insurance for all employees, it might reduce health insurance premiums because it reduces the ______ problem`,['free rider','moral hazard','principal-agent','adverse selection','winner\'s curse'],'D',
 `A group plan covers everyone, healthy and unhealthy, so the insurer is not left with only the sickest customers: it reduces <b>adverse selection</b>.`);
E('c12-5',12,3,`For workers in Group A (high skill workers) the cost of attaining an educational level y is C<sub>A</sub>(y) = $10y; for workers in Group B (low skill workers) the cost of attaining an educational level y is C<sub>B</sub>(y) = $20y. Employees will be offered $40 if they have y ≥ y*, where y* is an educational threshold determined by the employer. They will be offered $20 if they have y &lt; y*. In equilibrium, education can be used as a signal of the worker's true type if`,['2 ≥ y* ≥ 1','4 ≥ y* ≥ 2','4 ≥ y* ≥ 1.33','2 ≥ y* ≥ 1.33','4 ≥ y* ≥ 1'],'A',
 `Group A must want to get educated: 40 − 10y* ≥ 20, so y* ≤ 2. Group B must not: 40 − 20y* ≤ 20, so y* ≥ 1. Therefore <b>1 ≤ y* ≤ 2</b>.`);
Z('c12-6',12,2,`For workers in Group A (high skill) the cost of education y is C<sub>A</sub>(y) = $10y; for Group B (low skill) it is C<sub>B</sub>(y) = $20y. Employees will be offered $40 if they have 5 or more years of education and $20 if they have less than 5 years. In this case, can education be used as a market signal of the worker's skill?`,'No: with y* = 5 neither group finds education worthwhile, so no one is educated',['Yes: Group A will be educated and Group B will not','Yes: both groups will be educated','No: Group B will be educated and Group A will not','Yes, because the wage gap is large'],`Group A: 40 − 50 = −10 &lt; 20, so A does not get educated either. Nobody does, so education carries no information.`);
E('c12-7',12,3,`For workers in Group A (high skill workers) the cost of attaining an educational level y is C<sub>A</sub>(y) = $10y; for workers in Group B (low skill workers) the cost is C<sub>B</sub>(y) = $15y. Employees will be offered $40 if they have y ≥ y*, and $20 if they have y &lt; y*. On top of this amount, firms also pay $5 for every year of education (y is the number of years of education). In equilibrium, education can be used as a signal of the worker's true type if`,['2 ≥ y* ≥ 1','4 ≥ y* ≥ 2','4 ≥ y* ≥ 1.33','2 ≥ y* ≥ 1.33','4 ≥ y* ≥ 1'],'B',
 `Group A: 40 + 5y* − 10y* ≥ 20, so y* ≤ 4. Group B: 40 + 5y* − 15y* ≤ 20, so y* ≥ 2. Therefore <b>2 ≤ y* ≤ 4</b>. The per-year payment lowers the net cost of education.`);
E('c12-8',12,3,`It takes y* years to graduate from college. For workers in Group A (high skill workers) the cost of going to college is $6 per year (Cost<sub>A</sub> = 6y*). For workers in Group B (low skill workers) the cost is $12 per year (Cost<sub>B</sub> = 12y*). In addition, each worker must pay a one time enrollment fee of $8, independent of skill and of y*. Employers observe whether or not workers graduated. Employees will be offered $70 if they graduate from college, and $20 if they don't have a college degree. In equilibrium, a college degree can be used as a signal of the worker's true type if`,['5 ≥ y* ≥ 2.5','7 ≥ y* ≥ 2.5','5 ≥ y* ≥ 3.5','7 ≥ y* ≥ 3.5','Because of the fixed cost, workers optimally choose not to go to college, independently of y*'],'D',
 `Group A: 70 − 6y* − 8 ≥ 20, so y* ≤ 7. Group B: 70 − 12y* − 8 ≤ 20, so y* ≥ 3.5. Therefore <b>3.5 ≤ y* ≤ 7</b>. The enrollment fee is the same for both groups, so it does not separate them but it does shrink the net benefit.`);
E('c12-9',12,3,`Firm 1 produces high-quality cars. Its marginal cost is $3,000. Firm 1 can also offer y years of warranty. The expected cost of the warranty for Firm 1 is $2,000 per year. Firm 2 produces low-quality cars. Its marginal cost is $2,000. Firm 2 can also offer y years of warranty. The expected cost of the warranty for Firm 2 is $3,000 per year. Consumers cannot observe the quality of the car. Consumers are willing to pay $8,000 for high-quality cars, and $5,000 for low-quality cars. Moreover, consumers are also willing to pay an additional $1,000 for each year of warranty offered. Consumers believe that only high-quality cars have y* years of warranty. Find the minimum and the maximum values of the threshold y* such that the consumers' beliefs will be consistent with the optimal behavior of the firms.`,['5 ≥ y* ≥ 2','3 ≥ y* ≥ 2','3 ≥ y* ≥ 1.5','2 ≥ y* ≥ 1.5','5 ≥ y* ≥ 3'],'C',
 `Firm 1 offers the warranty if 8,000 + 1,000y* − 3,000 − 2,000y* ≥ 5,000 − 3,000, so y* ≤ 3. Firm 2 does not offer it if 8,000 + 1,000y* − 2,000 − 3,000y* ≤ 5,000 − 2,000, so y* ≥ 1.5. Therefore <b>1.5 ≤ y* ≤ 3</b>.`);
E('c12-10',12,3,`Firm 1 produces high-quality cars. Its marginal cost is $3,000. Firm 1 can also offer y years of warranty. The expected cost of the warranty for Firm 1 is $1,000 per year. Firm 2 produces low-quality cars. Its marginal cost is $1,000. The expected cost of the warranty for Firm 2 is $3,500 per year. Consumers cannot observe the quality of the car. Consumers are willing to pay $6,000 for high-quality cars, and $3,000 for low-quality cars. Moreover, consumers are also willing to pay an additional $500 for each year of warranty offered. Consumers believe that only high-quality cars have y* years of warranty. Find the minimum and the maximum values of the threshold y* such that the consumers' belief will be consistent with the optimal behavior of the firms.`,['6 ≥ y* ≥ 2','4 ≥ y* ≥ 2','4 ≥ y* ≥ 1','6 ≥ y* ≥ 1','None of the above'],'D',
 `Firm 1 offers the warranty if 6,000 + 500y* − 3,000 − 1,000y* ≥ 3,000 − 3,000, so y* ≤ 6. Firm 2 does not offer it if 6,000 + 500y* − 1,000 − 3,500y* ≤ 3,000 − 1,000, so y* ≥ 1. Therefore <b>1 ≤ y* ≤ 6</b>.`);
E('c12-11',12,3,`In a particular labor market, each worker is born with an inherent skill level s, which is a number between 0 and 1. Each worker knows her own skill. Workers cannot choose their skill, but they can choose an education level e. Firms cannot directly observe skill, but they can observe the education level of workers and use it as a signal of their skill. Suppose that the income of each worker is 10e. For the worker, the cost of obtaining education level e is cost = (1 − s)e². Each worker chooses the education level e that maximizes her own utility, utility = 10e − (1 − s)e². Suppose that you observe a worker in this market with an education level e = 20. What can you infer about her inherent skill?`,['s = 1/3','s = 0.25','s = 0.5','s = 0.75','s = 2/3'],'D',
 `FOC: 10 − 2(1 − s)e = 0, so e = 5/(1 − s). Invert: s = 1 − 5/e. With e = 20, s = 1 − 0.25 = <b>0.75</b>. Higher skill chooses more education, which is why education signals skill.`);
E('c12-12',12,2,`A firm has a group of interns and needs to decide which interns to promote to managerial positions. All interns who pass the aptitude test are promoted and receive a wage of $193. Interns who do not pass the test are assigned to non-managerial positions and receive a wage of $178. If an intern chooses low effort, he fails the test but pays no effort cost. If an intern chooses high effort, he passes the test but pays a high effort cost. An intern of type A pays C<sub>A</sub> = $30, type B has C<sub>B</sub> = $20, and type C has C<sub>C</sub> = $10. Each intern chooses the effort that maximizes his utility (wage minus effort cost). What can the firm infer about the type of an intern who passes the test?`,['The intern must be type A.','The intern must be type C.','The intern must be type A or B.','The intern must be type B or C.','The firm cannot infer anything relevant because all interns will pass the test.'],'B',
 `Passing raises the wage by 193 − 178 = $15. Only an intern whose effort cost is below 15 passes. Only type C (cost 10) qualifies, so the intern must be <b>type C</b>.`);
E('c12-13',12,3,`Consumers have utility u(I) = √I and income $200. The cost of going to the doctor is $120, and the cost of going to the gym is $6. If the consumer goes to the gym, the probability of getting sick is 10%; if he does not go to the gym, the probability of getting sick is 90%. When sick, the consumer must go to the doctor. An insurance company is offering an insurance plan with an insurance premium of $12 and a co-pay of $15 (that is, the consumer must pay the $15 if he goes to the doctor). The consumer's expected utility from going to the gym and buying this insurance plan is approximately`,['12.9','13.2','12.7','12.5','13.4'],'E',
 `E[U] = 0.1√(200 − 6 − 12 − 15) + 0.9√(200 − 6 − 12) = 0.1√167 + 0.9√182 ≈ 1.29 + 12.14 = <b>13.4</b>. When sick he pays only the premium, gym and co-pay (the insurer covers the $120).`);
E('c12-14',12,3,`The $15 co-pay from the previous question (gym costs $6; going to the gym E[U] = 13.4; not going E[U] = 0.9√(200 − 12 − 15) + 0.1√(200 − 12) ≈ 13.2)`,['Fixes the adverse selection problem','Fixes the moral hazard problem','Should be lower otherwise the consumer will not buy it','Should be higher to fix the moral hazard problem','Should be higher to fix the adverse selection problem'],'B',
 `Moral hazard means that once insured, he may stop going to the gym. Not going to the gym gives 13.2, going gives 13.4. He still prefers the gym, so the co-pay <b>fixes the moral hazard problem</b>.`);
E('c12-15',12,3,`Consumers have utility u(I) = √I and income $200. The cost of going to the doctor is $120, and the cost of going to the gym is $20. If the consumer goes to the gym, the probability of getting sick is 10%; if he does not go to the gym, the probability of getting sick is 90%. When sick, the consumer must go to the doctor. An insurance company is offering an insurance plan with an insurance premium of $12 and a co-pay of $15. The consumer's expected utility from going to the gym and buying this insurance plan is approximately`,['12.9','13.2','12.7','12.5','12.3'],'A',
 `E[U] = 0.1√(200 − 20 − 12 − 15) + 0.9√(200 − 20 − 12) = 0.1√153 + 0.9√168 ≈ 1.24 + 11.66 = <b>12.9</b>.`);
E('c12-16',12,3,`The $15 co-pay from the previous question (gym costs $20; going to the gym E[U] ≈ 12.9; not going to the gym E[U] = 0.9√(200 − 12 − 15) + 0.1√(200 − 12) ≈ 13.2)`,['Fixes the adverse selection problem','Fixes the moral hazard problem','Should be lower otherwise the consumer will not buy it','Should be higher to fix the moral hazard problem','Should be higher to fix the adverse selection problem'],'D',
 `Not going to the gym (13.2) now beats going (12.9). The consumer stops going: the moral hazard problem is not solved, so the co-pay must be <b>higher</b>.`);
E('c12-17',12,3,`Elmo has a factory worth $40,000. The probability of a fire without a fire prevention program is 90%. With a fire prevention program it is 40%. If a fire occurs, the loss is $30,000. A fire prevention program costs $10 to run. Elmo's utility from wealth is u(I) = √I. The insurance company offers the following policy: it fully insures the factory for a premium P = $12,000, but if a fire occurs, Elmo must pay a $2,000 co-pay. If Elmo buys this insurance policy and implements the fire prevention program, his expected utility is ______. If Elmo buys this policy and does not implement the fire prevention program, his expected utility is ______.`,['171.9 ; 161.9','164.9 ; 171.9','164.9 ; 161.9','161.9 ; 164.9','161.9 ; 171.9'],'C',
 `With prevention: 0.4√(40,000 − 12,000 − 2,000 − 10) + 0.6√(40,000 − 12,000 − 10) ≈ <b>164.9</b>. Without: 0.9√(40,000 − 12,000 − 2,000) + 0.1√(40,000 − 12,000) ≈ <b>161.9</b>. Elmo prefers prevention, so the co-pay fixes moral hazard.`);
Z('o12-1',12,2,`Used cars: sellers value high-quality cars at $8,000 and low-quality cars at $3,000. Buyers value them at $10,000 and $4,000. Half of the cars are high quality, but buyers cannot tell which are which. Buyers pay the expected value of a random car. Which cars are sold in equilibrium?`,'Only low-quality cars (lemons)',['Only high-quality cars','Both types of cars','No cars at all','Each car sells at its true value'],`A random car is worth 0.5(10,000) + 0.5(4,000) = $7,000. Owners of high-quality cars want at least 8,000 and leave the market. Only lemons remain, so buyers pay about 4,000: the lemons problem (adverse selection).`);
Z('o12-2',12,1,`Adverse selection is a problem of ______ information that arises ______, while moral hazard is a problem of ______ information that arises ______.`,'hidden type ; before the contract ; hidden action ; after the contract',['hidden action ; before the contract ; hidden type ; after the contract','hidden type ; after the contract ; hidden action ; before the contract','hidden action ; after the contract ; hidden type ; before the contract','hidden price ; before the contract ; hidden type ; after the contract'],`Adverse selection: one side's type is unobserved when the deal is made (sick people buy insurance). Moral hazard: one side's action is unobserved after the deal (insured people take less care).`);
Z('o12-3',12,1,`A used-car dealer offers a long warranty on its cars. In the language of asymmetric information, the warranty is best described as`,'a signal of quality',['a screening device by the buyer','a source of moral hazard','a cause of adverse selection','an example of a free rider'],`Offering a warranty is cheap for a seller of good cars and costly for a seller of bad cars, so it credibly signals quality.`);
Z('o12-4',12,1,`In a labor market, education is a useful signal of ability if it is`,'cheaper for high-ability workers than for low-ability workers to obtain',['equally costly for all workers','cheaper for low-ability workers','free for everyone','required by law'],`The single-crossing property: high types find the signal cheaper, so only they find it worthwhile at the threshold. That is what lets employers separate the types.`);
Z('o12-5',12,2,`Group A (high skill) has education cost 8y and Group B (low skill) has cost 16y. Employers pay $50 to workers with y ≥ y* and $20 to workers with y &lt; y*. Education works as a signal if`,'1.875 ≤ y* ≤ 3.75',['1.25 ≤ y* ≤ 3.75','1.875 ≤ y* ≤ 6.25','3.75 ≤ y* ≤ 1.875','2.5 ≤ y* ≤ 5'],`The wage gain is 30. A: 30 ≥ 8y*, so y* ≤ 3.75. B: 30 ≤ 16y*, so y* ≥ 1.875. Both conditions: <b>1.875 ≤ y* ≤ 3.75</b>.`);
Z('o12-6',12,1,`A co-pay (or deductible) on an insurance policy is designed mainly to reduce`,'moral hazard',['adverse selection','the winner\'s curse','free riding','the lemons problem'],`Making the insured pay part of the cost keeps some incentive to take care or avoid unnecessary visits, which reduces moral hazard.`);
Z('o12-7',12,2,`A risk-averse consumer has utility u(I) = √I and income $100. With probability 0.5 she suffers a loss of $36. Her expected utility without insurance is`,'9',['8','10','9.5','8.5'],`E[U] = 0.5√100 + 0.5√64 = 0.5(10) + 0.5(8) = <b>9</b>. (Her expected loss is $18; full insurance at a $18 premium would give √82 ≈ 9.06 &gt; 9, so she buys it.)`);

Z('c13-1',13,2,`A firm produces output q and sells it for a price p = 20 per unit. The production function is q = 2h, where h is the number of hours worked. The worker's cost of effort is c = h². Benchmark: the firm's owner (principal) is also the only worker (agent), and chooses h to maximize utility = earnings − effort cost. How many hours will she work, and what will be her utility?`,'h = 20 ; utility = 400',['h = 10 ; utility = 100','h = 20 ; utility = 200','h = 40 ; utility = 400','h = 10 ; utility = 400'],`Utility = 20(2h) − h² = 40h − h². FOC: 40 − 2h = 0, so h = 20, and utility = 800 − 400 = <b>400</b>.`);
Z('c13-2',13,3,`Now the owner (principal) and the worker (agent) are different people. The owner chooses a per hour wage w, then the agent chooses hours h to maximize wh − h². The owner maximizes profit = pq − wh with p = 20 and q = 2h. In the SPE, the wage and hours are`,'w = 20 ; h = 10',['w = 20 ; h = 20','w = 10 ; h = 20','w = 40 ; h = 10','w = 10 ; h = 10'],`Worker: w − 2h = 0, so h = w/2. Owner: profit = 40h − wh = 20w − w²/2, FOC 20 − w = 0, <b>w = 20</b>, h = 10. Profit = 200, worker utility = 100.`);
Z('c13-2b',13,3,`In the previous question the worker's own-owner benchmark gave total surplus 400. With a separate principal and agent (w = 20, h = 10, profit 200, worker utility 100) the total surplus is 300. Why is the surplus lower?`,'The principal chooses an inefficient contract to capture a larger share of the surplus',['The worker has less skill when employed','Hours worked are unobservable','The price of the output falls','The principal makes a mistake in choosing the wage'],`The contract affects both the size of the surplus and how it is split. The principal optimally accepts a smaller total in order to keep more for herself.`);
E('c13-3',13,3,`Suppose that the principal can rent her capital to the worker. The owner chooses a rental price r and makes a take-it-or-leave-it offer to the worker. The worker chooses whether to rent the capital. If the worker rejects the offer, owner and worker attain a zero payoff. If the worker accepts, he pays r to the owner and he can choose how many hours to work. The worker keeps all revenue (p = 20, q = 2h, effort cost h²). In equilibrium, the principal offers the rental price ______. The agent pays this price and chooses to work ______.`,['r = 400 ; h = 10','r = 200 ; h = 40','r = 300 ; h = 10','r = 100 ; h = 40','r = 400 ; h = 20'],'E',

E('c13-4',13,2,`A risk-neutral worker can choose Low or High effort. The manager cannot observe the worker's action, but the manager can observe the realized revenue of the firm (either $300 or $500). If the worker chooses low effort, then the firm's revenue will be low ($300) for sure. The cost of low effort for the worker is zero. If the worker chooses high effort, then the firm's revenue will be high ($500) for sure. The cost of high effort for the worker is $10. The manager is currently offering the worker a payment w<sub>H</sub> if the revenue is high ($500), and w<sub>L</sub> if the revenue is low ($300). To guarantee incentive compatibility, to incentivize the worker to choose high effort, the wages must be such that:`,['w<sub>H</sub> ≥ 500','w<sub>H</sub> ≥ 10','w<sub>H</sub> − w<sub>L</sub> ≥ 10','w<sub>H</sub> − w<sub>L</sub> ≥ 50','w<sub>H</sub> − w<sub>L</sub> ≥ 20'],'C',
 `High effort must pay at least as much as low effort: w<sub>H</sub> − 10 ≥ w<sub>L</sub> − 0, so <b>w<sub>H</sub> − w<sub>L</sub> ≥ 10</b>. The wage gap has to cover the effort cost.`);
E('c13-5',13,3,`A risk-neutral worker can choose Low or High effort. The manager cannot observe the worker's action, but can observe the realized revenue (either $300 or $500). Low Effort: cost $0; probability of low revenue ($300) = 80%, high revenue ($500) = 20%. High Effort: cost $10; probability of low revenue = 60%, high revenue = 40%. The manager is offering w<sub>H</sub> if revenue is high and w<sub>L</sub> if it is low. To guarantee incentive compatibility, to incentivize the worker to choose high effort, the wages must be such that:`,['w<sub>H</sub> ≥ 500','w<sub>H</sub> ≥ 10','w<sub>H</sub> − w<sub>L</sub> ≥ 10','w<sub>H</sub> − w<sub>L</sub> ≥ 50','w<sub>H</sub> − w<sub>L</sub> ≥ 20'],'D',

Z('c13-6',13,2,`A risk-neutral worker can choose Low or High effort. If the worker chooses low effort, the firm's revenue is low ($300) for sure and the cost is zero. If the worker chooses high effort, revenue is high ($500) for sure and the cost is $10. Instead of a given wage, the manager offers the worker a payment equal to 20% of the revenue of the firm. Will the worker choose high effort or low effort? What is the expected profit of the firm?`,'High effort ; expected profit $400',['Low effort ; expected profit $240','High effort ; expected profit $500','Low effort ; expected profit $300','High effort ; expected profit $100'],`High effort: 0.2(500) − 10 = 90. Low effort: 0.2(300) = 60. He chooses high effort. The firm keeps 80% of 500 = <b>$400</b>.`);
Z('c13-7',13,3,`A risk-neutral worker can choose Low or High effort. Low Effort: cost $0; probability of low revenue ($300) = 80%, high revenue ($500) = 20%. High Effort: cost $10; probability of low revenue = 60%, high revenue = 40%. The manager offers the worker a payment equal to 20% of the revenue. Will the worker choose high effort or low effort? What is the expected profit of the firm?`,'Low effort ; expected profit $272',['High effort ; expected profit $304','Low effort ; expected profit $340','High effort ; expected profit $272','Low effort ; expected profit $68'],`High: 0.2(0.4(500) + 0.6(300)) − 10 = 0.2(380) − 10 = 66. Low: 0.2(0.2(500) + 0.8(300)) = 0.2(340) = 68. Low effort is better. Profit = 0.8(340) = <b>$272</b>.`);
E('c13-8',13,3,`A risk-neutral worker can choose Low or High effort. Low Effort: cost $0; probability of low revenue ($300) = 80%, high revenue ($500) = 20%. High Effort: cost $10; probability of low revenue = 60%, high revenue = 40%. Instead of offering a flat wage, the manager is trying a new payment scheme. The manager is currently offering to the worker a payment equal to x% of the revenue of the firm. Compute the minimum x such that the worker prefers to exert high effort.`,['x = 30%','x = 15%','x = 20%','x = 25%','x = 35%'],'D',
 `High: x(380) − 10. Low: x(340). High is preferred if 380x − 10 ≥ 340x, so 40x ≥ 10 and <b>x ≥ 25%</b>.`);
E('c13-9',13,3,`A risk-neutral worker can choose Low or High effort. Low Effort: cost $0; probability of low revenue ($300) = 80%, high revenue ($500) = 20%. High Effort: cost $12; probability of low revenue = 60%, high revenue = 40%. The manager offers the worker a payment equal to x% of the revenue of the firm. Compute the minimum x such that the worker prefers to exert high effort.`,['x = 30%','x = 15%','x = 20%','x = 25%','x = 35%'],'A',

Z('c13-10',13,3,`Same setup as above (Low effort: cost $0, expected revenue $340; High effort: cost $c, expected revenue $380). The manager offers the worker a payment equal to x% of the revenue. The minimum x such that the worker prefers high effort, as a function of the cost c, is`,'x = c/40',['x = c/20','x = 40/c','x = c/380','x = 40c'],`380x − c ≥ 340x, so 40x ≥ c and <b>x ≥ c/40</b>. The minimum share increases with the effort cost c.`);
E('c13-11',13,3,`A risk-neutral worker can choose Low or High effort. Low Effort: cost $0; probability of low revenue ($300) = 75%, high revenue ($500) = 25%. High Effort: cost $40; probability of low revenue = 25%, high revenue = 75%. The manager is currently offering the worker a payment equal to 30% of the revenue of the firm. Given this payment, the firm's expected profit will be`,['$205','$325','$315','$335','$245'],'E',

E('c13-12',13,3,`Ultimate Shoe Company (USC) is a new firm that produces handmade shoes. Let Q be the number of shoes produced. Each worker is able to produce shoes according to the production function Q = 2√e, where e represents the effort of the worker. The worker's personal cost of exerting effort is simply e/2. The worker receives from USC a payment b for each shoe produced. The worker's utility equals his income minus his effort cost. The worker chooses the effort that maximizes his utility. Find the worker's optimal effort choice.`,['e* = 4b²','e* = 2√b','e* = 2b','e* = 4√b','e* = b²'],'A',

E('c13-13',13,2,`Eye-Kya is a new furniture company. It hires workers to produce chairs. Let Q be the number of chairs produced. Each worker produces according to Q = 4e, where e represents the effort of the worker. The worker's personal cost of exerting effort is e²/4. The worker receives from Eye-Kya a payment b for each chair produced. The worker's utility equals his income minus his effort cost. If b = 1, then we have`,['e* = 16','e* = √2','e* = 4','e* = 2','e* = 8'],'E',

E('c13-14',13,3,`Consider the information from the previous question (Q = 4e, effort cost e²/4, payment b per chair, so e* = 8b), and suppose that Eye-Kya only has one worker. Eye-Kya has market power, facing inverse demand P = 520 − 2Q. Eye-Kya's profit equals its revenues minus the labor costs. Find the payment b that maximizes the firm's profit. The firm's profit is`,['Profit = 33,050','Profit = 33,160','Profit = 33,280','Profit = 33,230','Profit = 33,190'],'C',

E('c13-15',13,2,`Eye-Kya hires workers to produce chairs according to Q = 2e. The worker's personal cost of exerting effort is e²/2. The worker receives a payment b for each chair produced. The worker's utility equals his income minus his effort cost. Find the worker's optimal effort choice.`,['e* = 2b','e* = 2√b','e* = b','e* = √b','e* = b²'],'A',

E('c13-16',13,3,`Consider the information from the previous question (Q = 2e, e* = 2b), and suppose that Eye-Kya only has one worker. Eye-Kya pays the worker b for each chair produced. It also pays for materials: Material Cost = Q². Eye-Kya sells each chair at a price P = 20. Find the payment b that maximizes the firm's profit.`,['b* = 18','b* = 10','b* = 15','b* = 5','b* = 2'],'E',

E('c13-17',13,3,`Eye-Kya hires one worker to produce chairs. The worker chooses how many hours H to work. During each hour, the employee produces 6 chairs. The worker's personal cost of working is H²/3. The worker receives a payment b for each chair, and his utility equals his income minus his cost of working. Eye-Kya faces inverse demand P = 436 − 2Q. Find the payment b that maximizes the firm's profit. The firm's profit is`,['Profit = 23,542','Profit = 23,540','Profit = 23,541','Profit = 23,543','Profit = 23,544'],'E',

E('c13-18',13,3,`Uber produces output Q, where Q is the number of clients served. Each Uber driver chooses how many hours H to work. During each hour worked, a driver is able to serve 4 clients. The cost of driving H hours is 4H². Uber pays its driver a wage b for each client served. Uber faces inverse demand P = 170 − 2Q. In addition to wages, Uber's other expenses equal 6Q². Uber chooses the wage b that maximizes its profit. Find Uber's profit in the SPE of this game.`,['Profit = 900','Profit = 850','Profit = 800','Profit = 750','Profit = 700'],'B',

E('c13-19',13,3,`Zack sells cars. The number of cars he is able to sell depends on his own effort e: Q = 3e. Zack's employer promises to pay him a bonus b for each car sold. However, with probability 0.6 the company will survive and will pay the promised bonus, and with probability 0.4 the company will go bankrupt and will pay nothing. Zack is risk-neutral. His effort cost is 3e². What is the bonus b that induces Zack to choose an effort e* = 6?`,['b = 6','b = 5','b = 20','b = 10','b = 16'],'C',

E('c13-20',13,3,`The manager of a car dealership wants to sell cars. Each car is sold at the price P = $1,000. If the worker chooses effort level e, then with probability e she sells 3 cars, and with probability (1 − e) she sells only 1 car. The worker's effort cost is C = 1,000e². The manager pays the worker a bonus b for each car sold. The worker chooses the effort that maximizes her expected utility (expected income minus effort cost). The car dealer's only cost is the bonus it pays. The manager chooses the bonus that maximizes the firm's expected profit. In the SPE of this game, the manager will offer a bonus`,['b = 750','b = 500','b = 250','b = 900','b = 100'],'C',

E('c13-21',13,3,`A factory employs 50 workers who produce handcrafted toys. Each worker can produce 5 toys in one hour. Working hours are flexible. For each worker, the effort cost of working is 5h², where h is the number of hours worked. The factory pays each worker a bonus b for each toy produced. Each worker's utility equals income minus effort cost. The factory is able to sell each toy for a price P = 30. In addition to the bonus, the factory incurs a material cost equal to 0.002Q², where Q is the total quantity of toys produced by all workers. Find the bonus b that maximizes the factory's profit.`,['b = 12','b = 8','b = 10','b = 16','b = 5'],'A',

E('c13-22',13,3,`A risk-neutral firm produces chemical products, and its objective is to maximize expected profit. There is a risk of an accident that pollutes the water. To reduce the risk, the firm can choose Low or High investment in safety. Low Investment: cost $0; probability of an accident 80%. High Investment: cost $150; probability of an accident 20%. The Government cannot observe the firm's investment in safety (moral hazard), but it can observe whether an accident occurred. If an accident occurs, the firm must pay a fine F. Compute the minimum fine F that the Government must impose, in order to solve the moral hazard problem and guarantee that the firm will choose the high investment in safety.`,['F = 200','F = 250','F = 400','F = 300','F = 350'],'B',

E('c13-23',13,3,`A risk-neutral firm produces chemical products. To reduce the risk of an accident, the firm can choose the level of investment s in safety. If the firm invests s in safety, the probability of an accident is 1 − s, while the probability of no accident is s. The cost of investing s in safety is s². The firm has no direct cost or benefit from the accident. The Government cannot observe the firm's investment in safety, but it can observe whether an accident occurred. If an accident occurs, the firm must pay a fine F. Compute the fine F that the Government must impose, so that in the SPE the probability of an accident is 10%.`,['F = 1.0','F = 1.2','F = 2.5','F = 1.8','F = 2.2'],'D',

  const deck=QS.filter(q=>q.ramos).sort((a,b)=>a.ramos-b.ramos);
  app.innerHTML=`
  <section class="hero">
    <div class="kick">ECON 351 · Microeconomics for Business · Midterm 4</div>
    <h1>Your lodge for Midterm 4</h1>
    <p>${CHKEYS.length} chapters and ${QS.length} multiple-choice questions, written the way Professor Ramos writes them. The real exam is 24 multiple-choice questions mixing easy, medium and hard, so the mock exam does the same.</p>

    <button class="tile" id="mixed2"><h3>Mixed descent</h3><p>Every chapter shuffled together, as the exam will be. Open-ended; stop whenever.</p></button>
    <button class="tile" id="fire" ${missed?'':'disabled style="opacity:.55"'}><h3>Fireside review</h3><p>${missed?`${missed} question${missed>1?'s':''} you missed last time. Warm them up again.`:'Questions you miss land here. Nothing missed yet.'}</p></button>
    ${hasDeck?`<button class="tile fire" id="deck"><h3>Professor's review deck</h3><p>${deck.length} questions from the review deck, word for word.</p><div class="cold18">${deck.map(q=>`<span class="${(S.stats[q.id]||{}).s>=2?'on':''}">${q.ramos}</span>`).join('')}</div></button>`:''}
