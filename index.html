E('c12-11',12,3,`In a particular labor market, each worker is born with an inherent skill level s, which is a number between 0 and 1. Each worker knows her own skill. Workers cannot choose their skill, but they can choose an education level e. Firms cannot directly observe skill, but they can observe the education level of workers and use it as a signal of their skill. Suppose that the income of each worker is 10e. For the worker, the cost of obtaining education level e is cost = (1 − s)e². Each worker chooses the education level e that maximizes her own utility, utility = 10e − (1 − s)e². Suppose that you observe a worker in this market with an education level e = 20. What can you infer about her inherent skill?`,['s = 1/3','s = 0.25','s = 0.5','s = 0.75','s = 2/3'],'D',
 `FOC: 10 − 2(1 − s)e = 0, so e = 5/(1 − s). Invert: s = 1 − 5/e. With e = 20, s = 1 − 0.25 = <b>0.75</b>. Higher skill chooses more education, which is why education signals skill.`);
E('c12-12',12,2,`A firm has a group of interns and needs to decide which interns to promote to managerial positions. All interns who pass the aptitude test are promoted and receive a wage of $193. Interns who do not pass the test are assigned to non-managerial positions and receive a wage of $178. If an intern chooses low effort, he fails the test but pays no effort cost. If an intern chooses high effort, he passes the test but pays a high effort cost. An intern of type A pays C<sub>A</sub> = $30, type B has C<sub>B</sub> = $20, and type C has C<sub>C</sub> = $10. Each intern chooses the effort that maximizes his utility (wage minus effort cost). What can the firm infer about the type of an intern who passes the test?`,['The intern must be type A.','The intern must be type C.','The intern must be type A or B.','The intern must be type B or C.','The firm cannot infer anything relevant because all interns will pass the test.'],'B',
 `Passing raises the wage by 193 − 178 = $15. Only an intern whose effort cost is below 15 passes. Only type C (cost 10) qualifies, so the intern must be <b>type C</b>.`);
E('c12-13',12,3,`Consumers have utility u(I) = √I and income $200. The cost of going to the doctor is $120, and the cost of going to the gym is $6. If the consumer goes to the gym, the probability of getting sick is 10%; if he does not go to the gym, the probability of getting sick is 90%. When sick, the consumer must go to the doctor. An insurance company is offering an insurance plan with an insurance premium of $12 and a co-pay of $15 (that is, the consumer must pay the $15 if he goes to the doctor). The consumer's expected utility from going to the gym and buying this insurance plan is approximately`,['12.9','13.2','12.7','12.5','13.4'],'E',
 `E[U] = 0.1√(200 − 6 − 12 − 15) + 0.9√(200 − 6 − 12) = 0.1√167 + 0.9√182 ≈ 1.29 + 12.14 = <b>13.4</b>. When sick he pays only the premium, gym and co-pay (the insurer covers the $120).`);
E('c12-14',12,3,`The $15 co-pay from the previous question (gym costs $6; going to the gym E[U] = 13.4; not going E[U] = 0.9√(200 − 12 − 15) + 0.1√(200 − 12) ≈ 13.2)`,['Fixes the adverse selection problem','Fixes the moral hazard problem','Should be lower otherwise the consumer will not buy it','Should be higher to fix the moral hazard problem','Should be higher to fix the adverse selection problem'],'B',
 `Moral hazard means that once insured, he may stop going to the gym. Not going to the gym gives 13.2, going gives 13.4. He still prefers the gym, so the co-pay <b>fixes the moral hazard problem</b>.`);
E('c12-15',12,3,`Consumers have utility u(I) = √I and income $200. The cost of going to the doctor is $120, and the cost of going to the gym is $20. If the consumer goes to the gym, the probability of getting sick is 10%; if he does not go to the gym, the probability of getting sick is 90%. When sick, the consumer must go to the doctor. An insurance company is offering an insurance plan with an insurance premium of $12 and a co-pay of $15. The consumer's expected utility from going to the gym and buying this insurance plan is approximately`,['12.9','13.2','12.7','12.5','12.3'],'A',
 `E[U] = 0.1√(200 − 20 − 12 − 15) + 0.9√(200 − 20 − 12) = 0.1√153 + 0.9√168 ≈ 1.24 + 11.66 = <b>12.9</b>.`);
E('c12-16',12,3,`The $15 co-pay from the previous question (gym costs $20; going to the gym E[U] ≈ 12.9; not going to the gym E[U] = 0.9√(200 − 12 − 15) + 0.1√(200 − 12) ≈ 13.2)`,['Fixes the adverse selection problem','Fixes the moral hazard problem','Should be lower otherwise the consumer will not buy it','Should be higher to fix the moral hazard problem','Should be higher to fix the adverse selection problem'],'D',
 `Not going to the gym (13.2) now beats going (12.9). The consumer stops going: the moral hazard problem is not solved, so the co-pay must be <b>higher</b>.`);
E('c12-17',12,3,`Elmo has a factory worth $40,000. The probability of a fire without a fire prevention program is 90%. With a fire prevention program it is 40%. If a fire occurs, the loss is $30,000. A fire prevention program costs $10 to run. Elmo's utility from wealth is u(I) = √I. The insurance company offers the following policy: it fully insures the factory for a premium P = $12,000, but if a fire occurs, Elmo must pay a $2,000 co-pay. If Elmo buys this insurance policy and implements the fire prevention program, his expected utility is ______. If Elmo buys this policy and does not implement the fire prevention program, his expected utility is ______.`,['171.9 ; 161.9','164.9 ; 171.9','164.9 ; 161.9','161.9 ; 164.9','161.9 ; 171.9'],'C',
 `With prevention: 0.4√(40,000 − 12,000 − 2,000 − 10) + 0.6√(40,000 − 12,000 − 10) ≈ <b>164.9</b>. Without: 0.9√(40,000 − 12,000 − 2,000) + 0.1√(40,000 − 12,000) ≈ <b>161.9</b>. Elmo prefers prevention, so the co-pay fixes moral hazard.`);
Z('o12-1',12,2,`Used cars: sellers value high-quality cars at $8,000 and low-quality cars at $3,000. Buyers value them at $10,000 and $4,000. Half of the cars are high quality, but buyers cannot tell which are which. Buyers pay the expected value of a random car. Which cars are sold in equilibrium?`,'Only low-quality cars (lemons)',['Only high-quality cars','Both types of cars','No cars at all','Each car sells at its true value'],`A random car is worth 0.5(10,000) + 0.5(4,000) = $7,000. Owners of high-quality cars want at least 8,000 and leave the market. Only lemons remain, so buyers pay about 4,000: the lemons problem (adverse selection).`);
Z('o12-2',12,1,`Adverse selection is a problem of ______ information that arises ______, while moral hazard is a problem of ______ information that arises ______.`,'hidden type ; before the contract ; hidden action ; after the contract',['hidden action ; before the contract ; hidden type ; after the contract','hidden type ; after the contract ; hidden action ; before the contract','hidden action ; after the contract ; hidden type ; before the contract','hidden price ; before the contract ; hidden type ; after the contract'],`Adverse selection: one side's type is unobserved when the deal is made (sick people buy insurance). Moral hazard: one side's action is unobserved after the deal (insured people take less care).`);
Z('o12-3',12,1,`A used-car dealer offers a long warranty on its cars. In the language of asymmetric information, the warranty is best described as`,'a signal of quality',['a screening device by the buyer','a source of moral hazard','a cause of adverse selection','an example of a free rider'],`Offering a warranty is cheap for a seller of good cars and costly for a seller of bad cars, so it credibly signals quality.`);
Z('o12-4',12,1,`In a labor market, education is a useful signal of ability if it is`,'cheaper for high-ability workers than for low-ability workers to obtain',['equally costly for all workers','cheaper for low-ability workers','free for everyone','required by law'],`The single-crossing property: high types find the signal cheaper, so only they find it worthwhile at the threshold. That is what lets employers separate the types.`);
Z('o12-5',12,2,`Group A (high skill) has education cost 8y and Group B (low skill) has cost 16y. Employers pay $50 to workers with y ≥ y* and $20 to workers with y &lt; y*. Education works as a signal if`,'1.875 ≤ y* ≤ 3.75',['1.25 ≤ y* ≤ 3.75','1.875 ≤ y* ≤ 6.25','3.75 ≤ y* ≤ 1.875','2.5 ≤ y* ≤ 5'],`The wage gain is 30. A: 30 ≥ 8y*, so y* ≤ 3.75. B: 30 ≤ 16y*, so y* ≥ 1.875. Both conditions: <b>1.875 ≤ y* ≤ 3.75</b>.`);
Z('o12-6',12,1,`A co-pay (or deductible) on an insurance policy is designed mainly to reduce`,'moral hazard',['adverse selection','the winner\'s curse','free riding','the lemons problem'],`Making the insured pay part of the cost keeps some incentive to take care or avoid unnecessary visits, which reduces moral hazard.`);
Z('o12-7',12,2,`A risk-averse consumer has utility u(I) = √I and income $100. With probability 0.5 she suffers a loss of $36. Her expected utility without insurance is`,'9',['8','10','9.5','8.5'],`E[U] = 0.5√100 + 0.5√64 = 0.5(10) + 0.5(8) = <b>9</b>. (Her expected loss is $18; full insurance at a $18 premium would give √82 ≈ 9.06 &gt; 9, so she buys it.)`);
Z('o12-8',12,2,`In a separating equilibrium of a signaling game,`,'different types choose different signals, so the signal reveals the type',['all types choose the same signal','the informed party randomizes between signals','the uninformed party ignores the signal','no signal is ever sent'],`Separating: types choose different signals and the signal reveals the type. Pooling: all types send the same signal and nothing is revealed.`);

/* --- asymmetric information deck additions --- */
Z('s12-1',12,1,`Hidden information and hidden action differ in timing. In a hidden information problem the informed player knows something ______ the trade or contract; in a hidden action problem the informed player takes actions ______ the contract.`,'BEFORE ; AFTER',['AFTER ; BEFORE','BEFORE ; BEFORE','AFTER ; AFTER'],`Hidden information (adverse selection): the informed side knows its type <b>before</b> trading. Hidden action (moral hazard): it acts <b>after</b> the contract is signed.`);
Z('s12-2',12,2,`An internet provider prices its new unlimited data plan. Heavy-user households cost $50 to serve and are half of all households; light-user households cost $10 to serve and are the other half. The average cost is 0.5(50) + 0.5(10) = $30. If the provider charges $30, what happens?`,'Heavy users buy and many light users do not, so the provider\'s cost per customer is close to $50 and it loses money',['Both types buy and the provider earns zero profit','Only light users buy, so the provider earns a profit','Nobody buys, because $30 is too high','Both types buy and the provider earns a profit'],`Self-selection: $30 is a bargain for heavy users, so they buy, while many light users do not. The customer pool is mostly heavy users, so the true cost per customer is close to $50. This is <b>adverse selection</b>: the buyers most willing to buy are the most costly to serve.`);
E('s12-3',12,1,`What is adverse selection in the unlimited data plan example?`,['Buyers have private information, and the buyers most willing to buy are also the most costly to serve','The firm hides its costs from buyers','Buyers change their behavior after they buy','The firm charges different prices to different groups','Buyers lie about their income'],'A',`Buyers know their own type (private information) and the ones who value the plan most are also the ones who cost the most. The firm must charge one, higher price, so light users it could serve profitably are priced out: inefficient.`);
E('s12-4',12,2,`Used cars. Group 1 (good cars): sellers accept at least $13,000; buyers pay at most $15,000. Group 2 (good cars): sellers accept at least $9,000; buyers pay at most $15,000. Group 3 (lemons): sellers accept at least $4,000; buyers pay at most $6,000. One third of the sellers are in each group. If buyers can see quality, which trades happen?`,['Every car trades, and every trade creates surplus','Only the lemons trade','Only the good cars trade','Only Group 2 and Group 3 trade','No car trades'],'A',`With no asymmetric information each type trades at a price between what the seller accepts and the buyer pays: lemons between $4,000 and $6,000, good cars between $13,000 and $15,000. Efficient: <b>every car is traded</b>.`);
Z('s12-5',12,2,`Same used car market, but now buyers cannot see quality and only sellers know their car: ONE price for all used cars. If every car were for sale, the buyers' expected value of a car is`,'$12,000',['$15,000','$10,500','$9,000','$6,000'],`E(value) = 1/3 × 6,000 + 2/3 × 15,000 = <b>$12,000</b>. Buyers pay at most $12,000 for a car of unknown quality.`);
E('s12-6',12,2,`Buyers pay at most $12,000 for a car of unknown quality. Using the same used car data (Group 1 sellers accept at least $13,000; Group 2 at least $9,000; Group 3, the lemons, at least $4,000), which sellers put their cars up for sale?`,['All three groups','Groups 2 and 3','Group 3 only','No one','Groups 1 and 2'],'B',`Group 1 wants at least $13,000, which is more than $12,000, so they leave the market. Groups 2 and 3 are willing to sell at that price.`);
Z('s12-7',12,3,`After Group 1's good cars leave the used car market, half of the cars for sale are lemons and half are good (buyers value a lemon at $6,000 and a good car at $15,000). What is the buyers' expected value of a car for sale now?`,'$10,500',['$12,000','$9,000','$15,000','$8,000'],`E(value) = 1/2 × 6,000 + 1/2 × 15,000 = <b>$10,500</b>, down from $12,000. At a price of about $10,000, Groups 2 and 3 still sell (Group 2 needs only $9,000). Group 1's good cars are never traded although buyers value them at $15,000 &gt; $13,000: inefficient. "Bad cars drive out good cars" (Akerlof).`);
Z('s12-8',12,1,`Who moves first in signaling and in screening?`,'Signaling: the informed side. Screening: the uninformed side',['Signaling: the uninformed side. Screening: the informed side','The informed side in both','The uninformed side in both','Neither: they move simultaneously'],`<b>Signaling</b>: the informed side moves first with a costly action that reveals its type (a warranty, an education). <b>Screening</b>: the uninformed side moves first and designs an offer so that each type reveals itself (a high wage only for applicants with enough education).`);
Z('s12-9',12,2,`What is the key assumption that makes a signal work?`,'The signal is cheaper for the high type than for the low type',['The signal is free for everyone','The signal is more costly for the high type','The uninformed side can verify the type directly','The signal must be as long as possible'],`A warranty is cheaper for the high-quality firm because its cars break down less often. Education is cheaper for high-productivity workers because they need fewer hours of study. Different costs are what let the signal separate the types.`);
E('s12-10',12,3,`Firm 1 makes high-quality cars (cost $3,000; warranty costs $2,000 per year). Firm 2 makes low-quality cars (cost $2,000; warranty costs $3,000 per year). Buyers pay $8,000 for a high-quality car and $5,000 for a low-quality car, plus $1,000 for each year of warranty. Buyers believe that only high-quality cars come with a 2-year warranty. Who offers the 2-year warranty?`,['Both firms','Only Firm 1 (high quality)','Only Firm 2 (low quality)','Neither firm','It depends on the interest rate'],'B',`Firm 1: with the warranty 10,000 − 3,000 − 2 × 2,000 = 3,000; without 5,000 − 3,000 = 2,000. Offers it. Firm 2: with the warranty 10,000 − 2,000 − 2 × 3,000 = 2,000; without 5,000 − 2,000 = 3,000. Does not. <b>Only Firm 1</b>, so buyers' belief is correct.`);
Z('s12-11',12,3,`Same warranty market. Which statement about the warranty signal is correct?`,'Signals are costly: each warranty year costs the good firm $2,000 but buyers value it at only $1,000',['The signal works because it is free to the good firm','The signal works for any warranty length','The signal works because the low-quality firm finds it cheaper','The signal is not costly to either firm'],`Beliefs and actions are consistent, the signal is cheaper for the high type ($2,000 vs $3,000 per year), and it is neither too short nor too long (between 1.5 and 3 years). The signal is costly: $2,000 per year for the good firm versus $1,000 of value to buyers, which is why the low type will not copy it.`);
E('s12-12',12,3,`Screening in the job market. High productivity workers generate $100,000 for the firm and school costs them $5,000 per year; low productivity workers generate $70,000 and school costs them $10,000 per year. Half of the workers are of each type. Firms offer $100,000 with a 4-year college degree and $70,000 without. Who gets the 4-year degree?`,['Both types','Only high-productivity workers','Only low-productivity workers','Neither type','It depends on the share of each type'],'B',`High: with the degree 100,000 − 4 × 5,000 = 80,000 &gt; 70,000: gets it. Low: 100,000 − 4 × 10,000 = 60,000 &lt; 70,000: does not. <b>Only high types</b> get the degree, so the offer screens the two types.`);
E('s12-13',12,3,`Wages rise: high productivity workers now generate $160,000 and low productivity workers $110,000. School costs are still $5,000 and $10,000 per year. Firms keep the old offer: $160,000 with a 4-year degree, $110,000 without. Does the old offer still separate the two types?`,['Yes: only high-productivity workers get the degree','No: both types get the degree','No: neither type gets the degree','No: only low-productivity workers get the degree','Yes: the wage gap now makes the degree cheaper for everyone'],'B',`High: 160,000 − 4 × 5,000 = 140,000 &gt; 110,000. Low: 160,000 − 4 × 10,000 = 120,000 &gt; 110,000. <b>Both</b> get the degree, so it no longer tells the types apart.`);
Z('s12-14',12,3,`Same market ($160,000 with the education, $110,000 without). Firms now require 11 years of education. Does this separate the types?`,'No: nobody gets the education because it is too costly',['Yes: only high-productivity workers get it','No: both types get it','No: only low-productivity workers get it','Yes: both types get it, and that is efficient'],`High: 160,000 − 11 × 5,000 = 105,000 &lt; 110,000: no education. Low: 160,000 − 11 × 10,000 = 50,000 &lt; 110,000: no education. A requirement that is <b>too costly</b> does not separate the types either.`);
E('s12-15',12,3,`Firms now require prestigious degrees, which cost more: $10,000 per year for high-productivity workers and $20,000 per year for low-productivity workers. Firms pay $160,000 with y years of prestigious education and $110,000 without. For which values of y do the types separate?`,['1 &lt; y &lt; 2','2.5 &lt; y &lt; 5','2.5 &lt; y &lt; 11','5 &lt; y &lt; 10','y &gt; 5'],'B',`High should get it: 160,000 − 10,000y &gt; 110,000, so y &lt; 5. Low should not: 160,000 − 20,000y &lt; 110,000, so y &gt; 2.5. <b>Any requirement between 2.5 and 5 years</b> separates the types, so firms can ask for 3 or 4 years.`);
Z('s12-16',12,1,`Moral hazard is best described as`,'people taking riskier actions after they are insured because they no longer bear the full cost',['people with higher risk being more likely to buy insurance','a firm hiding the quality of its product','a buyer paying too much for a lemon','a signal that is too costly'],`After the contract, the informed player takes an action the other side cannot see or write into the contract. Example: once your phone screen is insured, why be careful with your phone?`);
Z('s12-17',12,1,`Which of the following reduces moral hazard in health insurance?`,'Deductibles and co-pays, so the insured bears part of the loss',['Full coverage with no co-pay','Charging every customer the same premium','Group insurance for all employees','Letting buyers observe the insurer\'s costs'],`Make the insured bear part of the loss (deductibles and co-pays). Without them the insurer must price the riskier behavior, so being careful <i>and</i> insured may become impossible.`);
Z('s12-18',12,2,`In the health insurance example, the insurer cannot see whether you exercise, eat well, or get check-ups. This is a problem of`,'hidden action (moral hazard)',['hidden information (adverse selection)','a signal that is too costly','screening','self-selection'],`The unobserved behavior happens after the contract is signed: a hidden action, i.e. moral hazard.`);

/* --- asymmetric information deck: gym / co-pay and insurance --- */
Z('gym-1',12,2,`A student has income $245 and utility u(I) = √I. If she goes to the gym (cost $20) the probability of getting sick is 10%; if not, 90%. If she gets sick she must see the doctor, which costs $120. Her expected utility WITH the gym is approximately`,'14.52',['11.63','15.26','12.25'],`0.10√(245 − 20 − 120) + 0.90√(245 − 20) = 0.10√105 + 0.90√225 ≈ 1.02 + 13.50 = <b>14.52</b>.`);
Z('gym-2',12,2,`The same student (income $245, u = √I, doctor $120). Her expected utility WITHOUT the gym (probability of sickness 90%, no gym cost) is approximately`,'11.63, so she goes to the gym',['14.52, so she skips the gym','11.63, so she skips the gym','15.26, so she goes to the gym'],`0.90√(245 − 120) + 0.10√245 = 0.90√125 + 0.10√245 ≈ 10.06 + 1.57 = <b>11.63</b>. Since 14.52 &gt; 11.63 she goes to the gym.`);
Z('gym-3',12,1,`In the same example, full insurance pays the $120 doctor bill when she is sick (probability 10% if she goes to the gym). The fair premium is`,'$12',['$108','$120','$20'],`Fair premium = expected loss = 0.10 × 120 = <b>$12</b>. She is risk averse, so she buys it.`);
Z('gym-4',12,3,`She buys full insurance for $12 (no co-pay). Insured, her income no longer depends on getting sick: with the gym she gets √(245 − 20 − 12) = √213 ≈ 14.59, without the gym √(245 − 12) = √233 ≈ 15.26. What happens?`,'She stops going to the gym, and the insurer\'s expected loss jumps to 0.90 × 120 = $108: moral hazard',['She keeps going to the gym because it still lowers her chance of getting sick','She stops going and the insurer\'s expected loss falls to $12','She cancels the insurance'],`The gym costs $20 and no longer protects her income, so she drops it. Her sickness probability becomes 90% and the insurer pays 0.90 × 120 = $108 per customer, far above the $12 premium. That is <b>moral hazard</b>.`);
Z('gym-5',12,3,`To fix the problem, the insurer adds a $30 co-pay: she pays $30 each time she sees the doctor. The insurer now pays only 120 − 30 = $90 when she is sick. The fair premium for a gym-goer is`,'0.10 × 90 = $9',['0.10 × 120 = $12','0.90 × 90 = $81','0.10 × 30 = $3'],`The insurer's expected payout for a gym-goer is 0.10 × 90 = <b>$9</b>. The co-pay lowers the premium and restores incentives.`);
Z('gym-6',12,3,`With the $9 premium and $30 co-pay, her expected utility with the gym is about 14.59 and without the gym about 14.45. Does the co-pay fix moral hazard, and does she still buy the insurance rather than going uninsured (expected utility 14.52 with the gym)?`,'Yes to both: 14.59 &gt; 14.45, so she goes to the gym, and 14.59 &gt; 14.52, so she buys the insurance',['Yes to the first only: she goes to the gym but does not buy the insurance','Yes to the second only: she buys the insurance but skips the gym','No to both'],`Gym with co-pay: 0.10√186 + 0.90√216 ≈ 14.59. No gym: 0.90√206 + 0.10√236 ≈ 14.45. So she goes to the gym. Uninsured with the gym: 14.52 &lt; 14.59, so she buys the insurance. The co-pay fixes moral hazard at the cost of some risk. (At the old $12 premium with the co-pay she would get 14.49 &lt; 14.52 and would not buy.)`);
Z('gym-7',12,3,`Consumers have u(I) = √I and income $200. Going to the doctor costs $120 and the gym costs $6. With the gym the probability of getting sick is 20%; without it, 90%. An insurance plan has a $12 premium and an $18 co-pay. The expected utilities are: gym + insurance ≈ 13.35, no gym + insurance ≈ 13.105, gym without insurance ≈ 12.86. What can we conclude?`,'The co-pay solves moral hazard and the consumer buys the insurance',['The co-pay does not solve moral hazard','The co-pay solves moral hazard but the consumer does not buy the insurance','The consumer buys the insurance but stops going to the gym'],`0.2√(200 − 6 − 12 − 18) + 0.8√(200 − 6 − 12) ≈ 13.35. No gym: 0.9√(200 − 12 − 18) + 0.1√(200 − 12) ≈ 13.105. Uninsured with the gym: 0.2√(200 − 6 − 120) + 0.8√(200 − 6) ≈ 12.86. Since 13.35 &gt; 13.105 (goes to the gym) and 13.35 &gt; 12.86 (buys), <b>both hold</b>.`);
Z('gym-8',12,3,`Same consumer (income $200, u = √I, doctor $120, gym $6, sickness probability 20% with the gym and 90% without, premium $12). Which is the smallest co-pay among the following that solves the moral hazard problem?`,'$10',['$0','$5','$8'],`With the gym: 0.2√(182 − z) + 0.8√182. Without: 0.9√(188 − z) + 0.1√188. At z = 0: 13.49 versus 13.71, so he skips the gym. At z = 5: 13.45 versus 13.55. At z = 8: 13.431 versus 13.446. At z = 10: 13.416 versus 13.379, so the gym wins. The threshold is about $8.6, so <b>$10</b> is the smallest listed.`);
Z('gym-9',12,2,`Which tool does the lecture list for mitigating moral hazard in insurance?`,'Deductibles and co-pays, noisy signals such as higher premiums after speeding tickets, and discounts for non-smokers',['Letting insurers observe customer types before the contract','Raising the premium for everyone equally','Offering full coverage with no deductible'],`The insured pays part of each loss; insurers use noisy signals (tickets, driving apps); health plans give discounts for non-smokers and for going to the gym. <b>Each tool trades some insurance for better incentives</b>.`);
Z('gym-10',12,2,`Insuring against a risk makes a risk-averse consumer happier. Why would an insurer therefore prefer a co-pay of some size instead of full coverage for the gym example?`,'Full coverage makes her stop going to the gym, which raises the insurer\'s expected costs',['Full coverage is illegal','A co-pay always raises the consumer\'s utility','A co-pay removes all risk from the consumer'],`With full coverage her gym effort is a pure cost, so she stops (moral hazard) and the insurer pays much more. A co-pay keeps her incentive to stay healthy but leaves her with some risk.`);

/* ===== MIDTERM 4 REVIEW DECK, Chapter 12 (Prof. Ramos, exact wording) ===== */
E('m4-9',12,1,`Consider the following scenarios:<br>I - Unhealthy people are more likely to want health insurance.<br>II - Risk averse individuals are more likely to want health insurance.<br>III - Unskilled drivers purchasing extra auto insurance.<br><br>Which scenarios are best described as adverse selection problems?`,['I, II and III','I and III','I and II','II and III','I, II and III are moral hazard problems'],'B',
 `Adverse selection is a hidden <i>type</i> that drives who buys. I (unhealthy people self-select into insurance) and III (unskilled drivers buy extra cover) fit. II is just a preference: risk aversion is not hidden information that makes the insured costlier. So <b>I and III</b>.`,{ramos:9});
E('m4-10',12,1,`Consider the following two examples:<br>I - Unhealthy people are more likely to want health insurance;<br>II - A consumer with complete medical insurance may visit the doctor more often than he would if his coverage were limited.`,['Both are examples of Adverse Selection','Both are examples of Moral Hazard','Example I is Moral Hazard; Example II is Adverse Selection','Example I is Adverse Selection; Example II is Moral Hazard.','Both are examples of the Lemons Problem'],'D',
 `I: hidden type before the contract, <b>adverse selection</b>. II: behavior changes after the contract because the insured no longer bears the full cost, <b>moral hazard</b>.`,{ramos:10});
E('m4-11',12,3,`It takes y* years to graduate from college. For workers in Group A (high skill workers) the cost of going to college is $6 per year (C<sub>A</sub> = 6y*). For workers in Group B (low skill workers) the cost of going to college is $10 per year (C<sub>B</sub> = 10y*). In addition to this cost, when accepted by the college, each worker also has to pay a one time enrollment fee of $6, independently of skill and independently of y* (it is a fixed cost, not a per year cost). Employers cannot observe the skill of job candidates, but they can observe whether or not they graduated from college. Employees will be offered $68 if they graduate from college, and they will be offered $32 if they don't have a college degree. In equilibrium, a college degree can be used as a signal of the worker's true type if`,['8 ≥ y* ≥ 4','5 ≥ y* ≥ 3','8 ≥ y* ≥ 2','5 ≥ y* ≥ 2','6 ≥ y* ≥ 3'],'B',
 `Group A must want the degree: 68 − 6y* − 6 ≥ 32, so y* ≤ 5. Group B must not: 68 − 10y* − 6 ≤ 32, so y* ≥ 3. Therefore <b>3 ≤ y* ≤ 5</b>. The one-time fee is the same for both groups, so it lowers the net benefit without separating the types.`,{ramos:11});
E('m4-12',12,3,`Firm 1 produces high-quality cars. Its marginal cost is $5,000, and each year of warranty is expected to cost it $1,000 per car. Firm 2 produces low-quality cars. Its marginal cost is $3,000, and each year of warranty is expected to cost it $2,500 per car. Consumers cannot observe the quality of a car. They are willing to pay $9,000 for a high-quality car and $5,000 for a low-quality car, plus $500 for each year of warranty. Consumers believe that only high-quality cars come with y* years of warranty. In equilibrium, this belief is consistent with the firms' optimal behavior if ______.`,['4 ≥ y* ≥ 1.6','10 ≥ y* ≥ 2.5','8 ≥ y* ≥ 3','8 ≥ y* ≥ 2','None of the above'],'D',
 `Firm 1 offers the warranty if 9,000 + 500y* − 5,000 − 1,000y* ≥ 5,000 − 5,000, so 4,000 − 500y* ≥ 0 and y* ≤ 8. Firm 2 does not mimic if 9,000 + 500y* − 3,000 − 2,500y* ≤ 5,000 − 3,000, so 6,000 − 2,000y* ≤ 2,000 and y* ≥ 2. Therefore <b>2 ≤ y* ≤ 8</b>.`,{ramos:12});
E('m4-13',12,2,`A firm has a group of interns and needs to decide which interns to promote to managerial positions. To do so, the firm implements an aptitude test. All interns who pass the test are promoted to managerial positions and receive a wage of $193. Interns who do not pass the test are assigned to non-managerial positions and receive a wage of $178. Each intern must choose whether to exert high effort or low effort studying for the test. If an intern chooses low effort, he fails the test but pays no effort cost (zero effort cost). If an intern chooses high effort, he passes the test but pays an high effort cost, which depends on the intern's type. There are three types of interns. An intern of type A must pay a cost C<sub>A</sub> = $30 to exert high effort and pass the test. An intern of type B has a high effort cost of C<sub>B</sub> = $20, while an intern of type C has a high effort cost of C<sub>C</sub> = $10. Each intern knows his own type, but the firm can only observe the result of the test. Each intern chooses the effort that maximizes his own utility, where utility equals wage minus effort cost. In this case, what can the firm infer about the type of an intern who passes the test?`,['The intern must be type A.','The intern must be type C.','The intern must be type A or B.','The intern must be type B or C.','The firm cannot infer anything relevant because all interns will pass the test.'],'B',
 `Passing raises the wage by 193 − 178 = $15. High effort is worth it only if the cost is below $15. Type C ($10) passes; types B ($20) and A ($30) do not. So the intern <b>must be type C</b>.`,{ramos:13});
E('m4-14',12,3,`Consumers have utility u(I) = √I and income $6000. The cost of going to the doctor is $1280, and the cost of going to the gym is $60. If the consumer goes to the gym, the probability of getting sick is 10%; if he does not go to the gym, the probability of getting sick is 75%. When sick, the consumer must go to the doctor. An insurance company is offering an insurance plan with an insurance premium of $120 and a co-pay of $100 (that is, the consumer must pay the $100 if he goes to the doctor). [Keep as many decimals as possible during all your computations. At the very end, mark the option with the numbers closest to your answer.] The consumer's expected utility from going to the gym and buying this insurance plan is approximately`,['76.19','76.22','76.68','81.13','70.49'],'B',
 `With the gym and the insurance he always pays the premium and the gym, and pays the co-pay only if sick: 0.10√(6000 − 60 − 120 − 100) + 0.90√(6000 − 60 − 120) = 0.10√5720 + 0.90√5820 ≈ 7.563 + 68.660 = <b>76.22</b>.`,{ramos:14});
E('m4-15',12,3,`The $100 co-pay from the previous question`,['Fixes the adverse selection problem','Fixes the moral hazard problem','Should be lower otherwise the consumer will not buy it','Should be higher to fix the moral hazard problem','Should be higher to fix the adverse selection problem'],'B',
 `Gym and insurance: 76.22. No gym with insurance: 0.75√(6000 − 120 − 100) + 0.25√(6000 − 120) = 0.75√5780 + 0.25√5880 ≈ 76.19. He still prefers the gym (76.22 &gt; 76.19), so the co-pay <b>fixes the moral hazard problem</b>. He also still buys the insurance: no insurance with the gym gives 0.1√4660 + 0.9√5940 ≈ 76.19 &lt; 76.22.`,{ramos:15,given:`From the previous question: u(I) = √I, income $6000, doctor $1280, gym $60 (sickness probability 10% with the gym, 75% without), premium $120, co-pay $100.`});
E('m4-16',12,3,`Consumers have utility u(I) = √I and income $8000. The cost of going to the doctor is $2400, and the cost of going to the gym is $120. If the consumer goes to the gym, the probability of getting sick is 20%; if he does not go to the gym, the probability of getting sick is 60%. When sick, the consumer must go to the doctor. An insurance company is offering an insurance plan with a premium of $360 and a co-pay of $600 (that is, the consumer must pay the $600 if he goes to the doctor). [Keep as many decimals as possible during all your computations.] Which of the following describes what the consumer does?`,['He buys the insurance and goes to the gym.','He buys the insurance and does not go to the gym.','He does not buy the insurance and goes to the gym.','He does not buy the insurance and does not go to the gym.','He is indifferent between buying and not buying the insurance.'],'A',
 `Compute the four options. Insurance + gym: 0.2√(8000 − 120 − 360 − 600) + 0.8√(8000 − 120 − 360) = 0.2√6920 + 0.8√7520 ≈ <b>86.01</b>. Insurance, no gym: 0.6√7040 + 0.4√7640 ≈ 85.31. No insurance + gym: 0.2√5480 + 0.8√7880 ≈ 85.82. No insurance, no gym: 0.6√5600 + 0.4√8000 ≈ 80.68. The best is to <b>buy the insurance and go to the gym</b>.`,{ramos:16});

/* --- review session: car insurance and key concepts --- */
Z('car-1',12,2,`There are many consumers. Each has a car worth $10,000. In an accident, fixing the car costs $7,500. Utility is U(X) = √X. Driving carefully costs $1,000 (an opportunity cost). If careful, the accident probability is 10%; if not careful, 90%. Suppose car insurance does not exist. Which does the consumer choose, and what is the fair insurance premium (the expected loss when everyone drives carefully)?`,'He drives carefully (89.25 versus 55); the fair premium is $750',['He drives carelessly (89.25 versus 55); the fair premium is $6,750','He drives carefully; the fair premium is $7,500','He drives carelessly; the fair premium is $750'],`Careful: 0.1√(10,000 − 7,500 − 1,000) + 0.9√(10,000 − 1,000) = 0.1√1,500 + 0.9√9,000 ≈ 89.25. Not careful: 0.9√2,500 + 0.1√10,000 = 55. Everyone drives carefully, so the accident probability is 10% and the fair premium is 0.1 × 7,500 = <b>$750</b>.`);
E('car-2',12,3,`Same car insurance example (careful driving without insurance gives 89.25). Insurance companies sell full insurance at P = $750. What happens?`,['Consumers buy it and keep driving carefully; insurers break even','Consumers do not buy it','Consumers buy it and stop driving carefully; insurers lose money','Only careful drivers buy it','Consumers buy it, drive carefully and insurers earn a profit'],'C',
 `Careful with insurance: √(10,000 − 750 − 1,000) = √8,250 ≈ 90.83. Not careful with insurance: √(10,000 − 750) = √9,250 ≈ 96.18. Insured, he stops being careful, so the accident probability is 90% and the insurer pays 0.9 × 7,500 = 6,750 per policy. Profit = 750 − 6,750 = <b>−$6,000</b>: <b>moral hazard</b>.`);
Z('car-3',12,3,`Same example. Insurers raise the price to P = $6,750 to cover the cost of careless drivers. What happens?`,'Nobody buys it: the insurance market collapses because of moral hazard',['Everybody buys it and drives carelessly','Everybody buys it and drives carefully','Only careful drivers buy it'],`Careless with insurance at $6,750: √(10,000 − 6,750) = √3,250 ≈ 57. That is far below 89.25 from driving carefully without insurance, so nobody buys. The insurer cannot charge enough to cover the extra accidents.`);
E('car-4',12,3,`Same example. The insurer charges P = $750 and also makes the consumer pay a $1,300 deductible every time he has an accident. What happens?`,['Consumers buy it and drive carefully','Consumers buy it and do not drive carefully','Consumers do not buy it and drive carefully','Consumers do not buy it and do not drive carefully','Consumers are indifferent between all four'],'A',
 `Careful with the deductible: 0.1√(10,000 − 750 − 1,300 − 1,000) + 0.9√(10,000 − 750 − 1,000) = 0.1√6,950 + 0.9√8,250 ≈ 90.08. Not careful with the deductible: 0.9√(10,000 − 750 − 1,300) + 0.1√9,250 ≈ 89.86. He drives carefully. He also buys, because 90.08 &gt; 89.25 (careful, no insurance). The deductible solves moral hazard. The insurer expects to pay 0.1 × (7,500 − 1,300) = 620 per policy and earns 750 − 620 = $130, because risk-averse consumers pay more than the expected loss.`);
Z('car-5',12,2,`In the car insurance example, the insurer charges $750 with a $1,300 deductible and expects to pay 0.1 × (7,500 − 1,300) = $620 per policy. Why do consumers still buy it?`,'They are risk averse, so they pay more than their expected loss to reduce risk',['The premium equals the expected loss','They cannot drive without insurance','The deductible makes accidents impossible'],`Consumers pay $750 against an expected payout of $620: not fair insurance. Because of risk aversion the careful-driver-with-insurance utility (90.08) is still above no insurance (89.25). The insurer earns $130 per policy.`);
E('kc-1',12,2,`Which of the following is an example of moral hazard?`,['The seller of a used car knows more about its mechanical problems than the buyer','A consumer with auto insurance takes more risks while driving','Unskilled drivers are more likely to buy extra insurance','Sick people are more likely to buy health insurance','A worker\'s effort translates directly into output that the firm observes'],'B',
 `Moral hazard is a hidden <i>action</i> that affects the other party's payoff, taken after the contract. (A), (C) and (D) are hidden types, so adverse selection. (E) is not moral hazard, because output reveals the effort.`);
Z('kc-2',12,2,`The seller of a used car knows how many sets of tires the car has gone through, while the buyer does not. Is this an adverse selection problem?`,'No: the information does not affect the buyer\'s payoff in a way that creates a hidden-type problem',['Yes: the seller knows more than the buyer','Yes: it is a lemons problem','No: it is a moral hazard problem'],`Adverse selection needs a hidden type whose information can <i>negatively affect the payoffs</i> of the less-informed party, as with the hidden quality of a used car. Information that does not matter to the buyer's payoff is a non-example.`);
Z('kc-3',12,2,`Signaling versus screening: which statement is correct?`,'In signaling the better-informed side moves first; in screening the less-informed side moves first and designs the offer',['In signaling the less-informed side moves first','In both, the less-informed side moves first','In both, the informed side moves first'],`Signaling: the side with better information sends a costly credible signal first (a warranty, education). Screening: the side with less information designs the offer (a wage for a degree, a menu of plans) so that each type self-selects. Cheap talk is not a credible signal.`);

/* ===== CHAPTER 13: INCENTIVES AND CONTRACTS ===== */
Z('c13-1',13,2,`A firm produces output q and sells it for a price p = 20 per unit. The production function is q = 2h, where h is the number of hours worked. The worker's cost of effort is c = h². Benchmark: the firm's owner (principal) is also the only worker (agent), and chooses h to maximize utility = earnings − effort cost. How many hours will she work, and what will be her utility?`,'h = 20 ; utility = 400',['h = 10 ; utility = 100','h = 20 ; utility = 200','h = 40 ; utility = 400','h = 10 ; utility = 400'],`Utility = 20(2h) − h² = 40h − h². FOC: 40 − 2h = 0, so h = 20, and utility = 800 − 400 = <b>400</b>.`);
Z('c13-2',13,3,`Now the owner (principal) and the worker (agent) are different people. The owner chooses a per hour wage w, then the agent chooses hours h to maximize wh − h². The owner maximizes profit = pq − wh with p = 20 and q = 2h. In the SPE, the wage and hours are`,'w = 20 ; h = 10',['w = 20 ; h = 20','w = 10 ; h = 20','w = 40 ; h = 10','w = 10 ; h = 10'],`Worker: w − 2h = 0, so h = w/2. Owner: profit = 40h − wh = 20w − w²/2, FOC 20 − w = 0, <b>w = 20</b>, h = 10. Profit = 200, worker utility = 100.`);
Z('c13-2b',13,3,`In the previous question the worker's own-owner benchmark gave total surplus 400. With a separate principal and agent (w = 20, h = 10, profit 200, worker utility 100) the total surplus is 300. Why is the surplus lower?`,'The principal chooses an inefficient contract to capture a larger share of the surplus',['The worker has less skill when employed','Hours worked are unobservable','The price of the output falls','The principal makes a mistake in choosing the wage'],`The contract affects both the size of the surplus and how it is split. The principal optimally accepts a smaller total in order to keep more for herself.`);
E('c13-3',13,3,`Suppose that the principal can rent her capital to the worker. The owner chooses a rental price r and makes a take-it-or-leave-it offer to the worker. The worker chooses whether to rent the capital. If the worker rejects the offer, owner and worker attain a zero payoff. If the worker accepts, he pays r to the owner and he can choose how many hours to work. The worker keeps all revenue (p = 20, q = 2h, effort cost h²). In equilibrium, the principal offers the rental price ______. The agent pays this price and chooses to work ______.`,['r = 400 ; h = 10','r = 200 ; h = 40','r = 300 ; h = 10','r = 100 ; h = 40','r = 400 ; h = 20'],'E',
 `If the worker rents, he keeps all revenue, so he behaves like the owner-worker: h = 20 and utility 400 before paying r. His outside option is 0, so the owner charges the most he will pay: <b>r = 400</b>. Total surplus is efficient and the principal captures all of it.`);
E('c13-4',13,2,`A risk-neutral worker can choose Low or High effort. The manager cannot observe the worker's action, but the manager can observe the realized revenue of the firm (either $300 or $500). If the worker chooses low effort, then the firm's revenue will be low ($300) for sure. The cost of low effort for the worker is zero. If the worker chooses high effort, then the firm's revenue will be high ($500) for sure. The cost of high effort for the worker is $10. The manager is currently offering the worker a payment w<sub>H</sub> if the revenue is high ($500), and w<sub>L</sub> if the revenue is low ($300). To guarantee incentive compatibility, to incentivize the worker to choose high effort, the wages must be such that:`,['w<sub>H</sub> ≥ 500','w<sub>H</sub> ≥ 10','w<sub>H</sub> − w<sub>L</sub> ≥ 10','w<sub>H</sub> − w<sub>L</sub> ≥ 50','w<sub>H</sub> − w<sub>L</sub> ≥ 20'],'C',
 `High effort must pay at least as much as low effort: w<sub>H</sub> − 10 ≥ w<sub>L</sub> − 0, so <b>w<sub>H</sub> − w<sub>L</sub> ≥ 10</b>. The wage gap has to cover the effort cost.`);
E('c13-5',13,3,`A risk-neutral worker can choose Low or High effort. The manager cannot observe the worker's action, but can observe the realized revenue (either $300 or $500). Low Effort: cost $0; probability of low revenue ($300) = 80%, high revenue ($500) = 20%. High Effort: cost $10; probability of low revenue = 60%, high revenue = 40%. The manager is offering w<sub>H</sub> if revenue is high and w<sub>L</sub> if it is low. To guarantee incentive compatibility, to incentivize the worker to choose high effort, the wages must be such that:`,['w<sub>H</sub> ≥ 500','w<sub>H</sub> ≥ 10','w<sub>H</sub> − w<sub>L</sub> ≥ 10','w<sub>H</sub> − w<sub>L</sub> ≥ 50','w<sub>H</sub> − w<sub>L</sub> ≥ 20'],'D',
 `0.4w<sub>H</sub> + 0.6w<sub>L</sub> − 10 ≥ 0.2w<sub>H</sub> + 0.8w<sub>L</sub>, so 0.2(w<sub>H</sub> − w<sub>L</sub>) ≥ 10 and <b>w<sub>H</sub> − w<sub>L</sub> ≥ 50</b>. Effort only raises the chance of high revenue by 20 points, so the reward gap must be 10/0.2 = 50.`);
Z('c13-6',13,2,`A risk-neutral worker can choose Low or High effort. If the worker chooses low effort, the firm's revenue is low ($300) for sure and the cost is zero. If the worker chooses high effort, revenue is high ($500) for sure and the cost is $10. Instead of a given wage, the manager offers the worker a payment equal to 20% of the revenue of the firm. Will the worker choose high effort or low effort? What is the expected profit of the firm?`,'High effort ; expected profit $400',['Low effort ; expected profit $240','High effort ; expected profit $500','Low effort ; expected profit $300','High effort ; expected profit $100'],`High effort: 0.2(500) − 10 = 90. Low effort: 0.2(300) = 60. He chooses high effort. The firm keeps 80% of 500 = <b>$400</b>.`);
Z('c13-7',13,3,`A risk-neutral worker can choose Low or High effort. Low Effort: cost $0; probability of low revenue ($300) = 80%, high revenue ($500) = 20%. High Effort: cost $10; probability of low revenue = 60%, high revenue = 40%. The manager offers the worker a payment equal to 20% of the revenue. Will the worker choose high effort or low effort? What is the expected profit of the firm?`,'Low effort ; expected profit $272',['High effort ; expected profit $304','Low effort ; expected profit $340','High effort ; expected profit $272','Low effort ; expected profit $68'],`High: 0.2(0.4(500) + 0.6(300)) − 10 = 0.2(380) − 10 = 66. Low: 0.2(0.2(500) + 0.8(300)) = 0.2(340) = 68. Low effort is better. Profit = 0.8(340) = <b>$272</b>.`);
E('c13-8',13,3,`A risk-neutral worker can choose Low or High effort. Low Effort: cost $0; probability of low revenue ($300) = 80%, high revenue ($500) = 20%. High Effort: cost $10; probability of low revenue = 60%, high revenue = 40%. Instead of offering a flat wage, the manager is trying a new payment scheme. The manager is currently offering to the worker a payment equal to x% of the revenue of the firm. Compute the minimum x such that the worker prefers to exert high effort.`,['x = 30%','x = 15%','x = 20%','x = 25%','x = 35%'],'D',
 `High: x(380) − 10. Low: x(340). High is preferred if 380x − 10 ≥ 340x, so 40x ≥ 10 and <b>x ≥ 25%</b>.`);
E('c13-9',13,3,`A risk-neutral worker can choose Low or High effort. Low Effort: cost $0; probability of low revenue ($300) = 80%, high revenue ($500) = 20%. High Effort: cost $12; probability of low revenue = 60%, high revenue = 40%. The manager offers the worker a payment equal to x% of the revenue of the firm. Compute the minimum x such that the worker prefers to exert high effort.`,['x = 30%','x = 15%','x = 20%','x = 25%','x = 35%'],'A',
 `380x − 12 ≥ 340x, so 40x ≥ 12 and <b>x ≥ 30%</b>. A higher effort cost requires a bigger share.`);
Z('c13-10',13,3,`Same setup as above (Low effort: cost $0, expected revenue $340; High effort: cost $c, expected revenue $380). The manager offers the worker a payment equal to x% of the revenue. The minimum x such that the worker prefers high effort, as a function of the cost c, is`,'x = c/40',['x = c/20','x = 40/c','x = c/380','x = 40c'],`380x − c ≥ 340x, so 40x ≥ c and <b>x ≥ c/40</b>. The minimum share increases with the effort cost c.`);
E('c13-11',13,3,`A risk-neutral worker can choose Low or High effort. Low Effort: cost $0; probability of low revenue ($300) = 75%, high revenue ($500) = 25%. High Effort: cost $40; probability of low revenue = 25%, high revenue = 75%. The manager is currently offering the worker a payment equal to 30% of the revenue of the firm. Given this payment, the firm's expected profit will be`,['$205','$325','$315','$335','$245'],'E',
 `High: 0.3(0.75(500) + 0.25(300)) − 40 = 0.3(450) − 40 = 95. Low: 0.3(0.25(500) + 0.75(300)) = 0.3(350) = 105. The worker chooses <b>low effort</b>. Profit = 0.7(350) = <b>$245</b>.`);
E('c13-12',13,3,`Ultimate Shoe Company (USC) is a new firm that produces handmade shoes. Let Q be the number of shoes produced. Each worker is able to produce shoes according to the production function Q = 2√e, where e represents the effort of the worker. The worker's personal cost of exerting effort is simply e/2. The worker receives from USC a payment b for each shoe produced. The worker's utility equals his income minus his effort cost. The worker chooses the effort that maximizes his utility. Find the worker's optimal effort choice.`,['e* = 4b²','e* = 2√b','e* = 2b','e* = 4√b','e* = b²'],'A',
 `Utility = 2b√e − e/2. FOC: b/√e − 1/2 = 0, so √e = 2b and <b>e* = 4b²</b>. This is the agent's best response to the bonus b.`);
E('c13-13',13,2,`Eye-Kya is a new furniture company. It hires workers to produce chairs. Let Q be the number of chairs produced. Each worker produces according to Q = 4e, where e represents the effort of the worker. The worker's personal cost of exerting effort is e²/4. The worker receives from Eye-Kya a payment b for each chair produced. The worker's utility equals his income minus his effort cost. If b = 1, then we have`,['e* = 16','e* = √2','e* = 4','e* = 2','e* = 8'],'E',
 `Utility = 4be − e²/4. FOC: 4b − e/2 = 0, so e* = 8b. With b = 1: <b>e* = 8</b>.`);
E('c13-14',13,3,`Consider the information from the previous question (Q = 4e, effort cost e²/4, payment b per chair, so e* = 8b), and suppose that Eye-Kya only has one worker. Eye-Kya has market power, facing inverse demand P = 520 − 2Q. Eye-Kya's profit equals its revenues minus the labor costs. Find the payment b that maximizes the firm's profit. The firm's profit is`,['Profit = 33,050','Profit = 33,160','Profit = 33,280','Profit = 33,230','Profit = 33,190'],'C',
 `Q = 4e = 32b. Profit = (520 − 2Q)Q − bQ = 16,640b − 2,080b². FOC: 16,640 − 4,160b = 0, so b* = 4. Then Q = 128, P = 264 and profit = 264(128) − 4(128) = <b>33,280</b>.`);
E('c13-15',13,2,`Eye-Kya hires workers to produce chairs according to Q = 2e. The worker's personal cost of exerting effort is e²/2. The worker receives a payment b for each chair produced. The worker's utility equals his income minus his effort cost. Find the worker's optimal effort choice.`,['e* = 2b','e* = 2√b','e* = b','e* = √b','e* = b²'],'A',
 `Utility = 2be − e²/2. FOC: 2b − e = 0, so <b>e* = 2b</b>.`);
E('c13-16',13,3,`Consider the information from the previous question (Q = 2e, e* = 2b), and suppose that Eye-Kya only has one worker. Eye-Kya pays the worker b for each chair produced. It also pays for materials: Material Cost = Q². Eye-Kya sells each chair at a price P = 20. Find the payment b that maximizes the firm's profit.`,['b* = 18','b* = 10','b* = 15','b* = 5','b* = 2'],'E',
 `Q = 2e = 4b. Profit = 20Q − bQ − Q² = 80b − 4b² − 16b² = 80b − 20b². FOC: 80 − 40b = 0, so <b>b* = 2</b>.`);
E('c13-17',13,3,`Eye-Kya hires one worker to produce chairs. The worker chooses how many hours H to work. During each hour, the employee produces 6 chairs. The worker's personal cost of working is H²/3. The worker receives a payment b for each chair, and his utility equals his income minus his cost of working. Eye-Kya faces inverse demand P = 436 − 2Q. Find the payment b that maximizes the firm's profit. The firm's profit is`,['Profit = 23,542','Profit = 23,540','Profit = 23,541','Profit = 23,543','Profit = 23,544'],'E',
 `Worker: 6bH − H²/3, so H = 9b and Q = 54b. Profit = (436 − 2Q)Q − bQ = 23,544b − 5,886b². FOC: b* = 2. Q = 108, P = 220, profit = 220(108) − 2(108) = <b>23,544</b>.`);
E('c13-18',13,3,`Uber produces output Q, where Q is the number of clients served. Each Uber driver chooses how many hours H to work. During each hour worked, a driver is able to serve 4 clients. The cost of driving H hours is 4H². Uber pays its driver a wage b for each client served. Uber faces inverse demand P = 170 − 2Q. In addition to wages, Uber's other expenses equal 6Q². Uber chooses the wage b that maximizes its profit. Find Uber's profit in the SPE of this game.`,['Profit = 900','Profit = 850','Profit = 800','Profit = 750','Profit = 700'],'B',
 `Driver: 4bH − 4H², so H = b/2 and Q = 4H = 2b. Profit = (170 − 2Q)Q − bQ − 6Q² = 340b − 34b². FOC: b* = 5. Q = 10, P = 150, profit = 1,500 − 50 − 600 = <b>850</b>.`);
E('c13-19',13,3,`Zack sells cars. The number of cars he is able to sell depends on his own effort e: Q = 3e. Zack's employer promises to pay him a bonus b for each car sold. However, with probability 0.6 the company will survive and will pay the promised bonus, and with probability 0.4 the company will go bankrupt and will pay nothing. Zack is risk-neutral. His effort cost is 3e². What is the bonus b that induces Zack to choose an effort e* = 6?`,['b = 6','b = 5','b = 20','b = 10','b = 16'],'C',
 `Expected utility = 0.6(b)(3e) − 3e² = 1.8be − 3e². FOC: 1.8b − 6e = 0, so e* = 0.3b. For e* = 6: <b>b = 20</b>. The bankruptcy risk makes the bonus less effective, so it must be larger.`);
E('c13-20',13,3,`The manager of a car dealership wants to sell cars. Each car is sold at the price P = $1,000. If the worker chooses effort level e, then with probability e she sells 3 cars, and with probability (1 − e) she sells only 1 car. The worker's effort cost is C = 1,000e². The manager pays the worker a bonus b for each car sold. The worker chooses the effort that maximizes her expected utility (expected income minus effort cost). The car dealer's only cost is the bonus it pays. The manager chooses the bonus that maximizes the firm's expected profit. In the SPE of this game, the manager will offer a bonus`,['b = 750','b = 500','b = 250','b = 900','b = 100'],'C',
 `E[Q] = 3e + (1 − e) = 2e + 1. Worker: b(2e + 1) − 1,000e², FOC 2b − 2,000e = 0, so e = 0.001b. E[Q] = 0.002b + 1. Manager: (1,000 − b)(0.002b + 1) = 1,000 + b − 0.002b². FOC: 1 − 0.004b = 0, so <b>b = 250</b>.`);
E('c13-21',13,3,`A factory employs 50 workers who produce handcrafted toys. Each worker can produce 5 toys in one hour. Working hours are flexible. For each worker, the effort cost of working is 5h², where h is the number of hours worked. The factory pays each worker a bonus b for each toy produced. Each worker's utility equals income minus effort cost. The factory is able to sell each toy for a price P = 30. In addition to the bonus, the factory incurs a material cost equal to 0.002Q², where Q is the total quantity of toys produced by all workers. Find the bonus b that maximizes the factory's profit.`,['b = 12','b = 8','b = 10','b = 16','b = 5'],'A',
 `Worker: 5bh − 5h², so h = 0.5b, q = 5h = 2.5b, Q = 50q = 125b. Profit = 30Q − bQ − 0.002Q² = 3,750b − 156.25b². FOC: 3,750 − 312.5b = 0, so <b>b = 12</b>.`);
E('c13-22',13,3,`A risk-neutral firm produces chemical products, and its objective is to maximize expected profit. There is a risk of an accident that pollutes the water. To reduce the risk, the firm can choose Low or High investment in safety. Low Investment: cost $0; probability of an accident 80%. High Investment: cost $150; probability of an accident 20%. The Government cannot observe the firm's investment in safety (moral hazard), but it can observe whether an accident occurred. If an accident occurs, the firm must pay a fine F. Compute the minimum fine F that the Government must impose, in order to solve the moral hazard problem and guarantee that the firm will choose the high investment in safety.`,['F = 200','F = 250','F = 400','F = 300','F = 350'],'B',
 `High: −150 − 0.2F. Low: −0.8F. High is chosen if −150 − 0.2F ≥ −0.8F, so 0.6F ≥ 150 and <b>F ≥ 250</b>.`);
E('c13-23',13,3,`A risk-neutral firm produces chemical products. To reduce the risk of an accident, the firm can choose the level of investment s in safety. If the firm invests s in safety, the probability of an accident is 1 − s, while the probability of no accident is s. The cost of investing s in safety is s². The firm has no direct cost or benefit from the accident. The Government cannot observe the firm's investment in safety, but it can observe whether an accident occurred. If an accident occurs, the firm must pay a fine F. Compute the fine F that the Government must impose, so that in the SPE the probability of an accident is 10%.`,['F = 1.0','F = 1.2','F = 2.5','F = 1.8','F = 2.2'],'D',
 `Profit = −(1 − s)F − s². FOC: F − 2s = 0, so s = 0.5F. A 10% accident probability means s = 0.9, so 0.9 = 0.5F and <b>F = 1.8</b>.`);
Z('c13-24',13,2,`The following graph represents the demand and supply of labor in California. Market clearing is at w = 5. In this market, the wage ______ can be considered an "efficiency wage" because ______.`,'w = 6 ; some unemployment exists and workers have no incentive to shirk',['w = 5 ; there is no unemployment','w = 4 ; some unemployment exists and workers have no incentive to shirk','w = 5 ; some unemployment exists and workers have no incentive to shirk','None of the above'],`An efficiency wage is set <b>above</b> the market-clearing wage (6 &gt; 5). At w = 6 labor supply exceeds demand, so there is unemployment, and the threat of losing a well paid job gives workers no incentive to shirk.`,{fig:'labor'});
Z('o13-1',13,1,`A principal-agent problem arises when`,'the principal cannot directly observe the agent\'s effort',['the principal and the agent are the same person','the agent has no cost of effort','the agent always knows the principal\'s profit','the output is perfectly predictable'],`Because effort (the action) is hidden, the principal must design incentives (bonuses, shares, fines) so the agent's own interest leads to the effort the principal wants.`);
Z('o13-2',13,1,`An incentive compatibility constraint says that the contract must be such that`,'the agent finds it in his own interest to choose the effort the principal wants',['the agent earns zero profit','the principal observes effort for free','the agent accepts any offer','the principal and agent earn the same payoff'],`Incentive compatibility: the desired action must give the agent at least as much utility as every other action. The participation constraint is the separate requirement that he prefers the job to his outside option.`);
Z('o13-3',13,2,`A worker's output is Q = 4e and his effort cost is e². The firm pays him b per unit and sells output at P = 20, with no other costs. What bonus b maximizes the firm's profit?`,'b = 10',['b = 5','b = 20','b = 8','b = 15'],`Worker: 4be − e², so e = 2b and Q = 8b. Profit = (20 − b)(8b) = 160b − 8b². FOC: 160 − 16b = 0, so <b>b = 10</b>.`);
Z('o13-4',13,3,`A risk-neutral worker chooses Low effort (cost $0) or High effort (cost $15). If effort is Low, the probability of high revenue is 10% and of low revenue is 90%. If effort is High, the probabilities are 50% and 50%. The manager pays w<sub>H</sub> after high revenue and w<sub>L</sub> after low revenue. To induce high effort, the wages must satisfy`,'w<sub>H</sub> − w<sub>L</sub> ≥ 37.5',['w<sub>H</sub> − w<sub>L</sub> ≥ 15','w<sub>H</sub> − w<sub>L</sub> ≥ 150','w<sub>H</sub> − w<sub>L</sub> ≥ 30','w<sub>H</sub> − w<sub>L</sub> ≥ 75'],`High effort raises the probability of high revenue by 0.5 − 0.1 = 0.4. The gain 0.4(w<sub>H</sub> − w<sub>L</sub>) must cover the cost 15: <b>w<sub>H</sub> − w<sub>L</sub> ≥ 15/0.4 = 37.5</b>.`);
Z('o13-5',13,3,`A risk-neutral firm can invest Low (cost $0, accident probability 60%) or High (cost $100, accident probability 10%) in safety. The Government fines the firm F after an accident. What is the minimum F that makes the firm choose High investment?`,'F = 200',['F = 100','F = 150','F = 250','F = 167'],`High: −100 − 0.1F. Low: −0.6F. High is chosen if 0.5F ≥ 100, so <b>F ≥ 200</b>.`);
Z('o13-6',13,3,`Zack sells cars with Q = 2e and effort cost e². With probability 0.5 the company survives and pays him a bonus b per car; with probability 0.5 it goes bankrupt and pays nothing. Zack is risk-neutral. What bonus b induces e* = 8?`,'b = 16',['b = 8','b = 32','b = 4','b = 12'],`Expected utility = 0.5·b·2e − e² = be − e². FOC: b − 2e = 0, so e* = 0.5b. For e* = 8: <b>b = 16</b>.`);
Z('o13-7',13,2,`A firm pays each worker a wage above the market-clearing wage so that workers fear losing the job and do not shirk. This is an example of`,'an efficiency wage',['a two-part tariff','adverse selection','a signal of quality','a Stackelberg strategy'],`Efficiency wage: w above the market-clearing level raises the cost of being fired, which reduces shirking. A side effect is some unemployment.`);

/* ===== MIDTERM 4 REVIEW DECK, Chapter 13 (Prof. Ramos, exact wording) ===== */
E('m4-17',13,2,`Zack sells cars. For each car Q that he is able to sell, he receives a payment b from his company. The amount of cars he is able to sell depends on the market demand and on his own effort. Zack's production function is <span class="eq">Q = xe,</span> where x represents the intensity of the demand and e represents his effort. With probability .7 the demand will be high (x = 18) and with probability .3 the demand will be low (x = 8). Zack is risk-neutral, and when he chooses his effort he does not know if the demand will be high or low; he only knows the probabilities. For Zack, his effort cost is 3e². Zack's expected utility equals his expected income minus the cost of effort. The optimal effort that maximizes Zack's expected utility is e* = ______.`,['4b','1.5b','2b','2.5b','2.333b'],'D',
 `E[x] = 0.7(18) + 0.3(8) = 15. Expected utility = b · 15e − 3e². FOC: 15b − 6e = 0, so <b>e* = 2.5b</b>.`,{ramos:17});
E('m4-18',13,1,`Eye-Kya hires one worker to produce chairs. Let Q be the number of chairs produced. The worker is able to produce chairs according to the following production function: <span class="eq">Q = 6e,</span> where the variable e represents the effort of the worker. For the worker, his personal cost of exerting effort is simply <span class="eq">Effort cost = e².</span> The worker receives from Eye-Kya a payment b for each chair produced. The worker's utility equals his income minus his effort cost. The worker chooses the effort that maximizes his utility. Find the worker's optimal effort choice.`,['e* = 2b','e* = 2√b','e* = 6b','e* = 3b','e* = 4b'],'D',
 `Utility = b(6e) − e². FOC: 6b − 2e = 0, so <b>e* = 3b</b>.`,{ramos:18});
E('m4-19',13,3,`Consider the information from the previous question, and suppose that Eye-Kya only has one worker. Eye-Kya pays to the worker b for each chair produced. Moreover, Eye-Kya has to pay for all the necessary material (wood, nails, etc.). For Eye-Kya, the total material cost is <span class="eq">Material Cost = Q².</span> Eye-Kya is able to sell each chair Q at a price P = 190. Eye-Kya's profit from the production of chairs equals its revenues minus the costs (the labor cost and the material cost). Find the payment b that maximizes the firm's profit.`,['b* = 5','b* = 18','b* = 10','b* = 15','b* = 2'],'A',
 `From the worker, e* = 3b, so Q = 6e = 18b. Profit = 190Q − bQ − Q² = (190 − b)(18b) − 324b² = 3,420b − 342b². FOC: 3,420 − 684b = 0, so <b>b* = 5</b>.`,{ramos:19,given:`From the previous question: Q = 6e, effort cost e², the worker is paid b per chair, so e* = 3b.`});
E('m4-20',13,2,`A risk-neutral firm produces chemical products, and its objective is to maximize expected profit. There is a risk that there will be an accident during the production process, and dangerous chemical products will be released into the ocean, polluting the water. To reduce the risk of an accident, the firm can choose Low or High investment in safety.<br>Low Investment in Safety: Cost for firm = $0; Probability of an Accident = 60%; Probability of No Accident = 40%.<br>High Investment in Safety: Cost for firm = $150; Probability of an Accident = 10%; Probability of No Accident = 90%.<br>The Government wants to reduce the risk of an accident, but the Government cannot observe the firm's investment in safety. Therefore, there is a moral hazard problem. However, the Government can observe whether an accident occurred or not. The government decides to create a fine (penalty): if an accident occurs, the firm must pay a fine F to the Government. If an accident does not occur, then the firm does not have to pay nothing. Compute the minimum fine F that the Government must impose, in order to solve the moral hazard problem and guarantee that the firm will choose the high investment in safety.`,['F = 200','F = 250','F = 400','F = 300','F = 350'],'D',
 `High: −150 − 0.10F. Low: −0.60F. The firm chooses High if −150 − 0.10F ≥ −0.60F, so 0.5F ≥ 150 and <b>F ≥ 300</b>.`,{ramos:20});
E('m4-21',13,2,`Consider the following principal-agent problem. The principal (owner of a firm) wants to incentivize the agent (worker) to exert high effort. To do so, the principal proposes to the agent the following relational contract: the owner promises to pay according to the worker's performance and the worker agrees to continue to exert high effort. If the owner does not pay what was promised or the worker stops exerting high effort, their valuable relationship ends. That is, their relationship will continue until someone deviates. What can we say about this type of relational contracts?<br><br>I - Since this relational contract involves a monetary payment, players will only follow this contract if there is some form of external enforcement of the contract.<br>II - Players will be willing to follow this relational contract if they are sufficiently impatient about future payments.<br>III - It is easier to sustain this type of relational contract if the interest rate r used to discount future payments is sufficiently high.`,['Statements I, II, and III are false','Statements I, II, and III are true','Statements I is true, statements II and III are false','Statements I and III are true, statement II is false','Statements II and III are true, statement I is false'],'A',
 `A relational contract is <b>self-enforcing</b>: each side keeps the promise because losing the valuable relationship is costly, like the trigger strategy in a repeated game. I is false (no external enforcement is needed). II is false: players must be sufficiently <i>patient</i>. III is false: it is easier to sustain when the interest rate is sufficiently <i>low</i>. All three are false.`,{ramos:21});
E('m4-22',13,2,`Consider the following principal-agent problem in which the principal (owner of a firm) can rent her capital to the agent (worker). If the worker rents the capital from the owner, then the worker can produce q = 2h units of output, where h is the number of hours worked. The worker's cost of effort is c = h². Output q can be sold for a price p = 5 per unit. In this sequential game, the owner chooses a rental price r and makes a take-it-or-leave-it offer to the worker. If the worker accepts the offer, he pays r to the owner and he can choose how many hours to work. The worker keeps all revenue (the worker becomes the residual claimant). If the worker rejects the offer, owner and worker attain a zero payoff. The worker wants to maximize his utility, which equals his income minus his costs (rental price and effort). The owner wants to maximize her income (the rent payment she receives from the worker). In equilibrium, the principal offers the rental price:`,['r = 4','r = 18','r = 9','r = 25','r = 16'],'D',
 `If he rents, the worker maximizes 5(2h) − h² − r. FOC: 10 − 2h = 0, so h = 5, and before the rent his utility is 50 − 25 = 25. His outside option is 0, so the owner charges the most he will pay: <b>r = 25</b>. The efficient hours are chosen and the owner captures all the surplus.`,{ramos:22});
E('m4-23',13,3,`A risk-neutral worker can choose low or high effort. The manager cannot observe the worker's effort; she only observes revenue, which can be low ($300) or high ($500). If the worker chooses low effort, his effort cost is $0 and revenue is high with probability 20%. If he chooses high effort, his effort cost is $16 and revenue is high with probability 60%. The worker's outside option pays $40. The firm pays the worker w<sub>L</sub> if revenue is low and w<sub>H</sub> if revenue is high. The worker's utility equals his expected payment minus his effort cost. The cheapest contract that the worker accepts and that leads him to choose high effort is ______.`,['w<sub>L</sub> = 40 and w<sub>H</sub> = 80','w<sub>L</sub> = 32 and w<sub>H</sub> = 72','w<sub>L</sub> = 0 and w<sub>H</sub> = 40','w<sub>L</sub> = 56 and w<sub>H</sub> = 56','w<sub>L</sub> = 24 and w<sub>H</sub> = 64'],'B',
 `Incentive compatibility: 0.6w<sub>H</sub> + 0.4w<sub>L</sub> − 16 ≥ 0.2w<sub>H</sub> + 0.8w<sub>L</sub>, so 0.4(w<sub>H</sub> − w<sub>L</sub>) ≥ 16 and w<sub>H</sub> − w<sub>L</sub> ≥ 40. Participation: 0.6w<sub>H</sub> + 0.4w<sub>L</sub> − 16 ≥ 40. The cheapest contract makes both bind: w<sub>H</sub> = w<sub>L</sub> + 40, so w<sub>L</sub> + 24 = 56 and <b>w<sub>L</sub> = 32, w<sub>H</sub> = 72</b>.`,{ramos:23});
E('m4-24',13,3,`A risk-neutral worker can choose low or high effort. The manager only observes revenue, which can be low ($400) or high ($800). If the worker chooses low effort, his effort cost is $0 and revenue is high with probability 25%. If he chooses high effort, his effort cost is $30 and revenue is high with probability 75%. The worker's outside option is $0. The firm pays the worker w<sub>L</sub> if revenue is low and w<sub>H</sub> if revenue is high. By law, payments can never be negative (w<sub>L</sub> ≥ 0 and w<sub>H</sub> ≥ 0). The worker's utility equals his expected payment minus his effort cost. Under the cheapest contract that leads the worker to choose high effort, the worker's expected utility is ______.`,['$60','$45','$30','$15','$0'],'D',
 `Incentive compatibility: 0.75w<sub>H</sub> + 0.25w<sub>L</sub> − 30 ≥ 0.25w<sub>H</sub> + 0.75w<sub>L</sub>, so 0.5(w<sub>H</sub> − w<sub>L</sub>) ≥ 30 and w<sub>H</sub> − w<sub>L</sub> ≥ 60. The cheapest contract sets w<sub>L</sub> = 0 (limited liability) and w<sub>H</sub> = 60. Expected pay = 0.75(60) = 45, so utility = 45 − 30 = <b>$15</b>. The worker keeps a rent because he cannot be paid less than zero.`,{ramos:24});

/* --- Incentives and Contracts lecture and review session --- */
Z('ic-1',13,2,`An owner sells output at $12 per unit. Production is q = 4h (h = hours worked), so revenue is 12 × 4h = 48h. The worker's cost of effort is 3h². Benchmark: the owner works alone and chooses h to maximize her surplus 48h − 3h². How many hours does she work, and what is the surplus?`,'h = 8 and surplus = 192',['h = 4 and surplus = 96','h = 8 and surplus = 384','h = 16 and surplus = 192'],`Marginal benefit = marginal cost: 48 = 6h, so h = 8. Surplus = 48(8) − 3(8)² = 384 − 192 = <b>192</b>.`);
Z('ic-2',13,3,`Same firm (revenue 48h, worker's effort cost 3h²), but now the owner and the worker are different people. The owner chooses an hourly wage w; the worker then chooses hours h to maximize wh − 3h². The owner's profit is 48h − wh. What wage does the owner choose, and how many hours does the worker work?`,'w = 24 and h = 4',['w = 48 and h = 8','w = 24 and h = 8','w = 12 and h = 2'],`Worker: w − 6h = 0, so h = w/6. Owner: profit = (48 − w)(w/6) = 8w − w²/6. FOC: 8 − w/3 = 0, so <b>w = 24</b> and h = 4.`);
Z('ic-3',13,3,`With the hourly wage w = 24 and h = 4, the owner earns (48 − 24)(4) = 96 and the worker earns 24(4) − 3(4)² = 48. With the efficient wage w = 48 the worker works 8 hours, the owner earns 0 and the worker 192. Why does the owner choose w = 24?`,'She gives up a bigger pie (144 instead of 192) in order to keep a bigger slice (96 instead of 0)',['It maximizes total surplus','The worker refuses to work more than 4 hours','The owner cannot observe the worker\'s hours'],`The contract affects both the size of the surplus and how it is split. With w = 24 total surplus is 144, below 192, but the owner's share rises from 0 to 96.`);
Z('ic-4',13,2,`The owner rents her firm to the worker for a fixed amount R, and the worker keeps all the revenue (revenue 48h, effort cost 3h²). If the worker refuses he gets $0. What is the highest rent R he will accept?`,'$192',['$96','$144','$384'],`The worker maximizes 48h − 3h² − R, so 48 = 6h and h = 8: efficient. His payoff before the rent is 48(8) − 3(8)² = 192, so he accepts any R ≤ <b>$192</b>. The owner keeps the whole surplus, like a two-part tariff.`);
E('ic-5',13,3,`A salesperson can choose low effort (sales $60, cost $0) or high effort (sales $100, cost $10). His outside option is $85. The firm pays w<sub>H</sub> if sales are $100 and w<sub>L</sub> if sales are $60, and wants high effort. Which contract should the firm offer?`,['w<sub>H</sub> = 95, w<sub>L</sub> = 85','w<sub>H</sub> = 90, w<sub>L</sub> = 90','w<sub>H</sub> = 100, w<sub>L</sub> = 95','w<sub>H</sub> = 85, w<sub>L</sub> = 75','w<sub>H</sub> = 95, w<sub>L</sub> = 95'],'A',
 `Incentive: w<sub>H</sub> − 10 ≥ w<sub>L</sub>, so w<sub>H</sub> − w<sub>L</sub> ≥ 10. Participation: w<sub>H</sub> − 10 ≥ 85, so w<sub>H</sub> ≥ 95. The cheapest contract sets both: <b>w<sub>H</sub> = 95, w<sub>L</sub> = 85</b>. Profit = 100 − 95 = $5 and the worker gets exactly his outside option.`);
E('ic-6',13,2,`Same salesperson (outside option $85, effort costs $10, sales $100 with high effort and $60 with low effort). The firm offers w<sub>H</sub> = $100 if sales are $100 and w<sub>L</sub> = $95 if sales are $60. Which constraints hold?`,['Both hold','Participation only','Incentive compatibility only','Neither','The salesperson will not sign and will not work'],'B',
 `High effort: 100 − 10 = 90 ≥ 85, so he signs (participation holds). Low effort: 95 &gt; 90, so he shirks (incentive compatibility fails). Incentives come from the <b>gap</b> w<sub>H</sub> − w<sub>L</sub> ≥ 10, not from the level of pay.`);
E('ic-7',13,3,`Revenue is $10,000 or $20,000 (50% each) with low effort (cost $0) and $20,000 or $30,000 (50% each) with high effort (cost $2,500). The outside option is $6,000, and the firm and worker are risk neutral. The worker gets a share b of revenue. The firm offers 30%. Is the contract incentive compatible, and does it satisfy participation?`,['Both','Incentive compatible only','Participation only','Neither','It depends on the firm\'s profit'],'B',
 `Low effort: 0.3 × 15,000 = 4,500. High effort: 0.3 × 25,000 − 2,500 = 5,000. Since 5,000 &gt; 4,500 he works hard (IC holds). But 5,000 &lt; 6,000, so he does not sign (participation fails).`);
E('ic-8',13,3,`Same revenue-sharing setup (low effort: $10,000 or $20,000, cost $0; high effort: $20,000 or $30,000, cost $2,500; outside option $6,000). What is the smallest share b that gets high effort AND a signature?`,['25%','30%','34%','40%','50%'],'C',
 `Incentives: 25,000b − 2,500 ≥ 15,000b, so b ≥ 0.25. Participation: 25,000b − 2,500 ≥ 6,000, so b ≥ 0.34. Both must hold, so <b>34%</b>. The firm's expected profit is 0.66 × 25,000 = $16,500.`);
Z('ic-9',13,3,`A risk-averse salesperson has utility √wage − cost of effort. Low effort gives sales of $10 for sure (cost 0). High effort gives sales of $20 or $10 with 50% each (cost 1). His outside option is $1 for sure (utility 1). If the firm could see effort, it would pay $4 for sure. If effort is hidden, the cheapest contract that gets high effort is w<sub>H</sub> = $9 if sales are $20 and w<sub>L</sub> = $1 if sales are $10. What is the extra $1 of expected pay ($5 versus $4) paying for?`,'The risk the worker now bears: a risk premium',['The worker\'s higher effort','A bonus that makes the worker better off','Nothing: the firm is wasting it'],`The worker's utility is 1 in both cases. In the hidden-effort case, incentives force risk onto a risk-averse worker, and that risk costs money. Firm: 15 − 5 = 10 instead of 15 − 4 = 11. Total surplus falls from 12 to 11.`);
Z('ic-10',13,3,`Risk-averse worker with utility √wage − cost of effort. Hidden effort: the incentive and participation constraints are √w<sub>H</sub> − √w<sub>L</sub> ≥ 2 and √w<sub>H</sub> + √w<sub>L</sub> ≥ 4. The cheapest contract makes both bind. What are w<sub>H</sub> and w<sub>L</sub>?`,'w<sub>H</sub> = 9 and w<sub>L</sub> = 1',['w<sub>H</sub> = 4 and w<sub>L</sub> = 4','w<sub>H</sub> = 16 and w<sub>L</sub> = 4','w<sub>H</sub> = 6 and w<sub>L</sub> = 2'],`Add the two equations: 2√w<sub>H</sub> = 6, so √w<sub>H</sub> = 3 and w<sub>H</sub> = 9. Then √w<sub>L</sub> = 1 and w<sub>L</sub> = 1. Expected pay = 0.5(9) + 0.5(1) = 5.`);
E('ic-11',13,3,`A risk-neutral worker can choose low effort (cost $0; revenue is $500 with probability 20%, else $300) or high effort (cost $10; revenue is $500 with probability 40%). His outside option is $0 and pay can never be below $0. The firm wants high effort. What is the cheapest contract?`,['w<sub>L</sub> = −10, w<sub>H</sub> = 40','w<sub>L</sub> = 0, w<sub>H</sub> = 50','w<sub>L</sub> = 0, w<sub>H</sub> = 25','w<sub>L</sub> = 10, w<sub>H</sub> = 40','w<sub>L</sub> = 0, w<sub>H</sub> = 40'],'B',
 `Incentives: 0.4w<sub>H</sub> + 0.6w<sub>L</sub> − 10 ≥ 0.2w<sub>H</sub> + 0.8w<sub>L</sub>, so w<sub>H</sub> − w<sub>L</sub> ≥ 50. Without a floor the cheapest is w<sub>L</sub> = −10, w<sub>H</sub> = 40 (the worker pays the firm $10 after bad news), but pay cannot be negative. With the floor w<sub>L</sub> = 0 and <b>w<sub>H</sub> = 50</b>. Expected pay 0.4 × 50 = 20, so the worker gets a $10 rent above his outside option.`);
Z('ic-12',13,3,`In the bonus-with-a-floor example, incentives need w<sub>H</sub> − w<sub>L</sub> ≥ 50, effort costs $10, and pay can never be below $0. The cheapest contract is w<sub>L</sub> = 0, w<sub>H</sub> = 50, so the worker keeps a $10 rent. Why doesn't the firm lower w<sub>H</sub> to take that rent away?`,'Incentives need w<sub>H</sub> − w<sub>L</sub> ≥ 50, and w<sub>L</sub> cannot go below $0',['Lowering w<sub>H</sub> would violate participation','The worker is risk averse and needs a risk premium','The firm wants to be fair to the worker'],`When you cannot punish, you must reward: with the floor the gap of 50 can only come from raising w<sub>H</sub>, and the reward leaves the worker a rent. Without the floor (w<sub>L</sub> = −10, w<sub>H</sub> = 40) he gets exactly his outside option.`);
Z('ic-13',13,2,`If renting the firm to the worker is efficient, why isn't everyone an entrepreneur?`,'Most workers dislike risk, and most workers cannot pay the rent upfront (limited liability)',['Renting the firm destroys incentives','Owners never rent their capital','Entrepreneurs always earn less than employees'],`The two problems with renting the firm are <b>risk</b> (less risk-averse people become entrepreneurs) and <b>limited liability</b> (renting needs $192 upfront, and people without funds are excluded). The owner then falls back on the hourly wage and total surplus drops from 192 to 144, a $48 loss.`);
