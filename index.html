<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chalet 351</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a mountain lodge. Hanging wooden sign over a trail map; every quiz is a run down the slope. */
/* Palette follows Chalet 113: a mountain lodge in the blue hour. Accent blue, sign-blue headers, snowy blue-white hero. */
:root{
  --bg:#e8f1fc; --bg2:#f5f9ff; --panel:#ffffff; --panel2:#edf3fb; --line:#c3d6ee;
  --fg:#0e2240; --muted:#4e6280;
  --ember:#1f6fe0; --ember-ink:#ffffff; --ice:#0f87c9; --pine:#127a55; --berry:#c3304a; --gold:#946400;
  --wood:#1c4180; --wood2:#2f64b8; --wood-ink:#eaf3ff;
  --run1:#1f9d6b; --run2:#1f6fe0; --run3:#0e2240;
  --hero1:#9cc4ef; --hero2:#cfe3f8; --hero3:#eef6fd; --hero-ink:#0e2240;
  --m1:#6fa3dc; --m2:#4a82c6; --m3:#2d62a8; --snowcap:#ffffff;
  --shadow:0 10px 28px rgba(20,50,100,.16); --snow:rgba(255,255,255,.95);
  --disp:'Rozha One','Georgia',serif; --body:'Figtree','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07111e; --bg2:#0b1a2d; --panel:#11253f; --panel2:#193152; --line:#2a4a7c;
    --fg:#e8f2ff; --muted:#9db5d6;
    --ember:#4da3ff; --ember-ink:#04152b; --ice:#8fd8ff; --pine:#41d3a2; --berry:#ff7084; --gold:#ffd166;
    --wood:#1e4382; --wood2:#336cc4; --wood-ink:#eaf3ff;
    --run1:#41d3a2; --run2:#4da3ff; --run3:#e8f2ff;
    --hero1:#0d2a52; --hero2:#16407a; --hero3:#2a5c9f; --hero-ink:#eaf4ff;
    --m1:#2c5f9e; --m2:#1f4a82; --m3:#143562; --snowcap:#dcecff;
    --shadow:0 10px 30px rgba(0,0,0,.45); --snow:rgba(220,236,255,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07111e; --bg2:#0b1a2d; --panel:#11253f; --panel2:#193152; --line:#2a4a7c;
  --fg:#e8f2ff; --muted:#9db5d6;
  --ember:#4da3ff; --ember-ink:#04152b; --ice:#8fd8ff; --pine:#41d3a2; --berry:#ff7084; --gold:#ffd166;
  --wood:#1e4382; --wood2:#336cc4; --wood-ink:#eaf3ff;
  --run1:#41d3a2; --run2:#4da3ff; --run3:#e8f2ff;
  --hero1:#0d2a52; --hero2:#16407a; --hero3:#2a5c9f; --hero-ink:#eaf4ff;
  --m1:#2c5f9e; --m2:#1f4a82; --m3:#143562; --snowcap:#dcecff;
  --shadow:0 10px 30px rgba(0,0,0,.45); --snow:rgba(220,236,255,.9); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px;line-height:1.15}
.mono{font-family:var(--mono)}
/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .sign{background:linear-gradient(180deg,var(--wood2),var(--wood));color:var(--wood-ink);font-family:var(--disp);font-size:20px;padding:6px 14px 7px;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.3);position:relative}
.brand .sign::before,.brand .sign::after{content:"";position:absolute;top:-8px;width:2px;height:8px;background:var(--muted)}
.brand .sign::before{left:14px}.brand .sign::after{right:14px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.nbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.nbtn:hover{border-color:var(--ember)}
/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);color:var(--hero-ink);padding:30px 22px 140px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(34px,6.2vw,60px);line-height:1.02;max-width:12ch}
.hero p{max-width:46ch;margin:12px 0 0;opacity:.92}
.hero .kick{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:10px}
.hero svg.mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:130px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:2}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--ember);color:var(--ember-ink);box-shadow:0 3px 0 rgba(0,20,60,.35)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sec{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.sec-h small{color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.trail{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;position:relative;transition:transform .15s,border-color .15s}
.trail:hover{transform:translateY(-3px);border-color:var(--ember)}
.trail .marker{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-family:var(--disp);font-size:19px;color:#fff;background:linear-gradient(180deg,var(--wood2),var(--wood));box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.trail h3{font-size:22px}
.trail .wk{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.trail p{margin:0;color:var(--muted);font-size:14px}
.cable{height:8px;border-radius:99px;background:var(--panel2);position:relative;overflow:visible}
.cable i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pine),var(--ice))}
.cable em{position:absolute;top:-6px;width:16px;height:16px;border-radius:4px;background:var(--fg);transform:translateX(-50%) rotate(45deg);box-shadow:0 2px 0 rgba(0,20,60,.35)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.special{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--ember)}
.tile h3{font-size:20px}
.tile p{margin:0;font-size:14px;color:var(--muted)}
.tile.fire{background:linear-gradient(160deg,var(--wood2),var(--wood));color:var(--wood-ink);border-color:transparent}
.tile.fire p{color:inherit;opacity:.85}
.tile.ice{background:linear-gradient(160deg,var(--wood2),var(--wood));color:var(--wood-ink);border-color:transparent}
.tile.ice p{color:inherit;opacity:.85}
.cold18{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:8px}
.cold18 span{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.cold18 span.on{background:#eaf3ff;color:#1c4180;box-shadow:none;font-weight:600}
/* chapter page */
.crumb{display:flex;gap:8px;align-items:center;margin:6px 0 14px;color:var(--muted);font-size:14px}
.crumb button{background:none;border:0;color:var(--ice);padding:0}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead h1{font-size:clamp(28px,5vw,44px)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fchip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ember);color:var(--ember-ink);border-color:var(--ember);font-weight:600}
.qlist{display:grid;gap:8px;margin-top:10px}
.qrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;min-width:0}
.qrow:hover{border-color:var(--ember)}
.qrow .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.dot.l1{background:var(--run1);border-radius:50%}.dot.l2{background:var(--run2);border-radius:3px}.dot.l3{background:var(--run3);transform:rotate(45deg) scale(.85);box-shadow:0 0 0 1.5px var(--muted)}
.st{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.st.cold{color:var(--ice)}.st.ok{color:var(--pine)}.st.bad{color:var(--berry)}
/* quiz */
.qwrap{display:grid;gap:14px;margin-top:6px}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{flex:1;min-width:140px;height:10px;background:var(--panel2);border-radius:99px;position:relative}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--run1),var(--ice))}
.prog em{position:absolute;top:-8px;width:24px;height:24px;margin-left:-12px;font-style:normal;text-align:center;line-height:24px;font-size:16px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.run{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.tag.ramos{color:var(--gold);border-color:var(--gold)}
.qtext{font-size:17px;max-width:68ch}
.qtext p{margin:0 0 10px}
.given{border-left:3px solid var(--ice);background:var(--panel2);padding:8px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:15px;color:var(--muted)}
.eq{font-family:var(--mono);font-size:15px;background:var(--panel2);border-radius:10px;padding:8px 12px;margin:8px 0;display:block;overflow-x:auto}
.fig{margin:14px 0;overflow-x:auto}
svg.plot{width:100%;max-width:520px;height:auto;display:block}
svg .ax{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;fill:none}
svg .ln{fill:none;stroke-width:2.4;stroke-linecap:round}
svg .dem{stroke:var(--ice)}svg .mr{stroke:var(--pine)}svg .mc{stroke:var(--ember)}svg .ac{stroke:var(--gold)}svg .sup{stroke:var(--ember)}
svg text{fill:var(--fg);font-family:var(--mono);font-size:12px}
svg text.lb{font-size:13px;font-weight:600}
svg .rg{fill:var(--ice);opacity:.08;transition:opacity .3s}
svg .rg.on{opacity:.55;fill:var(--ember)}
svg .rg.off{fill:var(--ice);opacity:.15}
svg text.rt{font-size:15px;font-weight:600}
svg .ed{stroke:var(--muted);stroke-width:2.2;fill:none}svg .ed.spe{stroke:var(--ember);stroke-width:5}
svg text.el{font-size:13px;font-weight:600;fill:var(--ice)}svg text.pay{font-size:14px;font-weight:600}
svg.tree{margin:0 auto}svg.tree text.lb{font-size:17px;paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}svg.tree text.el,svg.tree text.pay{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}svg.tree text.el{font-size:17px}svg.tree text.pay{font-size:18px}
svg.big text{font-size:24px}svg.big text.lb{font-size:27px}svg.big .ln{stroke-width:5}svg.big .ax{stroke-width:3}svg.big .gd{stroke-width:2}
svg .ndl{fill:var(--ember);stroke:none}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.opts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--ember);transform:translateX(3px)}
.opt .L{font-family:var(--mono);font-weight:600;width:26px;height:26px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;border:1px solid var(--line)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 14%,var(--panel2))}
.opt.good{border-color:var(--pine);background:color-mix(in srgb,var(--pine) 22%,var(--panel2))}
.opt.good .L{background:var(--pine);color:#fff;border-color:var(--pine)}
.opt.bad{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 20%,var(--panel2))}
.opt.bad .L{background:var(--berry);color:#fff;border-color:var(--berry)}
.opt.gone{opacity:.35;text-decoration:line-through}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.fb h4{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:20px}
.fb.good h4{color:var(--pine)}.fb.bad h4{color:var(--berry)}
.fb .pts{font-family:var(--mono);font-size:13px;color:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.spc{flex:1}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:6px}
.navgrid button{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:13px;position:relative}
.navgrid button.ans{background:color-mix(in srgb,var(--ice) 28%,var(--panel));border-color:var(--ice)}
.navgrid button.cur{outline:2px solid var(--ember)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--ember)}
.navgrid button.g{background:color-mix(in srgb,var(--pine) 40%,var(--panel));border-color:var(--pine)}
.navgrid button.b{background:color-mix(in srgb,var(--berry) 38%,var(--panel));border-color:var(--berry)}
/* matrices */
.pmw{overflow-x:auto}
table.pm{border-collapse:separate;border-spacing:0;margin:6px 0;font-family:var(--mono)}
table.pm th{font-weight:500;color:var(--muted);padding:4px 10px;font-size:13px}
table.pm td{border:1.5px solid var(--line);padding:10px 14px;text-align:center;min-width:76px;font-size:15px;background:var(--panel2)}
table.pm td i{font-style:normal;padding:2px 6px;border-radius:50%;display:inline-block;min-width:26px}
table.pm td i.b{margin-left:2px}
table.pm td.ne{background:color-mix(in srgb,var(--pine) 25%,var(--panel2))}
table.pm td i.br1{box-shadow:0 0 0 2px var(--berry)}
table.pm td i.br2{box-shadow:0 0 0 2px var(--ice);border-radius:6px}
.pm-cap{font-size:12px;color:var(--muted)}
.pm-p1{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--muted);font-size:13px;padding:0 6px!important}
/* results */
.score{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--disp);font-size:clamp(48px,10vw,84px);line-height:1}
.bars{display:grid;gap:10px;margin:14px 0}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ice)}
details.rv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-top:8px}
details.rv summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .in{padding:4px 14px 14px;border-top:1px solid var(--line)}
/* library */
.lib{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.card ol,.card ul{margin:0;padding-left:20px;font-size:15px}
.card li{margin:4px 0}
.fx{font-family:var(--mono);font-size:14px;background:var(--panel2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--wood);color:var(--wood-ink);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:50;font-weight:600}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
.float{position:absolute;right:20px;top:14px;font-family:var(--mono);font-weight:600;color:var(--gold);animation:fl 1.1s ease forwards;pointer-events:none}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@media (max-width:560px){
  .qcard{padding:16px}.bar{grid-template-columns:84px 1fr 50px}
  .hero{padding:24px 16px 130px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <button class="brand" id="home" aria-label="Back to the lobby"><span class="sign">Chalet 351</span></button>
    <span class="spacer"></span>
    <span class="chip" title="Points earned. One point is one meter climbed."><span aria-hidden="true">▲</span><b id="pts">0</b> m · <span id="rank">Snow Bunny</span></span>
    <span class="chip" title="Current streak of correct answers"><span aria-hidden="true">🔥</span><b id="stk">0</b></span>
    <button class="nbtn" id="libbtn">Method cards</button>
    <button class="nbtn" id="theme" aria-label="Switch between night and day">Day / Night</button>
  </div>
  <main id="app"></main>
</div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const fmt=n=>n.toLocaleString('en-US');
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function shuf(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET='ABCDE';
/* ---------- persistence ---------- */
const KEY='chalet351_m4_v1';
let S={pts:0,best:0,stats:{},mock:[],theme:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let streak=0;
const RANKS=[[0,'Snow Bunny'],[250,'Piste Regular'],[700,'Off-Piste'],[1400,'Alpine Guide'],[2400,'Summit Master']];

function plot(o){
  const W=o.w||440,H=o.h||300,L=46,R=16,T=14,B=34,pw=W-L-R,ph=H-T-B;
  const X=x=>L+x/o.xmax*pw,Y=y=>T+ph-y/o.ymax*ph;
  let s=`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||'Graph'}">`;
  s+=`<path class="ax" d="M${L} ${T-4}V${T+ph}H${W-R+4}"/>`;
  (o.guides||[]).forEach(g=>{s+=`<path class="gd" d="M${X(g[0])} ${Y(g[1])}L${X(g[2])} ${Y(g[3])}"/>`});
  (o.lines||[]).forEach(l=>{
    s+=`<path class="ln ${l.c}" d="${l.p.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}"/>`;
    if(l.lab){const q=l.at;s+=`<text class="lb" x="${X(q[0])+(l.dx||6)}" y="${Y(q[1])+(l.dy||-4)}">${l.lab}</text>`}
  });
  (o.xt||[]).forEach(v=>{s+=`<text x="${X(v)}" y="${T+ph+17}" text-anchor="middle">${v}</text>`});
  (o.yt||[]).forEach(v=>{s+=`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
  s+=`<text class="lb" x="${L-6}" y="${T-2}" text-anchor="end">${o.yl||'P'}</text><text class="lb" x="${W-R}" y="${T+ph+30}" text-anchor="end">${o.xl||'Q'}</text>`;
  return s+'</svg>';
}

/* game trees: N(player, [[edgeLabel, child], ...]); lf(p1payoff, p2payoff) is a leaf */
const lf=(a,b)=>({pay:[a,b]});
const N=(p,kids)=>({p,kids});
const n2=(...ls)=>N(2,['L₂','C₂','R₂'].slice(0,ls.length).map((l,i)=>[l,lf(...ls[i])]));
function tree(root,o={}){return {t:'tree',root,...o}}
function layoutTree(root){
  let leaves=0,maxd=0;
  (function walk(n,d,id){n.d=d;n.id=id;maxd=Math.max(maxd,d);
    if(n.pay){n.xi=leaves++;return}
    n.kids.forEach((k,i)=>walk(k[1],d+1,id+'.'+i));
    n.xi=n.kids.reduce((s,k)=>s+k[1].xi,0)/n.kids.length;})(root,0,'r');
  return {leaves,maxd};
}
function solveTree(n){
  if(n.pay)return n.pay;
  const vals=n.kids.map(k=>solveTree(k[1])),ix=n.p===1?0:1;
  let b=0;vals.forEach((v,i)=>{if(v[ix]>vals[b][ix])b=i});n.pick=b;return vals[b];
}
function renderTree(f){
  const root=f.root,{leaves,maxd}=layoutTree(root),sx=118,sy=104,W=Math.max(340,leaves*sx+40),H=maxd*sy+86;
  const X=n=>30+sx/2+n.xi*sx-(leaves>0?0:0),Y=n=>34+n.d*sy;
  let ed='',nd='';
  (function walk(n){
    if(n.pay){nd+=`<text x="${X(n)}" y="${Y(n)+22}" text-anchor="middle" class="pay">(${n.pay[0]}, ${n.pay[1]})</text>`;return}
    nd+=`<text x="${X(n)}" y="${Y(n)-10}" text-anchor="middle" class="lb">${f.names?f.names[n.p-1]:'Player '+n.p}</text><circle cx="${X(n)}" cy="${Y(n)}" r="4.5" class="ndl"/>`;
    n.kids.forEach((k,i)=>{const c=k[1],mx_=(X(n)+X(c))/2,my=(Y(n)+Y(c))/2;
      ed+=`<path class="ed" data-e="${n.id}:${i}" d="M${X(n)} ${Y(n)}L${X(c)} ${Y(c)}"/><text x="${mx_+(X(c)<X(n)?-14:X(c)>X(n)?14:12)}" y="${my-2}" text-anchor="middle" class="el">${k[0]}</text>`;
      walk(c);});
  })(root);
  return `<div class="fig"><svg class="plot tree" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W,940)}px" role="img" aria-label="Game tree">${ed}${nd}</svg><div class="note">${f.names?`The first number in each parenthesis is the ${f.names[0]}'s payoff, the second is the ${f.names[1]}'s.`:"The first number in each parenthesis is Player 1's payoff, the second is Player 2's."} After you answer, the highlighted branches show each player's best choice, found by backward induction.</div></div>`;
}
function revealTree(root,f){
  solveTree(f.root);
  (function walk(n){if(n.pay)return;const e=root.querySelector(`[data-e="${n.id}:${n.pick}"]`);if(e)e.classList.add('spe');n.kids.forEach(k=>walk(k[1]))})(f.root);
}

Z('hw11-6',11,3,`${SEQ} The payoff of Player 2 after (a, d) is x = 5. Find the subgame perfect equilibrium of this game. In equilibrium, Player 1 will obtain payoff`,'2',['1','3','5','6'],`With x = 5: after a, Player 2 picks d (5 &gt; 4 &gt; 2), so P1 gets 1. After b, Player 2 picks f (3), so P1 gets 2. P1 plays b: <b>2</b>. (If x = 2 instead, P2 would pick e after a, P1 would get 3 from a, and play a.)`,

Z('hw11-7',11,2,`${SEQ} Find the subgame perfect equilibrium of this game. In equilibrium, the payoff of player 1 is`,'7',['3','4','9','8'],`P2: after L₁ picks R₂ (9), P1 gets 3. After C₁ picks L₂ (6), P1 gets 4. After R₁ picks L₂ (3), P1 gets 7. P1 plays R₁: <b>7</b>.`,
 {fig:tree(N(1,[['L₁',n2([1,7],[2,8],[3,9])],['C₁',n2([4,6],[5,4],[6,5])],['R₁',n2([7,3],[8,2],[9,1])]]))});
Z('hw11-8',11,2,`The following payoff matrix represents a Battle of the Sexes game. Now suppose it is a sequential game: Player 1 plays first, and then Player 2 plays second, after observing the choice of Player 1. This game has how many subgame perfect equilibria?`,'One',['Two','Three','None','Infinitely many'],`If P1 plays U, P2 picks L (2 &gt; 1). If P1 plays D, P2 picks R (3 &gt; 0). P1 compares 3 (via U,L) and 2 (via D,R) and plays U. A <b>single SPE</b> with payoffs (3,2). The first mover gets her favorite outcome.`,
 {fig:mx(['U','D'],['L','R'],[['3,2','1,1'],['0,0','2,3']],{cap:false})});
Z('hw11-10a',11,2,`Consider the following game between Player 1 (choosing row) and Player 2 (choosing the column). If this game is a simultaneous move game, then, in the pure strategy Nash equilibrium, Player 1 receives a payoff`,'4',['3','9','10','8'],`Best responses: P1: L→D (4), C→U (0), R→D (10). P2: U→R (1), M→R (4), D→L (5). The only mutual best response is <b>(D, L)</b> with payoffs (4,5).`,
 {fig:mx(['U','M','D'],['L','C','R'],[['3,-3','0,0','9,1'],['1,1','-3,3','8,4'],['4,5','-5,-7','10,3']])});
Z('hw11-10b',11,2,`Now suppose the previous game (U: 3,−3 / 0,0 / 9,1; M: 1,1 / −3,3 / 8,4; D: 4,5 / −5,−7 / 10,3) is a sequential game, where Player 1 plays first and Player 2 plays after observing the choice of Player 1. In the SPE, the payoff of Player 1 will be`,'9',['4','8','10','3'],`P2 reacts: after U → R, after M → R, after D → L. P1 compares (U,R) = 9, (M,R) = 8, (D,L) = 4 and plays U: <b>9</b>, much better than the simultaneous 4. The first mover gains.`,
 {fig:mx(['U','M','D'],['L','C','R'],[['3,-3','0,0','9,1'],['1,1','-3,3','8,4'],['4,5','-5,-7','10,3']])});
E('b11-1',11,2,`Bargaining. Player 1 makes a take it or leave it offer: she can propose 1C, which gives (6,2) if Player 2 accepts, or E, which gives (4,4) if Player 2 accepts. If Player 2 rejects, both get (0,0). In the subgame perfect equilibrium, the payoffs are`,['(6,2)','(4,4)','(0,0)','(6,2) or (4,4), depending on Player 2','Player 1 plays a mixed strategy'],'A',
 `Player 2 accepts anything that gives her more than 0, so she accepts both offers. Player 1 therefore proposes the one she likes best, 1C, and gets <b>(6,2)</b>. The proposer with the take it or leave it offer takes almost everything.`,
 {fig:tree(N(1,[['1C',N(2,[['A',lf(6,2)],['R',lf(0,0)]])],['E',N(2,[['A',lf(4,4)],['R',lf(0,0)]])]]))});
E('b11-2',11,3,`Bargaining with a counteroffer. Player 1 proposes 1C (6,2) or E (4,4). If Player 2 rejects, she can make a counteroffer (E gives (2,2); 2C gives (1,3)) that Player 1 then accepts or rejects. The payoffs are cut in half in the second round. In the subgame perfect equilibrium, what offer does Player 1 make, and what are the payoffs?`,['She proposes 1C and the payoffs are (6,2)','She proposes E and the payoffs are (4,4)','She proposes 1C and the payoffs are (1,3)','She proposes E and the payoffs are (1,3)','She proposes E and the payoffs are (2,2)'],'B',
 `Backward induction. In the second round Player 1 accepts anything (anything beats 0), so Player 2 counteroffers 2C and gets 3 (not 2). After 1C, Player 2 compares accepting (2) with rejecting (3), so she rejects, and Player 1 ends with (1,3). After E, Player 2 compares accepting (4) with rejecting (3), so she accepts: (4,4). Player 1 prefers E (4 &gt; 1). <b>E, payoffs (4,4)</b>.`,
 {fig:tree(N(1,[['1C',N(2,[['A',lf(6,2)],['R',N(2,[['E',N(1,[['A',lf(2,2)],['R',lf(0,0)]])],['2C',N(1,[['A',lf(1,3)],['R',lf(0,0)]])]])]])],['E',N(2,[['A',lf(4,4)],['R',N(2,[['E',N(1,[['A',lf(2,2)],['R',lf(0,0)]])],['2C',N(1,[['A',lf(1,3)],['R',lf(0,0)]])]])]])]]))});
Z('p11-1',11,3,`Ten ferocious old pirates are dividing their plunder (100 gold coins). No single coin can be subdivided. Pirate 1 proposes a sharing rule. All ten pirates vote. If a majority (even a tie is enough) accepts, the division is carried out. Otherwise the first pirate is thrown overboard (worse than getting no gold) and P2 makes a proposal, and so on. Pirates perform backward induction, and whenever a pirate is indifferent about voting for or against a proposal he votes against. What does Pirate 1 propose in equilibrium?`,'P1 keeps 96, and P3, P5, P7 and P9 get 1 coin each',['P1 keeps 100','P1 keeps 91 and every other pirate gets 1','P1 keeps 96, and P2, P4, P6 and P8 get 1 coin each','P1 keeps 55 and P2 through P10 split the rest evenly'],`Work backward. With 2 pirates left, P9 keeps 100 (a tie passes). With 3 left, P8 needs one more vote: P10 gets 1. And so on, each proposer buys just enough votes from the pirates who would get 0 in the next round. With 10 pirates P1 needs 5 votes and buys P3, P5, P7, P9 with 1 coin each: <b>(96, 0, 1, 0, 1, 0, 1, 0, 1, 0)</b>.`);
Z('o11-1',11,1,`Backward induction is a method to solve a sequential game that consists of`,'starting at the last decision nodes and working back to the first, choosing the best action for the player who moves at each node',['starting at the first decision node and choosing the action with the highest payoff for Player 1','finding the strategy that is optimal against every strategy of the opponent in a payoff matrix','averaging the payoffs of all terminal nodes','randomizing the moves of each player so that nobody can be exploited'],`Start at the end of the tree, replace each last node with the mover's best choice, and repeat back to the root.`);
Z('o11-2',11,2,`In a sequential game, a Nash equilibrium that is <i>not</i> a subgame perfect equilibrium typically relies on`,'a threat that is not credible',['a dominant strategy','a mixed strategy','a payoff that is negative for both players','an action taken by the first mover'],`A subgame perfect equilibrium requires optimal play in every subgame. A Nash equilibrium that rests on a non-credible threat fails that test because the player would not carry out the threat if the node were reached.`);
Z('o11-3',11,2,`Entry game: an Entrant chooses Out (payoffs (0,10)) or In. If In, the Incumbent chooses Fight (−3,2) or Accommodate (4,5). The first number is the Entrant's payoff. In the SPE, the Entrant's payoff is`,'4',['0','−3','5','10'],`After In, the Incumbent compares Fight (2) with Accommodate (5) and accommodates. The Entrant compares Out (0) with In (4) and enters. SPE payoffs (4,5). The threat to fight is not credible.`,
 {fig:tree(N(1,[['Out',lf(0,10)],['In',N(2,[['Fight',lf(-3,2)],['Accommodate',lf(4,5)]])]]))});
Z('o11-4',11,2,`Stackelberg competition: compared with the Cournot equilibrium, the Stackelberg leader produces ______ and the follower produces ______.`,'more ; less',['less ; more','more ; more','less ; less','the same ; the same'],`By moving first and committing to a large quantity, the leader pushes the follower's best response down. Leader: more than Cournot. Follower: less. There is a first-mover advantage.`);
Z('o11-5',11,3,`Firm 1 (leader) and Firm 2 (follower) are Stackelberg competitors with C<sub>1</sub> = 10Q<sub>1</sub> and C<sub>2</sub> = 10Q<sub>2</sub>. The market demand is Q<sup>D</sup> = 100 − P. In the SPE, the price is`,'P = 32.5',['P = 40','P = 55','P = 30','P = 37.5'],`Follower: MR<sub>2</sub> = 100 − Q<sub>1</sub> − 2Q<sub>2</sub> = 10, so Q<sub>2</sub> = 45 − 0.5Q<sub>1</sub>. Leader: P = 55 − 0.5Q<sub>1</sub>, MR<sub>1</sub> = 55 − Q<sub>1</sub> = 10, so Q<sub>1</sub> = 45, Q<sub>2</sub> = 22.5. P = 100 − 67.5 = <b>32.5</b>. (Cournot would give 40.)`);
Z('o11-6',11,3,`A stage game is a Prisoner's Dilemma with payoffs: both Cooperate = 20 each; one deviates = 30 for the deviator and 0 for the other; both Not Cooperate = 10 each. The game is repeated infinitely, and players use the grim-trigger strategy. Cooperation is possible if the interest rate is`,'r ≤ 100%',['r ≤ 50%','r ≤ 25%','r ≥ 100%','r ≤ 200%'],`Cooperate: 20 + 20/r. Deviate: 30 + 10/r. Cooperate if 10/r ≥ 10, so <b>r ≤ 1 = 100%</b>.`);
Z('o11-7',11,1,`A game is played exactly 10 times with a Prisoner's Dilemma stage game. The only subgame perfect equilibrium is`,'both players choose Not Cooperate in every period',['both players Cooperate in the first 9 periods','both players alternate between Cooperate and Not Cooperate','both players Cooperate in every period if r is small','a mixed strategy in each period'],`In the last period Not Cooperate is dominant. Knowing that, there is no future to protect in period 9, so it unravels all the way back to period 1.`);

/* --- repeated games deck additions --- */
Z('rg-1',11,2,`Consider a stage game with a unique Nash equilibrium. If it is repeated a finite number of times, the repeated game has`,'a single subgame perfect equilibrium: play the stage-game Nash equilibrium in every period',['many equilibria, including full cooperation if r is low','a single SPE in which players cooperate until the last period','no subgame perfect equilibrium','a mixed strategy equilibrium in every period'],`By backward induction the last period is the stage game, so the unique NE is played. Then the period before has no future to protect, and so on back to period 1.`);
E('rg-2',11,2,`Consider the stage game below. How many pure strategy Nash equilibria does it have?`,['One: (b, B)','Two: (b, B) and (c, C)','Two: (a, A) and (b, B)','Three: (a, A), (b, B) and (c, C)','None'],'B',
 `Circle Player 1's best response in each column: A→b (7), B→b (4), C→c (2). Box Player 2's best response in each row: a→B (7), b→B (4), c→C (2). Cells with both: <b>(b,B) = (4,4) and (c,C) = (2,2)</b>. (a,A) pays 6,6 but each player gains by deviating, so it is not an equilibrium.`,{fig:mx(['a','b','c'],['A','B','C'],[['6,6','0,7','0,0'],['7,0','4,4','0,0'],['0,0','0,0','2,2']],{p1:'Player 1',p2:'Player 2'})});
E('rg-3',11,3,`The stage game below is repeated twice. Players agree to play (a, A) in round 1, then (b, B) in round 2 if nobody deviated and (c, C) if someone did. Can (a, A) be played in round 1 of an SPE?`,['Yes: promise (b, B) in round 2, and threaten (c, C) after a deviation','No: the gain from deviating in round 1 is larger than the punishment in round 2','No: in a finitely repeated game, players can only play Nash equilibria of the stage game','Yes: (a, A) gives both players the highest payoffs','Yes, but only if the interest rate is above 100%'],'A',
 `Follow the agreement: 6 + 4 = 10. Deviate in round 1 (b against A): 7 + 2 = 9. Since 10 &gt; 9, deviating does not pay. Both round-2 outcomes are Nash equilibria of the stage game, so the threat is <b>credible</b>. Having <i>multiple</i> stage-game equilibria is what makes cooperation possible in a finite game.`,{fig:mx(['a','b','c'],['A','B','C'],[['6,6','0,7','0,0'],['7,0','4,4','0,0'],['0,0','0,0','2,2']],{p1:'Player 1',p2:'Player 2'})});
Z('rg-4',11,3,`Same stage game and agreement as the previous question, but the game is now repeated <b>three</b> times (play (a, A) in round 1; afterwards (b, B) if nobody deviated and (c, C) if someone did). Compare following the agreement with deviating in round 1.`,'Follow: 6 + 4 + 4 = 14. Deviate: 7 + 2 + 2 = 11. Cooperation is even easier',['Follow: 6 + 4 + 4 = 14. Deviate: 7 + 4 + 4 = 15. Cooperation breaks down','Follow: 6 + 4 = 10. Deviate: 7 + 2 = 9. The extra round does not matter','Follow: 6 + 2 + 2 = 10. Deviate: 7 + 4 + 4 = 15. Cooperation breaks down'],`The gain from deviating today is 7 − 6 = 1. The loss in each later round is 4 − 2 = 2. More rounds mean a longer punishment, so cooperation is <b>easier</b> to sustain.`,{fig:mx(['a','b','c'],['A','B','C'],[['6,6','0,7','0,0'],['7,0','4,4','0,0'],['0,0','0,0','2,2']],{p1:'Player 1',p2:'Player 2'})});
Z('rg-5',11,2,`In the stage game below, a loss of 4 − 2 = 2 in each later round and a gain of 7 − 6 = 1 today means that the players have an incentive to follow the agreement as long as`,'the punishment lasts at least one later round',['the game is repeated infinitely','the interest rate is above 100%','the stage game has a dominant strategy','the stage game has a unique Nash equilibrium'],`One later round of punishment costs 2, which exceeds the 1 gained by deviating. So with at least one more round to play, deviating does not pay.`,{fig:mx(['a','b','c'],['A','B','C'],[['6,6','0,7','0,0'],['7,0','4,4','0,0'],['0,0','0,0','2,2']],{p1:'Player 1',p2:'Player 2'})});
E('opec-1',11,1,`Each OPEC member plays the following game. Country 1 chooses Collude or Increase Production; the other countries choose Collude or Increase Production. Payoffs (Country 1, Others): Collude/Collude = 4,4; Collude/Increase = 1,8; Increase/Collude = 8,1; Increase/Increase = 2,2. Is full collusion a Nash equilibrium if the game is played <b>once</b>?`,['Yes, because 4,4 is better for everybody','No: the only NE is (Increase Production, Increase Production)','Yes, if the other countries Collude','No: the only NE is (Collude, Collude)','There is no pure strategy NE'],'B',
 `Increase Production is dominant: 8 &gt; 4 against Collude and 2 &gt; 1 against Increase. The only NE is <b>(Increase, Increase)</b> = (2,2), worse for everyone than (4,4). A Prisoner's Dilemma.`,
 {fig:mx(['Collude','Increase Production'],['Collude','Increase Production'],[['4,4','1,8'],['8,1','2,2']],{p1:'Country 1',p2:'Other Countries'})});
E('opec-2',11,3,`Same OPEC game (Collude/Collude = 4,4; Increase against Collude = 8 for the deviator; Increase/Increase = 2,2). The other countries play the trigger strategy: collude until somebody deviates once; after that, everybody increases production forever. Compare Country 1's present value of colluding forever with deviating today. What is the highest interest rate at which collusion is possible?`,['r = 25%','r = 50%','r = 100%','r = 200%','r = 75%'],'B',
 `Collude forever: 4 + 4/r. Deviate: 8 + 2/r. Collude if 4 + 4/r ≥ 8 + 2/r, so 2/r ≥ 4 and <b>r ≤ 0.5 = 50%</b>.`);
Z('opec-3',11,3,`In a Prisoner's Dilemma stage game, both Collude = 5 each; deviating against a colluder gives the deviator 10; both Increase Production = 2 each. Players use the trigger strategy and the game is repeated infinitely. What is the highest interest rate at which collusion is possible?`,'r = 60%',['r = 40%','r = 100%','r = 150%','r = 30%'],`Collude: 5 + 5/r. Deviate: 10 + 2/r. Collude if 3/r ≥ 5, so <b>r ≤ 0.6</b>.`);
Z('opec-4',11,2,`The OPEC example reinterpreted as an uncertain ending: each leader has probability δ of staying in power next year, so the present value of colluding forever is 4 + δ4 + δ²4 + …. Defining δ = 1/(1 + r), what does the condition r ≤ 0.5 mean for δ?`,'δ ≥ 2/3, about 66%: leaders must be likely enough to stay in power',['δ ≤ 2/3: leaders must be unlikely to stay in power','δ ≥ 1/2: leaders must have even odds of staying','δ ≥ 0.9 only','The condition does not depend on δ'],`δ = 1/(1 + r), so r = (1 − δ)/δ. With r ≤ 1/2: δ ≥ 1/1.5 = <b>2/3 ≈ 66%</b>. Leaders with a high chance of staying in power (dictators, monarchies) are the ones who collude.`);
Z('opec-5',11,2,`If δ = 1/(1 + r) is the probability that a leader stays in power next year, which interest rate corresponds to δ = 0.8?`,'r = 25%',['r = 20%','r = 80%','r = 125%','r = 8%'],`r = (1 − δ)/δ = 0.2/0.8 = <b>0.25</b>.`);

/* --- dynamic games deck: Stackelberg walkthrough, pirates, 3x3 --- */
Z('sk-1',11,2,`Firm 1 and Firm 2 produce soybeans. The market demand is Q = 109 − p, and each firm has cost Cost = Q (so MC = 1). Firm 2 observes Q<sub>1</sub> and then chooses Q<sub>2</sub> to maximize π<sub>2</sub> = (109 − Q<sub>1</sub> − Q<sub>2</sub>)Q<sub>2</sub> − Q<sub>2</sub>. Firm 2's best response is`,'Q<sub>2</sub> = 54 − 0.5Q<sub>1</sub>',['Q<sub>2</sub> = 108 − Q<sub>1</sub>','Q<sub>2</sub> = 54 − Q<sub>1</sub>','Q<sub>2</sub> = 54.5 − 0.5Q<sub>1</sub>'],`π<sub>2</sub> = 108Q<sub>2</sub> − Q<sub>2</sub>² − Q<sub>1</sub>Q<sub>2</sub>. FOC: 108 − 2Q<sub>2</sub> − Q<sub>1</sub> = 0, so <b>Q<sub>2</sub> = 54 − 0.5Q<sub>1</sub></b>. The MC of 1 is why the intercept is 108 and not 109.`);
Z('sk-2',11,2,`Same market (Q = 109 − p, MC = 1 for both). Firm 2 responds with Q<sub>2</sub> = 54 − 0.5Q<sub>1</sub>. Firm 1 is the leader and anticipates this. In the SPE, Firm 1 produces`,'Q<sub>1</sub> = 54',['Q<sub>1</sub> = 36','Q<sub>1</sub> = 27','Q<sub>1</sub> = 108'],`Substitute the best response: π<sub>1</sub> = 108Q<sub>1</sub> − Q<sub>1</sub>² − Q<sub>1</sub>(54 − 0.5Q<sub>1</sub>) = 54Q<sub>1</sub> − 0.5Q<sub>1</sub>². FOC: 54 − Q<sub>1</sub> = 0, so <b>Q<sub>1</sub> = 54</b>. Then Q<sub>2</sub> = 27 and p = 109 − 81 = 28.`);
Z('sk-3',11,2,`Same market. In the SPE Q<sub>1</sub> = 54, Q<sub>2</sub> = 27 and the price is p = 28. Which firm earns the higher profit?`,'Firm 1, the leader: 1,458 versus 729',['Firm 2, the follower: 1,458 versus 729','They earn the same profit','Firm 2, the follower, because it sees Q<sub>1</sub> before choosing'],`Profit<sub>1</sub> = (28 − 1)(54) = 1,458. Profit<sub>2</sub> = (28 − 1)(27) = 729. <b>The leader has an advantage</b>, even though the follower has more information.`);
Z('sk-4',11,3,`In the market Q = 109 − p with MC = 1, a Cournot equilibrium has Q<sub>1</sub> = Q<sub>2</sub> = 36 and p = 37. Compared with the Stackelberg SPE (Q<sub>1</sub> = 54, Q<sub>2</sub> = 27, p = 28), the Stackelberg outcome has`,'higher total quantity and a lower price',['lower total quantity and a higher price','the same total quantity and a lower price','higher total quantity and a higher price'],`Stackelberg total = 81 versus Cournot 72, so the price falls from 37 to 28. The leader produces more than in Cournot (54 vs 36), the follower less (27 vs 36). Consumers gain.`);
Z('sk-5',11,2,`Why does the Stackelberg leader have an advantage? When Firm 1 raises Q<sub>1</sub>,`,'the price falls directly, but Firm 2 cuts Q<sub>2</sub> in response, which pushes the price back up',['both the price and Firm 2\'s output fall','Firm 2 increases Q<sub>2</sub> and the price rises','the price rises directly and Firm 2 raises Q<sub>2</sub> too'],`The follower's best response slopes down (Q<sub>2</sub> = 54 − 0.5Q<sub>1</sub>). By committing to a large Q<sub>1</sub>, the leader makes the follower back off: Q<sub>1</sub> ↑ → Q<sub>2</sub> ↓ → p ↑, partly offsetting the direct fall in p.`);
Z('sk-6',11,2,`Same market (Q = 109 − p, MC = 1, Firm 2 follower with best response Q<sub>2</sub> = 54 − 0.5Q<sub>1</sub>). Suppose the leader produced Q<sub>1</sub> = 60 instead of 54. Firm 2 would respond with Q<sub>2</sub> = ______ and the price would be ______.`,'Q<sub>2</sub> = 24 ; p = 25',['Q<sub>2</sub> = 27 ; p = 28','Q<sub>2</sub> = 30 ; p = 19','Q<sub>2</sub> = 24 ; p = 85'],`Q<sub>2</sub> = 54 − 0.5(60) = 24. Total = 84, so p = 109 − 84 = <b>25</b>. A larger Q<sub>1</sub> shrinks Q<sub>2</sub> but lowers the price.`);
Z('sk-7',11,3,`Firm 1 (leader) and Firm 2 (follower) are Stackelberg competitors with zero marginal cost. The inverse demand is P = 120 − Q<sub>1</sub> − Q<sub>2</sub>. In the SPE, the price is`,'P = 30',['P = 40','P = 60','P = 20'],`Follower: MR<sub>2</sub> = 120 − Q<sub>1</sub> − 2Q<sub>2</sub> = 0, so Q<sub>2</sub> = 60 − 0.5Q<sub>1</sub>. Leader: P = 60 − 0.5Q<sub>1</sub>, so MR<sub>1</sub> = 60 − Q<sub>1</sub> = 0 and Q<sub>1</sub> = 60, Q<sub>2</sub> = 30. P = 120 − 90 = <b>30</b>. (Profits 1,800 and 900.)`);
Z('p11-2',11,3,`Ten pirates divide 100 gold coins. In the SPE, if only two pirates are left (P9 and P10), P9 proposes the division`,'P9 keeps all 100 and P10 gets 0, and it passes because a tie is enough',['P9 keeps 99 and P10 gets 1','50 each','P9 gets 0 and P10 keeps 100'],`With two pirates, P9 votes for his own proposal, and a tie (1 of 2) is enough. So P9 keeps everything: (…, 100, 0). Backward induction starts here.`);
Z('p11-3',11,3,`In the pirates game, pirate 8 is proposing with three pirates left (P8, P9, P10). If P8 is rejected, P9 gets 100 and P10 gets 0. What does P8 propose, and who votes for it?`,'P8 keeps 99, P9 gets 0, P10 gets 1: P8 and P10 vote yes',['P8 keeps 100, P9 and P10 get 0','P8 keeps 99, P9 gets 1, P10 gets 0','P8 keeps 98, P9 gets 1, P10 gets 1'],`P8 needs 2 votes out of 3. P10 gets 0 if P8 is thrown overboard, so one coin beats that: P10 votes yes. P9 would get 100 if P8 fails, so he is not worth buying. <b>(…, 99, 0, 1)</b>. The pattern: each proposer buys votes from the pirates who would get nothing in the next round.`);
Z('p11-4',11,2,`In the 10-pirate game, how many coins does Pirate 2 get in Pirate 1's equilibrium proposal (96, 0, 1, 0, 1, 0, 1, 0, 1, 0)?`,'0 coins',['1 coin','2 coins','4 coins'],`P1 needs 5 votes (his own plus 4). He buys P3, P5, P7 and P9 with one coin each, because those pirates would get nothing if P1 were thrown overboard and P2 proposed. P2 gets <b>0</b>.`);
Z('g3-1',11,2,`Consider the following game. In the simultaneous move version, what is the payoff of Player 1 in the pure strategy Nash equilibrium?`,'8',['20','11','7'],`Circle P1's best responses: L→U (20), C→M (11), R→D (8). Box P2's best responses: U→R (4), M→L (11), D→R (7). Only <b>(D, R) = (8,7)</b> has both.`,{fig:mx(['U','M','D'],['L','C','R'],[['20,3','8,2','7,4'],['9,11','11,10','4,9'],['4,4','8,2','8,7']],{cap:false})});
Z('g3-2',11,3,`In the sequential version of this game (Player 1 plays first, Player 2 observes), Player 2's equilibrium strategy (her reaction after U, after M, after D) is`,'R after U, L after M, R after D',['L after U, C after M, R after D','R after U, C after M, R after D','L after U, L after M, L after D'],`P2's best reply to each P1 move: after U → R (4 &gt; 3 &gt; 2), after M → L (11 &gt; 10 &gt; 9), after D → R (7 &gt; 4 &gt; 2). With that, P1 compares 7, 9, 8 and plays M, so the SPE is <b>M, (R, L, R)</b> with payoffs (9, 11).`,{fig:mx(['U','M','D'],['L','C','R'],[['20,3','8,2','7,4'],['9,11','11,10','4,9'],['4,4','8,2','8,7']],{cap:false})});
Z('g3-3',11,3,`Same game, but Player 2 now moves first and Player 1 observes her choice. What is the SPE?`,'P2 plays C, and P1 responds M for payoffs (11, 10); P1 responds U after L and D after R',['P2 plays R and P1 responds D for payoffs (8, 7)','P2 plays L and P1 responds U for payoffs (20, 3)','P2 plays C and P1 responds U for payoffs (8, 2)'],`P1 responds with U after L (20), M after C (11), D after R (8), giving P2 3, 10 and 7. P2 picks C (10). SPE payoffs (11, 10). P1 earns 11 moving second versus 9 moving first, so <b>P1 prefers to move second</b>.`,{fig:mx(['U','M','D'],['L','C','R'],[['20,3','8,2','7,4'],['9,11','11,10','4,9'],['4,4','8,2','8,7']],{cap:false})});

/* ===== MIDTERM 4 REVIEW DECK, Chapter 11 (Prof. Ramos, exact wording) ===== */
E('m4-1',11,3,`Firm 1 and Firm 2 are Stackelberg competitors. Firm 1 is the leader and Firm 2 is the follower. They have different cost functions: <span class="eq">Firm 1: C<sub>1</sub> = 3Q<sub>1</sub><br>Firm 2: C<sub>2</sub> = 9Q<sub>2</sub>.</span> The market demand is <span class="eq">Q<sup>D</sup> = 189 − P.</span> Compute the equilibrium of this market. Define the market share of Firm 1 as <span class="eq">MS<sub>1</sub> = Q<sub>1</sub> / (Q<sub>1</sub> + Q<sub>2</sub>)</span> The market share of Firm 1 is approximately ______.`,
 ['MS<sub>1</sub> = 0.9','MS<sub>1</sub> = 0.4','MS<sub>1</sub> = 0.54','MS<sub>1</sub> = 0.75','MS<sub>1</sub> = 0.7'],'E',
 `P = 189 − Q<sub>1</sub> − Q<sub>2</sub>. Follower first: MR<sub>2</sub> = 189 − Q<sub>1</sub> − 2Q<sub>2</sub> = 9, so Q<sub>2</sub> = 90 − 0.5Q<sub>1</sub>. Leader: P = 99 − 0.5Q<sub>1</sub>, so MR<sub>1</sub> = 99 − Q<sub>1</sub> = 3 and Q<sub>1</sub> = 96. Then Q<sub>2</sub> = 90 − 48 = 42. MS<sub>1</sub> = 96/138 ≈ <b>0.70</b>.`,{ramos:1});
E('m4-2',11,2,`Consider the following sequential game. Player 1 (P1) plays first, and Player 2 (P2) plays after observing the choice of P1. Recall that the first number in each parenthesis is the payoff of P1, while the second is the payoff of P2.<br><br>Consider the following strategies:<br>I - P1 plays A, while P2 plays (D,F), that is, P2 plays D if P1 plays A and F if P1 plays B.<br>II - P1 plays B, while P2 plays (D,E), that is, P2 plays D if P1 plays A and E if P1 plays B.<br>III - P1 plays B, while P2 plays (D,F), that is, P2 plays D if P1 plays A and F if P1 plays B.<br><br>Regarding the Subgame Perfect Equilibrium (SPE) of this game, which is correct?`,
 ['II and III are SPE, I is not','III is SPE, I and II are not','II is SPE, I and III are not','I is SPE, II and III are not','All three options are a SPE.'],'C',
 `Backward induction: after A, P2 prefers D (8 &gt; 3). After B, P2 prefers E (6 &gt; 5). P1 then compares A → 6 and B → 8, and plays B. The SPE is <b>P1 plays B, P2 plays (D,E)</b>: statement II. Statements I and III both have P2 playing F after B, which is not a best response (5 &lt; 6), so they are not SPE.`,
 {ramos:2,fig:tree(N(1,[['A',N(2,[['C',lf(3,3)],['D',lf(6,8)]])],['B',N(2,[['E',lf(8,6)],['F',lf(5,5)]])]]))});
E('m4-3',11,2,`The following table contains the possible actions and payoffs of players 1 and 2. Suppose it is a sequential game. If Player 1 plays first, and Player 2 plays after observing the choice of Player 1, then the equilibrium (SPE) payoff of Player 1 will be`,['9','8','5','7','4'],'B',
 `Player 2's reaction: after U she picks C (4), so P1 gets 7. After M she picks C (9), so P1 gets 5. After D she picks R (7), so P1 gets 8. Player 1 compares 7, 5 and 8 and plays D: payoff <b>8</b>.`,
 {ramos:3,fig:mx(['U','M','D'],['L','C','R'],[['5,3','7,4','4,2'],['9,8','5,9','9,7'],['4,4','5,2','8,7']],{cap:false})});
E('m4-4',11,3,`The following table contains the possible actions and payoffs of players 1 and 2. Suppose it is a sequential game. If Player 2 plays first, and Player 1 plays after observing the choice of Player 2, then the equilibrium (SPE) payoff of Player 1 will be`,['1','3','2','5','4'],'C',
 `Now Player 1 reacts. After L he picks M (5), so P2 gets 6. After C he picks D (5), so P2 gets 6. After R he picks D (2), so P2 gets 7. Player 2 compares 6, 6 and 7 and plays R. Player 1 then plays D and gets <b>2</b>.`,
 {ramos:4,fig:mx(['U','M','D'],['L','C','R'],[['3,8','1,8','1,6'],['5,6','4,9','1,7'],['1,9','5,6','2,7']],{cap:false})});
E('m4-5',11,3,`Six ferocious old pirates are dividing their plunder (15 gold coins) before disbanding. No coin can be subdivided. Pirate number 1 (P1) suggests a sharing rule; for instance, (5, 0, 3, 0, 2, 5) means that P1 gets 5 coins, P2 gets 0 coins, P3 gets 3 coins, and so on. All pirates vote on the proposal. If a majority (even a tie is enough) accepts it, the division is carried out. If not, P1 is thrown overboard (which is worse than getting no gold), and P2 makes a proposal to the remaining pirates, and so on. The pirates use backward induction, and whenever a pirate is indifferent between voting for or against a proposal, he votes against it. In the subgame perfect equilibrium (SPE) of this game, the 15 coins are distributed as ______.`,
 ['(13, 1, 0, 1, 0, 0)','(12, 0, 1, 0, 1, 1)','(11, 0, 2, 0, 2, 0)','(15, 0, 0, 0, 0, 0)','(13, 0, 1, 0, 1, 0)'],'E',
 `Work backward. With 2 pirates left (P5, P6): P5 keeps all 15. With 3 (P4..P6): P4 needs 2 votes, buys P6 with 1 coin: (14, 0, 1). With 4 (P3..P6): needs 2 of 4, buys P5 with 1: (14, 0, 1, 0). With 5 (P2..P6): needs 3 of 5, buys P4 and P6 with 1 each: (13, 0, 1, 0, 1). With 6: needs 3 of 6 (a tie is enough), so 2 more votes; P3 and P5 would get 0 under P2's proposal, so they get 1 each. <b>(13, 0, 1, 0, 1, 0)</b>.`,{ramos:5});
E('m4-6',11,3,`Consider the following simultaneous move game between two players. The numbers represent the payoff of each player. The game is played twice, and players discount the second period according to the interest rate r. They consider the following agreement: play (Coop, Coop) in period 1; in period 2, play (Med, Med) if no one deviated in period 1, and (Low, Low) otherwise. This agreement is a subgame perfect equilibrium (SPE) if and only if ______.`,
 ['r ≤ 1/3','r ≤ 1/2','r ≤ 2','r ≤ 3','The agreement is never an SPE: in a finitely repeated game, players can only play Nash equilibria of the stage game.'],'C',
 `Both (Med, Med) and (Low, Low) are Nash equilibria of the stage game, so the period-2 threat is credible. Follow the agreement: 6 + 4/(1 + r). Deviate in period 1 (Med against Coop): 7 + 1/(1 + r). Follow if 3/(1 + r) ≥ 1, so 1 + r ≤ 3 and <b>r ≤ 2</b>. Multiple stage-game equilibria are what make cooperation possible in a finite game.`,
 {ramos:6,fig:mx(['Coop','Med','Low'],['Coop','Med','Low'],[['6,6','1,7','0,0'],['7,1','4,4','0,0'],['0,0','0,0','1,1']],{cap:false})});
E('m4-7',11,2,`Consider the following simultaneous move game between two firms. Each firm can charge either a low or a high price. The numbers represent the profit of each firm at each period. This game is repeated infinitely many times, and at each period both players must choose their actions simultaneously. The players are deciding whether or not to cooperate, specifically, whether or not to follow this cooperation strategy: "Each player will play High Price as long as no one has played Low Price before. If someone has played Low Price before, then each player will play Low Price forever". Players discount the future according to the interest rate r. In this case, cooperation will be possible if`,
 ['r ≤ 5/6','r ≤ 1/2','r ≤ 1','r ≤ 2','full cooperation cannot be achieved in this game'],'D',
 `Cooperate: 12 + 12/r. Deviate: 15 + 6/r (then (Low, Low) forever pays 6). Cooperate if 12 + 12/r ≥ 15 + 6/r, so 6/r ≥ 3 and <b>r ≤ 2</b>. The formula sheet gives PV = x/r for a payment x every period starting next period.`,
 {ramos:7,fig:mx(['High Price','Low Price'],['High Price','Low Price'],[['12,12','5,15'],['15,5','6,6']],{p1:'Firm 1',p2:'Firm 2',cap:false})});
E('m4-8',11,3,`Consider the following bargaining game. Sisters Anna and Elsa received an inheritance comprised of three cars. Each car is worth the following: Red Car: $42,000; White Car: $36,000; Blue Car: $22,000. They have to decide how to split the inheritance. Anna starts the game with two options: she can ask their lawyer to sell all cars, or she can make an offer to Elsa. If Anna asks the lawyer to sell the cars, then the lawyer sells all the cars for $100,000, keeps 10% of the sales for himself as a fee, and splits the remaining $90,000 between the sisters. Therefore, each sister receives $45,000 and the game is over. If Anna does not ask the lawyer to sell the car, then Anna must make a take-it-or-leave-it offer to Elsa. Anna offers which car(s) she wants to give to Elsa. If Elsa accepts the offer, then Elsa keeps the car(s) offered by Anna, while Anna keeps the remaining car(s). If Elsa rejects Anna's offer, then Elsa will sell all cars herself, keep $57,000 and give $43,000 to Anna. The goal of each sister is to receive as much as possible from the inheritance, either in the form of cars (given their value as listed above) or cash. Compute the subgame perfect equilibrium (SPE) of this game. Anna will`,
 ['offer to Elsa only the Red Car','offer to Elsa both the Red Car and the White car','offer to Elsa both the White car and the Blue Car','offer to Elsa both the Red Car and the Blue Car','Ask the lawyer to sell the cars'],'E',
 `Elsa accepts an offer only if the cars are worth at least $57,000 to her (what she gets by rejecting). The cheapest acceptable offer for Anna is White + Blue = $58,000, which leaves Anna the Red Car worth $42,000. Every other acceptable offer leaves her even less. Rejection would give Anna only $43,000. Since $45,000 from the lawyer beats all of these, Anna <b>asks the lawyer to sell the cars</b>.`,{ramos:8});

Z('cp-1',11,2,`Centipede game with four periods. In periods 1 and 3 Player 1 chooses Take or Share; in periods 2 and 4 Player 2 chooses Take or Share. Taking ends the game with the payoffs shown, and if everybody always Shares the payoffs are (4,4). In the SPE, in which period does the game end?`,'Period 1: Player 1 takes and the payoffs are (2, 0)',['Period 2: Player 2 takes and the payoffs are (1, 3)','Period 3: Player 1 takes and the payoffs are (4, 2)','Period 4: Player 2 takes and the payoffs are (3, 5)','Nobody takes: both players share every period and get (4, 4)'],`Backward induction from period 4: P2 takes (5 &gt; 4). Period 3: P1 takes (4 versus 3 if he shares). Period 2: P2 takes (3 versus 2). Period 1: P1 takes (2 versus 1). The cooperative (4,4) is not an equilibrium although both would prefer it.`,
 {fig:tree(N(1,[['Take',lf(2,0)],['Share',N(2,[['Take',lf(1,3)],['Share',N(1,[['Take',lf(4,2)],['Share',N(2,[['Take',lf(3,5)],['Share',lf(4,4)]])]])]])]]))});
Z('cp-2',11,2,`In the centipede game with 100 periods (a partnership that can generate $2 every period, where Share keeps it going and Take ends it), backward induction says that`,'the game ends in period 1, when Player 1 takes the money',['the game ends in period 100, when Player 2 takes the money','the game ends in the middle, around period 50','players share in every period','the game ends in period 99'],`In period 100 Player 2 takes. In period 99 Player 1 takes, knowing what happens next, and so on back to period 1. The result does not depend on the number of periods.`);
Z('cp-3',11,1,`In the sequential game below, Firm 1 chooses City A or City B and Firm 2 observes the choice and then chooses City A or City B. How many different strategies does Firm 2 have?`,'4',['2','3','8','1'],`A strategy must say what the player does at <i>every</i> decision node. Firm 2 has two decision nodes (after City A and after City B) with two actions at each: 2 × 2 = <b>4</b> strategies.`,
 {fig:tree(N(1,[['City A',N(2,[['City A',lf(3,2)],['City B',lf(1,1)]])],['City B',N(2,[['City A',lf(0,0)],['City B',lf(2,3)]])]]),{names:['Firm 1','Firm 2']})});
E('cp-4',11,3,`Same game (Firm 1: City A or City B; then Firm 2 observes. After City A the payoffs are (3,2) for City A and (1,1) for City B; after City B they are (0,0) for City A and (2,3) for City B). Firm 1 chooses City B. Firm 2 chooses City B whatever Firm 1 does. Is this a Nash equilibrium?`,['Yes','No: Firm 1 gains by choosing City A','No: after City A, Firm 2 gains by choosing City A','No: both gain at (City A, City A)','Yes, and it is also a subgame perfect equilibrium'],'A',
 `Given Firm 2's strategy, Firm 1 earns 2 from City B and only 1 from City A, so he does not want to deviate. Firm 2's choice after City A is never reached, so it cannot be improved on the path. It <b>is a Nash equilibrium</b>, but it rests on an empty threat: after City A, Firm 2 would really prefer City A (2 &gt; 1). It is <i>not</i> subgame perfect. The SPE is Firm 1 City A, Firm 2 (City A after A, City B after B).`,
 {fig:tree(N(1,[['City A',N(2,[['City A',lf(3,2)],['City B',lf(1,1)]])],['City B',N(2,[['City A',lf(0,0)],['City B',lf(2,3)]])]]),{names:['Firm 1','Firm 2']})});
Z('cp-5',11,2,`In the sequential game below (Firm 1 picks A or B; Firm 2 observes; payoffs after A: (3,2) or (1,1); after B: (0,0) or (2,3)), what is the subgame perfect equilibrium outcome?`,'Firm 1 plays City A, Firm 2 plays City A after A and City B after B: payoffs (3, 2)',['Firm 1 plays City B and Firm 2 plays City B: payoffs (2, 3)','Firm 1 plays City A and Firm 2 plays City B: payoffs (1, 1)','Firm 1 plays City B and Firm 2 plays City A: payoffs (0, 0)'],`Firm 2: after City A she prefers City A (2 &gt; 1); after City B she prefers City B (3 &gt; 0). Firm 1 compares 3 (City A) and 2 (City B) and plays City A. SPE payoffs (3, 2).`,
 {fig:tree(N(1,[['City A',N(2,[['City A',lf(3,2)],['City B',lf(1,1)]])],['City B',N(2,[['City A',lf(0,0)],['City B',lf(2,3)]])]]),{names:['Firm 1','Firm 2']})});
E('ed-1',11,1,`Entry deterrence game (high cost of war). A potential entrant chooses Enter or Stay Out. If it stays out the payoffs are (0, 10). If it enters, the incumbent chooses Accommodate, giving payoffs (4, 5), or Price War, giving payoffs (−1, 3). The first number is the entrant's payoff. Solve by backward induction. What happens?`,['The entrant enters, the incumbent accommodates','The entrant enters, the incumbent starts a price war','The entrant stays out','The entrant stays out and the incumbent starts a price war','The incumbent threatens a price war and the entrant believes it'],'A',
 `After Enter the incumbent compares Accommodate (5) and Price War (3) and accommodates. The entrant compares Stay Out (0) with Enter (4) and enters. The threat of a price war is <b>not credible</b>.`,
 {fig:tree(N(1,[['Enter',N(2,[['Accommodate',lf(4,5)],['Price War',lf(-1,3)]])],['Stay Out',lf(0,10)]]),{names:['Entrant','Incumbent']})});
E('ed-2',11,2,`Entry deterrence game (low cost of war). Only one payoff changed from the previous question: after a price war, the incumbent now gets 6 instead of 3, so Price War gives (−1, 6). Stay Out still gives (0, 10) and Accommodate (4, 5). Solve by backward induction. What happens?`,['The entrant enters, the incumbent accommodates','The entrant enters, the incumbent starts a price war','The entrant stays out','The entrant stays out and the incumbent accommodates','Both firms are indifferent'],'C',
 `After Enter the incumbent now prefers a price war (6 &gt; 5), so the threat is credible. The entrant compares −1 from entering with 0 from staying out and <b>stays out</b>. The incumbent keeps 10.`,
 {fig:tree(N(1,[['Enter',N(2,[['Accommodate',lf(4,5)],['Price War',lf(-1,6)]])],['Stay Out',lf(0,10)]]),{names:['Entrant','Incumbent']})});
Z('ed-3',11,2,`Why might an incumbent monopolist maintain sufficiently large extra production capacity?`,'It lowers the cost of fighting a price war, which makes the threat of a price war credible',['It raises the entrant\'s profit from entering','It makes the incumbent accommodate after entry','It increases the incumbent\'s costs, which discourages the entrant from entering'],`Extra capacity changes the incumbent's payoffs after entry. With a lower cost of war, a price war becomes the incumbent's best response, so the deterrence threat is credible and the entrant stays out.`);
E('tr-1',11,3,`Tesla (leader) and Rivian (follower) compete in quantities. Market demand: P = 100 − Q, where Q = Q<sub>1</sub> + Q<sub>2</sub> (Tesla is Firm 1, Rivian is Firm 2). Costs: C<sub>1</sub> = 30Q<sub>1</sub>, C<sub>2</sub> = 20Q<sub>2</sub>. Tesla chooses its quantity first, and Rivian observes it and then chooses its own. In the SPE, the price is`,['P = 30','P = 35','P = 45','P = 55','P = 60'],'C',
 `Rivian: π<sub>2</sub> = (100 − Q<sub>1</sub> − Q<sub>2</sub> − 20)Q<sub>2</sub>, FOC 80 − Q<sub>1</sub> − 2Q<sub>2</sub> = 0, so Q<sub>2</sub> = 40 − 0.5Q<sub>1</sub>. Tesla: π<sub>1</sub> = (70 − Q<sub>1</sub> − (40 − 0.5Q<sub>1</sub>))Q<sub>1</sub> = 30Q<sub>1</sub> − 0.5Q<sub>1</sub>², FOC 30 − Q<sub>1</sub> = 0, so Q<sub>1</sub> = 30 and Q<sub>2</sub> = 25. P = 100 − 55 = <b>45</b>.`);
Z('tr-2',11,3,`In the Tesla (leader, MC = 30) and Rivian (follower, MC = 20) Stackelberg game with P = 100 − Q, the SPE is Q<sub>1</sub> = 30, Q<sub>2</sub> = 25, P = 45. Which firm earns the higher profit?`,'Rivian, the follower: 625 versus 450',['Tesla, the leader: 625 versus 450','They earn the same profit','Tesla, the leader: 1,350 versus 625'],`Tesla: (45 − 30)(30) = 450. Rivian: (45 − 20)(25) = 625. Moving second is a disadvantage, but Rivian's much lower marginal cost more than makes up for it.`);
Z('pv-1',11,1,`Action a<sub>1</sub> pays $10 today and $11 one year from now. Action a<sub>2</sub> pays $2 today and $22 one year from now. With an interest rate r = 0.10, the present values are`,'PV(a<sub>1</sub>) = 20 and PV(a<sub>2</sub>) = 22, so a<sub>2</sub> is better',['PV(a<sub>1</sub>) = 21 and PV(a<sub>2</sub>) = 24, so a<sub>2</sub> is better','PV(a<sub>1</sub>) = 22 and PV(a<sub>2</sub>) = 20, so a<sub>1</sub> is better','They are the same'],`A payment x one period from now is worth x/(1 + r) today. PV(a<sub>1</sub>) = 10 + 11/1.1 = 20. PV(a<sub>2</sub>) = 2 + 22/1.1 = 22.`);
Z('pv-2',11,2,`Same actions (a<sub>1</sub>: $10 today and $11 next year; a<sub>2</sub>: $2 today and $22 next year). Now the interest rate is r = 1 (100%). Which action has the higher present value?`,'a<sub>1</sub>: 15.5 versus 13',['a<sub>2</sub>: 22 versus 20','a<sub>2</sub>: 15.5 versus 13','They are the same'],`PV(a<sub>1</sub>) = 10 + 11/2 = 15.5. PV(a<sub>2</sub>) = 2 + 22/2 = 13. A high interest rate makes the future less valuable, which favors the action that pays more today.`);
Z('pv-3',11,3,`Action a<sub>2</sub> ($2 today and $22 next year) is better than action a<sub>1</sub> ($10 today and $11 next year) if the interest rate satisfies`,'r ≤ 0.375',['r ≥ 0.375','r ≤ 1','r ≥ 1','r ≤ 0.1'],`2 + 22/(1 + r) ≥ 10 + 11/(1 + r) means 11/(1 + r) ≥ 8 (future benefit of $11 against a cost today of $8), so 1 + r ≤ 11/8 and <b>r ≤ 0.375</b>.`);
Z('pv-4',11,1,`An investment pays $20 every period, forever, starting one period from today. The interest rate is r = 0.25. Its present value is`,'$80',['$100','$20','$25','$60'],`PV = x/r = 20/0.25 = <b>$80</b> (the formula on the exam sheet).`);
Z('rp-1',11,2,`Stage game: Prisoner's Dilemma with payoffs (Cooperate, Cooperate) = 3,3; (Don't Cooperate, Cooperate) = 4,1 for the deviator; (Don't, Don't) = 2,2. The game is repeated forever and players use the cooperation (trigger) strategy. If Player 1 deviates today while Player 2 cooperates, Player 1's present value of deviating is`,'4 + 2/r',['4 + 3/r','2 + 2/r','4 + 4/r'],`The deviator earns 4 today, and then both play Don't Cooperate forever, so each gets 2 per period from next period on: <b>4 + 2/r</b>.`);
Z('rp-2',11,3,`Same repeated Prisoner's Dilemma. The present value of cooperating forever is 3 + 3/r and of deviating is 4 + 2/r. Cooperation is possible if`,'r ≤ 1 (100%)',['r ≥ 1','r ≤ 0.5','r ≤ 3','Cooperation is never possible'],`3 + 3/r ≥ 4 + 2/r means (3 − 2)/r ≥ 4 − 3, a future benefit of 1/r against a cost today of 1, so <b>r ≤ 1</b>. Players cooperate because it is in their own interest, not because anyone forces them to.`);
Z('rp-3',11,2,`The same Prisoner's Dilemma stage game is played exactly 100 times, everybody knows the last round is number 100, and the interest rate is low. How many times do the players cooperate in the SPE?`,'Zero times',['99 times: every round except the last','Between 1 and 98 times','All 100 times'],`In round 100 both play Don't Cooperate. In round 99 there is no future cooperation to protect, so Don't Cooperate again, and so on back to round 1. Cooperation unravels completely.`);
Z('rp-4',11,3,`A Prisoner's Dilemma is played repeatedly. After each round the game continues with probability 2/3 (nobody knows when it will end). Redefine δ = 1/(1 + r). What does this correspond to, and can the players cooperate if cooperation needs r ≤ 1?`,'δ = 2/3, so r = 0.5, which is below 1: cooperation is possible',['δ = 2/3, so r = 1.5, which is above 1: cooperation is impossible','δ = 1/3, so r = 2, which is above 1: cooperation is impossible','δ = 2/3, so r = 0.5, but cooperation is impossible because the game ends'],`1/(1 + r) = 2/3 means 1 + r = 3/2 and <b>r = 0.5</b>. Since 0.5 ≤ 1, cooperation can be sustained. An uncertain end acts like discounting, so the unraveling result needs a <i>known</i> last period.`);
Z('rp-5',11,2,`Why does cooperation unravel in a finitely repeated Prisoner's Dilemma?`,'Players know exactly when the game is going to end',['The interest rate is too high','Players are impatient','The stage game has no Nash equilibrium'],`The key point of the unraveling result is that the players know the last round. If they only know that the game will end at some point, but not when, cooperation can survive.`);
Z('hw11-9',11,2,`Consider a modified Battle of the Sexes game with Player 1 playing first and Player 2 playing second after observing Player 1's choice. Payoffs: (U, L) = 3,2; (U, R) = 1,1; (D, L) = 0,0; (D, R) = 2,3. Look at the game tree. Player 2 has`,'an incentive to threaten R, which wouldn\'t be credible',['an incentive to threaten L, which would be credible','an incentive to threaten R, which would be credible','an incentive to threaten L, which wouldn\'t be credible','no incentive to make a threat'],`Player 2 would like Player 1 to play D, because (D, R) gives her 3. A believed threat to play R after U would push Player 1 to D. But after U, Player 2's best reply is L (2 &gt; 1), so the threat is <b>not credible</b>. The SPE is (U, L).`,
 {fig:tree(N(1,[['U',N(2,[['L',lf(3,2)],['R',lf(1,1)]])],['D',N(2,[['L',lf(0,0)],['R',lf(2,3)]])]]))});

E('rv-1',11,2,`Consider a sequential game. Player 1 chooses L<sub>1</sub> or R<sub>1</sub>. After L<sub>1</sub>, Player 2 chooses L<sub>2</sub> (payoffs 100, 1) or R<sub>2</sub> (payoffs 1, 2). After R<sub>1</sub>, Player 2 chooses L<sub>2</sub> (payoffs 0, 3) or R<sub>2</sub> (payoffs 2, 2). A strategy is written (P1, P2 after L<sub>1</sub>, P2 after R<sub>1</sub>). What is the subgame perfect equilibrium?`,['(L<sub>1</sub>, L<sub>2</sub>, L<sub>2</sub>)','(L<sub>1</sub>, R<sub>2</sub>, L<sub>2</sub>)','(R<sub>1</sub>, R<sub>2</sub>, L<sub>2</sub>)','(L<sub>1</sub>, R<sub>2</sub>)','(R<sub>1</sub>, L<sub>2</sub>, R<sub>2</sub>)'],'B',
 `Player 2 moves last: after L<sub>1</sub> she picks R<sub>2</sub> (2 &gt; 1); after R<sub>1</sub> she picks L<sub>2</sub> (3 &gt; 2). Player 1 compares L<sub>1</sub> → 1 and R<sub>1</sub> → 0, and plays L<sub>1</sub>. SPE: <b>(L<sub>1</sub>, R<sub>2</sub>, L<sub>2</sub>)</b>. A strategy must say what Player 2 does at <i>every</i> node, so (D) is incomplete.`,
 {fig:tree(N(1,[['L₁',N(2,[['L₂',lf(100,1)],['R₂',lf(1,2)]])],['R₁',N(2,[['L₂',lf(0,3)],['R₂',lf(2,2)]])]]))});
E('rv-2',11,3,`Stackelberg model. Demand: Q = 50 − 2P. Firm 1 (first mover) has MC = 1. Firm 2 (second mover) has MC = 3. There is no fixed cost. What is Firm 1's quantity?`,['Q<sub>1</sub> = 24','Q<sub>1</sub> = 26','Q<sub>1</sub> = 17.3','Q<sub>1</sub> = 9','Q<sub>1</sub> = 35'],'B',
 `Inverse demand: P = 25 − 0.5Q. Firm 2: MR<sub>2</sub> = 25 − 0.5Q<sub>1</sub> − Q<sub>2</sub> = 3, so Q<sub>2</sub> = 22 − 0.5Q<sub>1</sub>. Firm 1: P = 14 − 0.25Q<sub>1</sub>, MR<sub>1</sub> = 14 − 0.5Q<sub>1</sub> = 1, so <b>Q<sub>1</sub> = 26</b>. Then Q<sub>2</sub> = 9 and P = 7.5.`);
Z('rv-3',11,3,`Same Stackelberg market (Q = 50 − 2P, Firm 1 leader with MC = 1, Firm 2 follower with MC = 3). In the SPE Q<sub>1</sub> = 26, Q<sub>2</sub> = 9 and P = 7.5. What is Firm 1's profit?`,'169',['168','156','175.5','195'],`Profit<sub>1</sub> = (7.5 − 1)(26) = <b>169</b>.`);
E('rv-4',11,3,`Same Stackelberg market. Can Firm 1 do better by producing the monopoly quantity, Q<sub>1</sub> = 24?`,['Yes: Q<sub>1</sub> = 24 maximizes a monopolist\'s profit','Yes: with Q<sub>1</sub> = 24 the price is higher','No: Firm 2 responds by producing more, and Firm 1\'s profit falls','No: Firm 2 would leave the market','No: Firm 1 would lose money'],'C',
 `Firm 2 still best responds: Q<sub>2</sub> = 22 − 12 = 10, so P = 25 − 17 = 8 and Firm 1 earns (8 − 1)(24) = 168, less than 169 in the Stackelberg equilibrium. The monopoly quantity ignores Firm 2's reaction.`);
E('rv-5',11,3,`Stage game (payoffs Player 1, Player 2): (Cooperate, Cooperate) = 15,15; (Cooperate, Not Cooperate) = −20,30; (Not Cooperate, Cooperate) = 20,−10; (Not Cooperate, Not Cooperate) = 10,10. The game is repeated infinitely and Player 2 plays a cooperative grim-trigger strategy. For what values of the interest rate r does Player 1 best respond by cooperating?`,['r ≤ 1','r ≤ 1/3','1/3 ≤ r ≤ 1','r ≥ 1','r ≤ 1/2'],'A',
 `Cooperate: 15 + 15/r. Deviate: 20 + 10/r. Cooperate if 5/r ≥ 5, so <b>r ≤ 1</b>.`,{fig:mx(['Cooperate','Not Cooperate'],['Cooperate','Not Cooperate'],[['15,15','-20,30'],['20,-10','10,10']],{cap:false})});
E('rv-6',11,3,`Same repeated game. For what values of r is it a Nash equilibrium for <b>both</b> players to play the cooperative grim-trigger strategy?`,['r ≤ 1','r ≤ 1/3','1/3 ≤ r ≤ 1','r ≥ 1','r ≤ 1/2'],'B',
 `Player 1 needs r ≤ 1. Player 2 earns 30 when he deviates: 15 + 15/r ≥ 30 + 10/r, so 5/r ≥ 15 and r ≤ 1/3. Both must not deviate, so <b>r ≤ 1/3</b>. The player with the bigger deviation gain is the binding one.`,{fig:mx(['Cooperate','Not Cooperate'],['Cooperate','Not Cooperate'],[['15,15','-20,30'],['20,-10','10,10']],{cap:false})});

/* ===== CHAPTER 12: ASYMMETRIC INFORMATION ===== */
E('c12-1',12,2,`How many of the following options are best described as examples of adverse selection?<br>I - Lemons problem in the market for used cars<br>II - Risk Averse individuals in the market for extra health care coverage<br>III - Risk Averse drivers purchasing extra auto insurance<br>IV - The fact that managers cannot directly observe the actions of workers`,['All four options','Zero options','One option only','Two options only','Three options only'],'C',
 `Only I is adverse selection (hidden type before the deal). II and III are just risk-averse consumers' preferences. IV is moral hazard (hidden action after the deal).`);
E('c12-2',12,1,`Consider the following two examples:<br>I - Unhealthy people are more likely to want health insurance;<br>II - A consumer with complete medical insurance may visit the doctor more often than he would if his coverage were limited.`,['Both are examples of Adverse Selection','Both are examples of Moral Hazard','Example I is Moral Hazard; Example II is Adverse Selection','Example I is Adverse Selection; Example II is Moral Hazard.','Both are examples of the Lemons Problem'],'D',
 `I: hidden <i>type</i> drives who buys: <b>adverse selection</b>. II: insurance changes behavior after buying: <b>moral hazard</b>.`);
E('c12-3',12,2,`Suppose California's government decides to outlaw the sharing of individuals' credit histories as an illegal invasion of privacy. As a result of this action we would expect the<br>I - cost of borrowing money to decrease<br>II - number of loans to unworthy credit risks to increase<br>III - problems of asymmetric information to become more severe`,['I, II and III are true.','I, II and III are false.','I is true, II and III are false.','II and III are true, I is false.','III is true, I and II are false.'],'D',
 `Lenders lose information about borrowers, so more bad risks get loans (II) and information problems worsen (III). Lenders protect themselves with higher rates, so the cost of borrowing rises, not falls (I false).`);
E('c12-4',12,1,`When firms participate in group health insurance for all employees, it might reduce health insurance premiums because it reduces the ______ problem`,['free rider','moral hazard','principal-agent','adverse selection','winner\'s curse'],'D',
 `A group plan covers everyone, healthy and unhealthy, so the insurer is not left with only the sickest customers: it reduces <b>adverse selection</b>.`);
E('c12-5',12,3,`For workers in Group A (high skill workers) the cost of attaining an educational level y is C<sub>A</sub>(y) = $10y; for workers in Group B (low skill workers) the cost of attaining an educational level y is C<sub>B</sub>(y) = $20y. Employees will be offered $40 if they have y ≥ y*, where y* is an educational threshold determined by the employer. They will be offered $20 if they have y &lt; y*. In equilibrium, education can be used as a signal of the worker's true type if`,['2 ≥ y* ≥ 1','4 ≥ y* ≥ 2','4 ≥ y* ≥ 1.33','2 ≥ y* ≥ 1.33','4 ≥ y* ≥ 1'],'A',
 `Group A must want to get educated: 40 − 10y* ≥ 20, so y* ≤ 2. Group B must not: 40 − 20y* ≤ 20, so y* ≥ 1. Therefore <b>1 ≤ y* ≤ 2</b>.`);
Z('c12-6',12,2,`For workers in Group A (high skill) the cost of education y is C<sub>A</sub>(y) = $10y; for Group B (low skill) it is C<sub>B</sub>(y) = $20y. Employees will be offered $40 if they have 5 or more years of education and $20 if they have less than 5 years. In this case, can education be used as a market signal of the worker's skill?`,'No: with y* = 5 neither group finds education worthwhile, so no one is educated',['Yes: Group A will be educated and Group B will not','Yes: both groups will be educated','No: Group B will be educated and Group A will not','Yes, because the wage gap is large'],`Group A: 40 − 50 = −10 &lt; 20, so A does not get educated either. Nobody does, so education carries no information.`);
E('c12-7',12,3,`For workers in Group A (high skill workers) the cost of attaining an educational level y is C<sub>A</sub>(y) = $10y; for workers in Group B (low skill workers) the cost is C<sub>B</sub>(y) = $15y. Employees will be offered $40 if they have y ≥ y*, and $20 if they have y &lt; y*. On top of this amount, firms also pay $5 for every year of education (y is the number of years of education). In equilibrium, education can be used as a signal of the worker's true type if`,['2 ≥ y* ≥ 1','4 ≥ y* ≥ 2','4 ≥ y* ≥ 1.33','2 ≥ y* ≥ 1.33','4 ≥ y* ≥ 1'],'B',
 `Group A: 40 + 5y* − 10y* ≥ 20, so y* ≤ 4. Group B: 40 + 5y* − 15y* ≤ 20, so y* ≥ 2. Therefore <b>2 ≤ y* ≤ 4</b>. The per-year payment lowers the net cost of education.`);
E('c12-8',12,3,`It takes y* years to graduate from college. For workers in Group A (high skill workers) the cost of going to college is $6 per year (Cost<sub>A</sub> = 6y*). For workers in Group B (low skill workers) the cost is $12 per year (Cost<sub>B</sub> = 12y*). In addition, each worker must pay a one time enrollment fee of $8, independent of skill and of y*. Employers observe whether or not workers graduated. Employees will be offered $70 if they graduate from college, and $20 if they don't have a college degree. In equilibrium, a college degree can be used as a signal of the worker's true type if`,['5 ≥ y* ≥ 2.5','7 ≥ y* ≥ 2.5','5 ≥ y* ≥ 3.5','7 ≥ y* ≥ 3.5','Because of the fixed cost, workers optimally choose not to go to college, independently of y*'],'D',
 `Group A: 70 − 6y* − 8 ≥ 20, so y* ≤ 7. Group B: 70 − 12y* − 8 ≤ 20, so y* ≥ 3.5. Therefore <b>3.5 ≤ y* ≤ 7</b>. The enrollment fee is the same for both groups, so it does not separate them but it does shrink the net benefit.`);
E('c12-9',12,3,`Firm 1 produces high-quality cars. Its marginal cost is $3,000. Firm 1 can also offer y years of warranty. The expected cost of the warranty for Firm 1 is $2,000 per year. Firm 2 produces low-quality cars. Its marginal cost is $2,000. Firm 2 can also offer y years of warranty. The expected cost of the warranty for Firm 2 is $3,000 per year. Consumers cannot observe the quality of the car. Consumers are willing to pay $8,000 for high-quality cars, and $5,000 for low-quality cars. Moreover, consumers are also willing to pay an additional $1,000 for each year of warranty offered. Consumers believe that only high-quality cars have y* years of warranty. Find the minimum and the maximum values of the threshold y* such that the consumers' beliefs will be consistent with the optimal behavior of the firms.`,['5 ≥ y* ≥ 2','3 ≥ y* ≥ 2','3 ≥ y* ≥ 1.5','2 ≥ y* ≥ 1.5','5 ≥ y* ≥ 3'],'C',
 `Firm 1 offers the warranty if 8,000 + 1,000y* − 3,000 − 2,000y* ≥ 5,000 − 3,000, so y* ≤ 3. Firm 2 does not offer it if 8,000 + 1,000y* − 2,000 − 3,000y* ≤ 5,000 − 2,000, so y* ≥ 1.5. Therefore <b>1.5 ≤ y* ≤ 3</b>.`);
E('c12-10',12,3,`Firm 1 produces high-quality cars. Its marginal cost is $3,000. Firm 1 can also offer y years of warranty. The expected cost of the warranty for Firm 1 is $1,000 per year. Firm 2 produces low-quality cars. Its marginal cost is $1,000. The expected cost of the warranty for Firm 2 is $3,500 per year. Consumers cannot observe the quality of the car. Consumers are willing to pay $6,000 for high-quality cars, and $3,000 for low-quality cars. Moreover, consumers are also willing to pay an additional $500 for each year of warranty offered. Consumers believe that only high-quality cars have y* years of warranty. Find the minimum and the maximum values of the threshold y* such that the consumers' belief will be consistent with the optimal behavior of the firms.`,['6 ≥ y* ≥ 2','4 ≥ y* ≥ 2','4 ≥ y* ≥ 1','6 ≥ y* ≥ 1','None of the above'],'D',
 `Firm 1 offers the warranty if 6,000 + 500y* − 3,000 − 1,000y* ≥ 3,000 − 3,000, so y* ≤ 6. Firm 2 does not offer it if 6,000 + 500y* − 1,000 − 3,500y* ≤ 3,000 − 1,000, so y* ≥ 1. Therefore <b>1 ≤ y* ≤ 6</b>.`);
